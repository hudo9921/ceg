services:
  - type: web
    name: ceg-manager
    runtime: python
    plan: free
    region: oregon
    buildCommand: "./build.sh"
    startCommand: "gunicorn ceg_project.wsgi:application"
    healthCheckPath: "/"
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ceg-database
          property: connectionString
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: WHATSAPP_PROVIDER
        value: "console"

databases:
  - name: ceg-database
    plan: free
    region: oregon
    databaseName: cegdb
    user: ceguser
