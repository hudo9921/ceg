services:
  - type: web
    name: valcegs
    runtime: python
    plan: free
    region: oregon
    buildCommand: "bash ./build.sh"
    startCommand: "gunicorn ceg_project.wsgi:application --workers 1 --threads 4 --worker-class gthread --worker-tmp-dir /dev/shm --max-requests 250 --max-requests-jitter 25 --timeout 60"
    healthCheckPath: "/health/"
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: WHATSAPP_PROVIDER
        value: "console"
      # Credenciais do Superusuário Admin
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Cloudflare R2 (Armazenamento de Imagens/Links na Nuvem)
      - key: USE_R2
        value: "False"
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_ENDPOINT_URL
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_CUSTOM_DOMAIN
        sync: false
      # WhatsApp Gateway (Evolution API / Z-API)
      - key: EVOLUTION_API_URL
        sync: false
      - key: EVOLUTION_API_KEY
        sync: false
      - key: EVOLUTION_INSTANCE_NAME
        value: "ceg-bot"
      - key: ZAPI_INSTANCE_ID
        sync: false
      - key: ZAPI_TOKEN
        sync: false

