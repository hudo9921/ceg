services:
  - type: web
    name: ceg-manager
    runtime: python
    plan: free
    region: oregon
    buildCommand: "bash ./build.sh"
    startCommand: "gunicorn ceg_project.wsgi:application"
    healthCheckPath: "/"
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ceg-database
          property: connectionString
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: WHATSAPP_PROVIDER
        value: "console"
      # Cloudflare R2 (Armazenamento de Imagens/Links na Nuvem)
      - key: USE_R2
        value: "False"
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_ENDPOINT_URL
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_CUSTOM_DOMAIN
        sync: false
      # WhatsApp Gateway (Evolution API / Z-API)
      - key: EVOLUTION_API_URL
        sync: false
      - key: EVOLUTION_API_KEY
        sync: false
      - key: EVOLUTION_INSTANCE_NAME
        value: "ceg-bot"
      - key: ZAPI_INSTANCE_ID
        sync: false
      - key: ZAPI_TOKEN
        sync: false

databases:
  - name: ceg-database
    plan: free
    region: oregon
    databaseName: cegdb
    user: ceguser
