<!-- Header & Status do Bot -->
<div class="flex flex-col md:flex-row md:items-center md:justify-between mb-8 pb-5 border-b border-slate-200 dark:border-slate-800 gap-4">
    <div>
        <div class="flex items-center gap-2.5 mb-1.5">
            <div class="p-2 rounded-xl bg-pink-100 dark:bg-pink-950/50 text-pink-600 dark:text-pink-400 border border-pink-200 dark:border-pink-900/40 shadow-xs">
                <i data-lucide="bot" class="w-5 h-5 stroke-[2]"></i>
            </div>
            <h1 class="text-2xl font-black text-slate-900 dark:text-white tracking-tight">
                Gestão do Bot WhatsApp
            </h1>
            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-pink-100 dark:bg-pink-950/60 text-pink-700 dark:text-pink-300 border border-pink-200 dark:border-pink-900/40">
                Evolution API v2.3.0
            </span>
        </div>
        <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400">
            Instância: <code class="font-bold text-slate-800 dark:text-slate-200 bg-slate-100 dark:bg-slate-800 px-1.5 py-0.5 rounded">{{ instance_name }}</code> &bull; Provedor: <code class="font-bold text-slate-800 dark:text-slate-200 bg-slate-100 dark:bg-slate-800 px-1.5 py-0.5 rounded">{{ provider_name }}</code>
        </p>
    </div>
    
    <div class="flex items-center gap-2">
        <template x-if="state === 'open'">
            <span class="inline-flex items-center px-3.5 py-1.5 rounded-full text-xs font-black bg-emerald-100 dark:bg-emerald-950/50 text-emerald-800 dark:text-emerald-300 border border-emerald-300 dark:border-emerald-800 shadow-xs">
                <span class="w-2.5 h-2.5 mr-2 rounded-full bg-emerald-500 animate-pulse"></span>
                WhatsApp Conectado
            </span>
        </template>
        <template x-if="state !== 'open'">
            <span class="inline-flex items-center px-3.5 py-1.5 rounded-full text-xs font-black bg-amber-100 dark:bg-amber-950/50 text-amber-800 dark:text-amber-300 border border-amber-300 dark:border-amber-800 shadow-xs">
                <span class="w-2.5 h-2.5 mr-2 rounded-full bg-amber-500 animate-ping"></span>
                Aguardando Conexão
            </span>
        </template>
    </div>
</div>

<!-- Mensagens do Django -->
{% if messages %}
<div class="mb-6 space-y-2">
    {% for message in messages %}
    <div class="p-4 rounded-xl text-xs sm:text-sm font-medium border shadow-xs {% if message.tags == 'success' %}bg-emerald-50 dark:bg-emerald-950/40 text-emerald-800 dark:text-emerald-300 border-emerald-200 dark:border-emerald-800{% elif message.tags == 'error' %}bg-rose-50 dark:bg-rose-950/40 text-rose-800 dark:text-rose-300 border-rose-200 dark:border-rose-800{% else %}bg-sky-50 dark:bg-sky-950/40 text-sky-800 dark:text-sky-300 border-sky-200 dark:border-sky-800{% endif %}">
        {{ message }}
    </div>
    {% endfor %}
</div>
{% endif %}
