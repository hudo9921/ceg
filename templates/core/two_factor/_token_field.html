{% comment %}Campo do código de 6 dígitos (ou código de recuperação quando allow_backup).{% endcomment %}
<div class="space-y-1.5">
    <label for="token" class="block text-xs font-bold text-slate-700 dark:text-slate-300 text-center">
        {% if allow_backup %}Código do aplicativo ou de recuperação{% else %}Código de 6 dígitos do aplicativo{% endif %}
    </label>
    <input id="token" type="text" name="token" required autofocus autocomplete="one-time-code"
           {% if allow_backup %}maxlength="16" inputmode="text"{% else %}maxlength="6" inputmode="numeric" pattern="[0-9]{6}"{% endif %}
           placeholder="{% if allow_backup %}123456 ou abcd2345{% else %}123456{% endif %}"
           class="w-full text-center text-2xl font-mono font-black tracking-widest px-4 py-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-emerald-500/30 focus:border-emerald-500 transition">
</div>
<input type="hidden" name="next" value="{{ next_url }}">
<button type="submit"
        class="w-full py-3.5 bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-600 hover:to-teal-600 text-white font-black text-sm rounded-2xl shadow-md active:scale-[0.99] transition flex items-center justify-center gap-2 cursor-pointer">
    <i data-lucide="lock-keyhole" class="w-4 h-4" stroke-width="1.75"></i>
    <span>{{ submit_label|default:"Verificar" }}</span>
</button>
