<!-- Atualizar Foto / Proof com Dropzone e Ctrl+V -->
<div class="p-3.5 bg-slate-50 dark:bg-cyber-obsidian border border-slate-200 dark:border-white/10 rounded-2xl space-y-2.5">
    <div class="flex items-center justify-between">
        <label class="text-xs font-bold text-slate-800 dark:text-slate-200 flex items-center gap-1">
            <i data-lucide="image" class="w-3.5 h-3.5 text-pink-500"></i>
            <span>Foto / Proof do Item</span>
        </label>
        <span class="text-[10px] text-slate-500 dark:text-slate-400 font-medium">Ctrl+V, Arquivo ou URL</span>
    </div>

    <div class="relative border-2 border-dashed rounded-xl p-3 text-center transition-all bg-white dark:bg-cyber-surface"
         :class="itemDragOver ? 'border-amber-500 bg-amber-50/40 ring-2 ring-amber-300' : 'border-slate-300 dark:border-white/10 hover:border-slate-400'"
         @dragover.prevent="itemDragOver = true"
         @dragleave.prevent="itemDragOver = false"
         @drop.prevent="itemDragOver = false; handleFileChange($event)">

        <template x-if="itemImagePreview || editingItem.image_url">
            <div class="flex items-center justify-center gap-3">
                <img :src="itemImagePreview || editingItem.image_url" class="w-20 h-20 object-cover rounded-xl border border-slate-200 dark:border-white/10 shadow-sm">
                <div class="text-left space-y-1">
                    <span class="text-[11px] font-bold text-emerald-600 dark:text-emerald-400 block flex items-center gap-1">
                        <i data-lucide="check" class="w-3 h-3"></i> Imagem definida
                    </span>
                    <button type="button" @click="clearImage()" class="text-xs text-rose-600 dark:text-rose-400 font-bold hover:underline cursor-pointer">
                        Remover / Trocar
                    </button>
                </div>
            </div>
        </template>

        <div x-show="!itemImagePreview && !editingItem.image_url" class="space-y-1 py-1">
            <i data-lucide="clipboard-copy" class="w-6 h-6 mx-auto text-slate-400 mb-1"></i>
            <p class="text-xs font-bold text-slate-800 dark:text-slate-200">
                Dê <kbd class="px-1.5 py-0.5 bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-white/10 rounded text-amber-700 dark:text-amber-400 font-mono font-black">Ctrl + V</kbd> nesta tela
            </p>
            <p class="text-[10px] text-slate-500 dark:text-slate-400">
                Ou arraste e solte / clique para selecionar:
            </p>
            <input type="file" name="foto_arquivo" accept="image/*" @change="handleFileChange($event)"
                   class="text-[11px] text-slate-500 file:mr-2 file:py-1 file:px-2.5 file:rounded-lg file:border-0 file:text-[11px] file:font-bold file:bg-amber-100 file:text-amber-800 hover:file:bg-amber-200 cursor-pointer">
        </div>
    </div>

    <div>
        <label class="block text-[10px] font-bold text-slate-600 dark:text-slate-400 mb-1">Ou cole o link direto da imagem:</label>
        <input type="text" name="foto_url" x-model="itemImageUrl" :value="editingItem.image_url" @input="handleUrlChange()"
               placeholder="https://exemplo.com/foto-proof.jpg"
               class="w-full bg-white dark:bg-cyber-surface border border-slate-200 dark:border-white/10 rounded-xl px-3 py-1.5 text-xs focus:ring-2 focus:ring-amber-500 transition">
    </div>
</div>
