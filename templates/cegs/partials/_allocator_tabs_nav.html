<!-- Navegação por Abas -->
<div class="flex items-center justify-between border-b border-slate-200 dark:border-white/10 pb-2">
    <div class="flex items-center gap-2">
        <button type="button"
                @click="activeTab = 'matrix'"
                :class="activeTab === 'matrix' ? 'bg-indigo-600 text-white shadow-sm' : 'bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700'"
                class="px-5 py-2.5 rounded-xl text-xs font-black transition flex items-center gap-2 cursor-pointer">
            <i data-lucide="layout-grid" class="w-4 h-4"></i>
            <span>Matriz Visual Interativa</span>
            <span x-show="pendingMatrixChangesCount > 0"
                  class="px-1.5 py-0.5 rounded-full bg-amber-400 text-slate-900 text-[10px] font-black"
                  x-text="pendingMatrixChangesCount"></span>
        </button>
        <button type="button"
                @click="activeTab = 'paste'"
                :class="activeTab === 'paste' ? 'bg-indigo-600 text-white shadow-sm' : 'bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700'"
                class="px-5 py-2.5 rounded-xl text-xs font-black transition flex items-center gap-2 cursor-pointer">
            <i data-lucide="clipboard-paste" class="w-4 h-4"></i>
            <span>Colar em Lote (Excel / Forms)</span>
        </button>
    </div>

    <div class="text-xs text-slate-500 dark:text-slate-400 font-semibold hidden sm:block">
        <span x-text="participants.length"></span> participantes cadastrados no sistema
    </div>
</div>
