<!-- Linha 5: Descrição e Caixa de Origem -->
<div class="grid grid-cols-1 sm:grid-cols-12 gap-4">
    <div class="sm:col-span-8 space-y-1.5">
        <label class="block text-xs font-bold text-slate-700 dark:text-slate-300">
            Descrição / Detalhes Adicionais
        </label>
        <textarea name="descricao" rows="3"
                  placeholder="Observações de conservação, brinde incluso, etc."
                  class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 rounded-xl text-xs sm:text-sm text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-pink-500/30 focus:border-pink-500 transition">{% if item %}{{ item.descricao }}{% endif %}</textarea>
    </div>

    <div class="sm:col-span-4 space-y-3">
        <div class="space-y-1.5">
            <label class="block text-xs font-bold text-slate-700 dark:text-slate-300">
                Caixa / Remessa de Origem
            </label>
            <select name="origem_caixa"
                    class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 rounded-xl text-xs font-semibold text-slate-800 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-pink-500/30 transition">
                <option value="">Nenhuma (Item avulso)</option>
                {% for c in caixas %}
                    <option value="{{ c.id }}" {% if item and item.origem_caixa_id == c.id %}selected{% endif %}>
                        {{ c.nome }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <!-- Destaque Checkbox -->
        <label class="flex items-center gap-3 p-3 rounded-xl bg-amber-50/70 dark:bg-amber-950/20 border border-amber-200/70 dark:border-amber-900/40 hover:bg-amber-100/50 dark:hover:bg-amber-950/30 transition cursor-pointer">
            <input type="checkbox" name="destaque"
                   {% if item and item.destaque %}checked{% endif %}
                   class="w-4 h-4 rounded text-amber-500 focus:ring-amber-500 border-amber-300 dark:border-amber-700">
            <div class="text-xs">
                <div class="flex items-center gap-1.5 font-black text-amber-900 dark:text-amber-200">
                    <i data-lucide="star" class="w-3.5 h-3.5 fill-amber-400 text-amber-500 stroke-[1.75]"></i>
                    <span>Item em Destaque</span>
                </div>
                <span class="text-[10px] text-amber-700/80 dark:text-amber-300/70 block mt-0.5">Aparece no topo da vitrine pública</span>
            </div>
        </label>
    </div>
</div>

<!-- Botões de Ação do Rodapé -->
<div class="pt-4 border-t border-slate-100 dark:border-slate-800 flex items-center justify-end gap-3">
    <a href="{% url 'vitrine_list' %}"
       class="px-5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 text-xs font-bold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition">
        Cancelar
    </a>
    <button type="submit"
            class="inline-flex items-center gap-2 px-6 py-2.5 rounded-xl bg-gradient-to-r from-pink-500 to-rose-500 hover:from-pink-600 hover:to-rose-600 text-white font-black text-xs sm:text-sm shadow-md hover:shadow-pink-500/25 active:scale-[0.98] transition cursor-pointer">
        {% if action == 'create' %}
            <i data-lucide="sparkles" class="w-4 h-4 stroke-[2]"></i>
            <span>Salvar e Publicar na Vitrine</span>
        {% else %}
            <i data-lucide="save" class="w-4 h-4 stroke-[2]"></i>
            <span>Salvar Alterações</span>
        {% endif %}
    </button>
</div>
