<!-- MODAL 5: CADASTRAR ITEM INDIVIDUAL (MERCARI) (POP-UP) -->
<div x-show="activeModal === 'item_individual'" x-cloak
     class="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-5 bg-slate-950/70 backdrop-blur-sm"
     @keydown.escape.window="closeModal()">
    <div class="bg-white/98 dark:bg-cyber-surface/98 w-full max-w-5xl rounded-3xl shadow-2xl border border-purple-100/80 dark:border-white/10 overflow-hidden flex flex-col max-h-[92vh]"
         @click.away="closeModal()">
        
        <!-- Header Fixo -->
        <div class="flex-shrink-0 p-5 border-b border-purple-100/70 dark:border-white/10 flex items-center justify-between bg-gradient-to-r from-rose-500/10 via-amber-500/10 to-transparent dark:bg-cyber-elevated/70">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-rose-500 to-amber-500 text-white flex items-center justify-center shadow-xs">
                    <i data-lucide="shopping-bag" class="w-5 h-5"></i>
                </div>
                <div>
                    <h3 class="text-base font-black text-slate-900 dark:text-white">Cadastrar Item Individual (Mercari)</h3>
                    <p class="text-[11px] text-slate-500 dark:text-cyber-silver">Registre pedidos do Japão, vincule ao comprador e conecte à remessa internacional.</p>
                </div>
            </div>
            <button type="button" @click="closeModal()" class="w-8 h-8 rounded-xl flex items-center justify-center text-slate-400 hover:text-slate-700 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-white/10 transition cursor-pointer">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
        </div>

        <!-- Formulário com flex-1 min-h-0 para permitir rolagem interna suave -->
        <form id="create_item_individual_form" action="{% url 'create_item_individual' %}" method="POST" enctype="multipart/form-data"
              class="flex flex-col flex-1 min-h-0">
            {% csrf_token %}

            <!-- Corpo Rolável com Layout Retangular em 2 Colunas (lg:grid-cols-12) -->
            <div class="flex-1 min-h-0 overflow-y-auto p-5 sm:p-6">
                <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
                    <!-- Coluna Esquerda: Dados do Pedido, Comprador e Observações -->
                    {% include 'cegs/partials/_creations_modal_mercari_col_left.html' %}

                    <!-- Coluna Direita: Caixa Mercari, Status e Foto/Proof -->
                    {% include 'cegs/partials/_creations_modal_mercari_col_right.html' %}
                </div>
            </div>

            <!-- Footer Fixo: Botões de Ação Sempre Visíveis -->
            <div class="flex-shrink-0 p-4 sm:px-6 border-t border-purple-100/70 dark:border-white/10 bg-slate-50/80 dark:bg-cyber-elevated/60 flex items-center justify-end gap-3">
                <button type="button" @click="closeModal()"
                        class="px-4 py-2.5 bg-slate-100 dark:bg-white/10 hover:bg-slate-200 dark:hover:bg-white/20 text-slate-700 dark:text-cyber-silver font-bold text-xs rounded-xl transition cursor-pointer">
                    Cancelar
                </button>
                <button type="submit"
                        class="px-6 py-2.5 bg-rose-600 hover:bg-rose-700 text-white font-black text-xs rounded-xl shadow-md shadow-rose-500/25 transition cursor-pointer flex items-center gap-1.5 hover:scale-[1.02]">
                    <i data-lucide="check" class="w-4 h-4"></i>
                    <span>Cadastrar Item</span>
                </button>
            </div>
        </form>
    </div>
</div>
