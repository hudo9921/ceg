<!-- Modal para Cadastrar Novo Tipo de Item & Modal Zoom de Imagem (Alpine.js) -->
{% if is_staff_user %}
    <div x-show="addTipoModalOpen" x-cloak
         class="fixed inset-0 z-[9999] flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm"
         style="z-index: 99999;"
         @keydown.escape.window="addTipoModalOpen = false">
        <div class="bg-white dark:bg-cyber-surface rounded-3xl max-w-md w-full p-6 shadow-2xl border border-slate-100 dark:border-white/10 space-y-4"
             @click.away="addTipoModalOpen = false">
            <div class="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-white/10">
                <div class="flex items-center gap-2">
                    <i data-lucide="tag" class="w-4 h-4 text-purple-600 dark:text-purple-400"></i>
                    <h3 class="font-black text-slate-900 dark:text-white text-base">Novo Tipo de Item</h3>
                </div>
                <button type="button" @click="addTipoModalOpen = false" class="text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 p-1 cursor-pointer">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>

            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">Nome do Tipo *</label>
                    <input type="text" x-model="newTipoNome" placeholder="Ex: Labubu, Pôster, Keyring, Inclusão..."
                           class="w-full bg-slate-50 dark:bg-cyber-obsidian border border-slate-200 dark:border-white/10 rounded-xl px-3 py-2 text-xs font-bold text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-purple-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">Descrição (Opcional)</label>
                    <input type="text" x-model="newTipoDescricao" placeholder="Ex: Bonecos colecionáveis e pelúcias"
                           class="w-full bg-slate-50 dark:bg-cyber-obsidian border border-slate-200 dark:border-white/10 rounded-xl px-3 py-2 text-xs text-slate-700 dark:text-slate-200 focus:ring-2 focus:ring-purple-500">
                </div>
            </div>

            <div class="flex items-center justify-end gap-2 pt-3 border-t border-slate-100 dark:border-white/10">
                <button type="button" @click="addTipoModalOpen = false"
                        class="px-4 py-2 text-xs font-bold text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl transition cursor-pointer">
                    Cancelar
                </button>
                <button type="button" @click="submitNewTipo()"
                        class="px-5 py-2 text-xs font-bold text-white bg-purple-600 hover:bg-purple-700 rounded-xl shadow-md shadow-purple-500/20 transition cursor-pointer flex items-center gap-1.5">
                    <i data-lucide="check" class="w-3.5 h-3.5"></i>
                    <span>Salvar Tipo</span>
                </button>
            </div>
        </div>
    </div>
{% endif %}

<!-- Modal de Zoom de Imagem -->
<div x-show="zoomImageUrl" x-cloak
     class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/85 backdrop-blur-md"
     @keydown.escape.window="closeZoom()">
    <div class="relative max-w-3xl w-full max-h-[90vh] flex flex-col items-center"
         @click.away="closeZoom()">
        <button type="button" @click="closeZoom()"
                class="absolute -top-10 right-0 text-white hover:text-rose-300 font-bold text-sm cursor-pointer flex items-center gap-1">
            <i data-lucide="x" class="w-4 h-4"></i>
            <span>Fechar</span>
        </button>
        <img :src="zoomImageUrl" class="max-h-[85vh] max-w-full rounded-3xl shadow-2xl object-contain border border-white/20">
    </div>
</div>
