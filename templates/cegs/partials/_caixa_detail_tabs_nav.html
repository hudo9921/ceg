<!-- Barra de Sub-Abas da Caixa: Geral, CEGs, Mercari (Apenas Organizador / Staff) -->
{% if is_staff_user %}
    <div class="flex flex-wrap items-center gap-2 bg-white/90 dark:bg-cyber-surface/90 backdrop-blur-md p-3 rounded-2xl border border-slate-200/80 dark:border-white/10 shadow-sm">
        <span class="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mr-1">Exibir Categoria:</span>
        <button type="button" @click="currentTab = 'all'"
                :class="currentTab === 'all' ? 'bg-slate-900 dark:bg-white text-white dark:text-slate-950 shadow-xs font-black' : 'text-slate-600 dark:text-slate-300 hover:text-slate-900 font-bold'"
                class="px-3.5 py-1.5 rounded-xl text-xs transition flex items-center gap-1.5 cursor-pointer">
            <i data-lucide="layers" class="w-3.5 h-3.5"></i>
            <span>Geral (Tudo nesta Caixa)</span>
        </button>
        <button type="button" @click="currentTab = 'cegs'"
                :class="currentTab === 'cegs' ? 'bg-sky-600 text-white shadow-xs font-black' : 'text-slate-600 dark:text-slate-300 hover:text-sky-600 font-bold'"
                class="px-3.5 py-1.5 rounded-xl text-xs transition flex items-center gap-1.5 cursor-pointer">
            <i data-lucide="archive" class="w-3.5 h-3.5"></i>
            <span>CEGs Vinculadas ({{ cegs|length }})</span>
        </button>
        <button type="button" @click="currentTab = 'itens'"
                :class="currentTab === 'itens' ? 'bg-rose-600 text-white shadow-xs font-black' : 'text-slate-600 dark:text-slate-300 hover:text-rose-600 font-bold'"
                class="px-3.5 py-1.5 rounded-xl text-xs transition flex items-center gap-1.5 cursor-pointer">
            <i data-lucide="shopping-bag" class="w-3.5 h-3.5"></i>
            <span>Itens Mercari ({{ itens_individuais_count }})</span>
        </button>
    </div>
{% endif %}
