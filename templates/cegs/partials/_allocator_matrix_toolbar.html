<!-- Barra de Filtros e Ações da Matriz -->
<div class="bg-white dark:bg-slate-900 p-4 rounded-2xl border border-slate-200 dark:border-white/10 shadow-sm flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-4">
    <div class="flex items-center gap-3 flex-1">
        <div class="relative flex-1 max-w-xs">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                <i data-lucide="search" class="w-4 h-4"></i>
            </span>
            <input type="text"
                   x-model="matrixFilter"
                   placeholder="Filtrar por integrante ou item..."
                   class="w-full pl-9 pr-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-white/10 rounded-xl text-xs font-semibold text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white dark:focus:bg-slate-750 transition">
        </div>

        <button type="button"
                x-show="matrixFilter"
                @click="matrixFilter = ''"
                class="text-xs text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 cursor-pointer">
            Limpar filtro
        </button>
    </div>

    <!-- Botões de Lote da Matriz -->
    <div class="flex items-center gap-2">
        <button type="button"
                @click="markAllFilledAsPaid()"
                class="px-3.5 py-2 rounded-xl bg-emerald-50 dark:bg-emerald-950/40 hover:bg-emerald-100 dark:hover:bg-emerald-900/60 text-emerald-700 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800/40 text-xs font-bold transition flex items-center gap-1.5 cursor-pointer">
            <i data-lucide="circle-dollar-sign" class="w-4 h-4"></i>
            <span>Marcar Todos Preenchidos como Pagos</span>
        </button>

        <button type="button"
                @click="saveMatrixChanges()"
                :disabled="matrixSaving || pendingMatrixChangesCount === 0"
                class="px-5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 text-white text-xs font-black transition flex items-center gap-2 shadow-sm cursor-pointer">
            <span x-show="matrixSaving" class="animate-spin">
                <i data-lucide="loader-2" class="w-3.5 h-3.5"></i>
            </span>
            <span x-show="!matrixSaving">
                <i data-lucide="save" class="w-3.5 h-3.5"></i>
            </span>
            <span>Salvar Matriz</span>
            <span x-show="pendingMatrixChangesCount > 0"
                  class="bg-white/20 px-1.5 py-0.5 rounded text-[10px]"
                  x-text="pendingMatrixChangesCount"></span>
        </button>
    </div>
</div>
