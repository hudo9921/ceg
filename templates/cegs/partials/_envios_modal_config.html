<!-- MODAL 3: CONFIGURAR LINK DO GOOGLE FORMS -->
<div x-show="configModalOpen" x-cloak class="fixed inset-0 z-50 overflow-y-auto" role="dialog" aria-modal="true">
    <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs" @click="configModalOpen = false"></div>
    <div class="flex min-h-full items-center justify-center p-4">
        <div class="relative bg-white dark:bg-slate-900 rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-4 border border-slate-200 dark:border-slate-800" @click.stop>
            <div class="flex items-center justify-between border-b border-slate-100 dark:border-slate-800 pb-3">
                <div class="flex items-center gap-2">
                    <i data-lucide="settings" class="w-5 h-5 text-pink-600 dark:text-pink-400"></i>
                    <h3 class="text-base font-black text-slate-900 dark:text-white">Formulário de Envio dos Joiners</h3>
                </div>
                <button type="button" @click="configModalOpen = false" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 cursor-pointer">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <form action="{% url 'atualizar_configuracao_envio' %}" method="post" class="space-y-4">
                {% csrf_token %}
                <input type="hidden" name="next" value="/envios/">

                <p class="text-xs text-slate-500 dark:text-slate-400 leading-relaxed">
                    Insira o link do seu formulário externo (ex: Google Forms, Typeform, Tally). Esse link ficará visível para os participantes na aba <strong>Minha Caixinha</strong> com o botão <em>"Preencher Formulário de Envio"</em>.
                </p>

                <div class="space-y-1">
                    <label class="text-xs font-bold text-slate-700 dark:text-slate-300">Link do Formulário (URL Completa)</label>
                    <input type="url" name="link_formulario_google" required
                           value="{{ configuracao_envio.link_formulario_google|default:'' }}"
                           placeholder="https://docs.google.com/forms/d/e/.../viewform"
                           class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl text-xs font-semibold text-slate-900 dark:text-white focus:bg-white focus:ring-2 focus:ring-pink-500">
                </div>

                <div class="space-y-1">
                    <label class="text-xs font-bold text-slate-700 dark:text-slate-300">Instruções aos Participantes (Opcional)</label>
                    <textarea name="instrucoes_envio" rows="3"
                              placeholder="Ex: Preencha seu CEP completo, nome de quem vai receber e se deseja seguro postal..."
                              class="w-full p-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl text-xs text-slate-800 dark:text-slate-200">{{ configuracao_envio.instrucoes_envio|default:'' }}</textarea>
                </div>

                <div class="pt-2 flex justify-end gap-2">
                    <button type="button" @click="configModalOpen = false" class="px-4 py-2 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 rounded-xl text-xs font-bold hover:bg-slate-50 dark:hover:bg-slate-800 cursor-pointer">Cancelar</button>
                    <button type="submit" class="px-5 py-2 bg-pink-600 hover:bg-pink-700 text-white rounded-xl text-xs font-bold shadow flex items-center gap-1.5 cursor-pointer">
                        <i data-lucide="save" class="w-3.5 h-3.5"></i>
                        <span>Salvar Configuração</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
