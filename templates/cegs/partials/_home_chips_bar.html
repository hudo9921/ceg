<!-- Barra de Chips / Pílulas de Navegação Rápida por Artista (Estilo Godly / Cyber-Luxury) -->
<div class="relative w-full py-1">
    <div class="flex items-center gap-2 overflow-x-auto no-scrollbar scroll-smooth px-1 py-1.5">
        
        <!-- Pílula: Todos os Artistas -->
        <button type="button"
                @click="selectedGroup = ''; if(selectedEra) selectedEra = ''; resetTracksScroll()"
                class="flex items-center gap-2 px-3.5 py-1.5 rounded-full text-xs transition-all duration-200 flex-shrink-0 cursor-pointer border"
                :class="!selectedGroup 
                    ? 'bg-purple-100/90 dark:bg-cyber-elevated text-pink-700 dark:text-cyber-neon border-purple-300 dark:border-cyber-neon/40 shadow-xs dark:shadow-[0_0_12px_rgba(244,114,182,0.18)] font-black scale-[1.02]' 
                    : 'bg-white/80 dark:bg-cyber-surface/80 text-slate-600 dark:text-cyber-silver border-purple-100/70 dark:border-white/10 hover:bg-white dark:hover:bg-cyber-elevated hover:text-slate-900 dark:hover:text-white hover:border-purple-200 dark:hover:border-white/20 hover:-translate-y-0.5 font-semibold'">
            <i data-lucide="sparkles" class="w-3.5 h-3.5 text-pink-500 dark:text-cyber-neon" stroke-width="1.75"></i>
            <span>Todos</span>
            <span class="text-[10px] font-mono tabular-nums font-bold px-1.5 py-0.5 rounded-full bg-purple-200/70 dark:bg-black/40 text-purple-800 dark:text-purple-300"
                  x-text="hasActiveFilters() ? totalVisibleCount() : '{{ active_cegs|length }}'">
                {{ active_cegs|length }}
            </span>
        </button>

        <!-- Pílulas Individuais para cada Grupo Ativo -->
        {% for group in open_groups %}
            <button type="button"
                    @click="selectedGroup = (selectedGroup == '{{ group.id }}' ? '' : '{{ group.id }}'); resetTracksScroll()"
                    class="flex items-center gap-2 px-3.5 py-1.5 rounded-full text-xs transition-all duration-200 flex-shrink-0 cursor-pointer border"
                    :class="selectedGroup == '{{ group.id }}'
                        ? 'bg-purple-100/90 dark:bg-cyber-elevated text-pink-700 dark:text-cyber-neon border-purple-300 dark:border-cyber-neon/40 shadow-xs dark:shadow-[0_0_12px_rgba(244,114,182,0.18)] font-black scale-[1.02]'
                        : 'bg-white/80 dark:bg-cyber-surface/80 text-slate-600 dark:text-cyber-silver border-purple-100/70 dark:border-white/10 hover:bg-white dark:hover:bg-cyber-elevated hover:text-slate-900 dark:hover:text-white hover:border-purple-200 dark:hover:border-white/20 hover:-translate-y-0.5 font-semibold'">
                <div class="w-4.5 h-4.5 rounded-full bg-gradient-to-tr from-pink-500 to-purple-600 text-white flex items-center justify-center text-[10px] font-black shrink-0 shadow-2xs">
                    {{ group.name|slice:":1" }}
                </div>
                <span>{{ group.name }}</span>
                <span class="text-[10px] font-mono tabular-nums font-bold px-1.5 py-0.5 rounded-full bg-slate-100 dark:bg-black/30 text-slate-500 dark:text-slate-400"
                      x-text="hasActiveFilters() ? getGroupVisibleCount('{{ group.id }}') : '{{ group.cegs_count }}'">
                    {{ group.cegs_count }}
                </span>
            </button>
        {% endfor %}

    </div>
</div>
