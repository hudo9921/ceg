{% comment %}Chips de grupo na home: filtram os trilhos (selectedGroup de homeApp()). Rolam na horizontal no celular.{% endcomment %}
<div class="flex items-center gap-2 overflow-x-auto no-scrollbar py-1" role="toolbar" aria-label="Filtrar por grupo">
    <button type="button" class="ui-chip" :class="{ 'is-on': !selectedGroup }" :aria-pressed="(!selectedGroup).toString()"
            @click="selectedGroup = ''; if (selectedEra) selectedEra = ''; resetTracksScroll()">
        <span>Todos</span>
        <span class="ui-mono text-xs ui-muted" x-text="hasActiveFilters() ? totalVisibleCount() : '{{ active_cegs|length }}'">{{ active_cegs|length }}</span>
    </button>
    {% for group in open_groups %}
        <button type="button" class="ui-chip !pl-1.5" :class="{ 'is-on': selectedGroup == '{{ group.id }}' }" :aria-pressed="(selectedGroup == '{{ group.id }}').toString()"
                @click="selectedGroup = (selectedGroup == '{{ group.id }}' ? '' : '{{ group.id }}'); resetTracksScroll()">
            <span class="w-7 h-7 overflow-hidden shrink-0 flex items-center justify-center text-xs font-bold text-white" style="border-radius: var(--ui-r-pill); background: var(--ui-accent)">
                {% if group.image_url %}<img src="{{ group.image_url|thumb }}" alt="" loading="lazy" class="w-full h-full object-cover">{% else %}{{ group.name|slice:":1" }}{% endif %}
            </span>
            <span>{{ group.name }}</span>
            <span class="ui-mono text-xs ui-muted" x-text="hasActiveFilters() ? getGroupVisibleCount('{{ group.id }}') : '{{ group.cegs_count }}'">{{ group.cegs_count }}</span>
        </button>
    {% endfor %}
</div>
