<!-- Barra de Chips / Pílulas de Navegação Rápida por Artista (Estilo Deezer / Godly) -->
<div class="relative w-full py-1">
    <div class="flex items-center gap-2 overflow-x-auto no-scrollbar scroll-smooth px-1 py-1">
        
        <!-- Pílula: Todos os Artistas -->
        <button type="button"
                @click="selectedGroup = ''; if(selectedEra) selectedEra = ''; resetTracksScroll()"
                class="flex items-center gap-2 px-3.5 py-1.5 rounded-full text-xs transition-all duration-200 flex-shrink-0 cursor-pointer border"
                :class="!selectedGroup 
                    ? 'bg-purple-100/90 dark:bg-cyber-elevated text-pink-700 dark:text-cyber-neon border-purple-300/80 dark:border-white/20 font-black shadow-xs' 
                    : 'bg-white/80 dark:bg-cyber-surface/80 text-slate-600 dark:text-cyber-silver border-purple-100/70 dark:border-white/10 hover:bg-purple-50 dark:hover:bg-cyber-elevated font-semibold'">
            <i data-lucide="sparkles" class="w-3.5 h-3.5 text-purple-500 dark:text-cyber-neon"></i>
            <span>Todos</span>
            <span class="text-[10px] font-mono px-1.5 py-0.2 rounded-full bg-purple-200/60 dark:bg-black/40 text-purple-800 dark:text-purple-300"
                  x-text="hasActiveFilters() ? totalVisibleCount() : '{{ active_cegs|length }}'">
                {{ active_cegs|length }}
            </span>
        </button>

        <!-- Pílulas Individuais para cada Grupo Ativo -->
        {% for group in open_groups %}
            <button type="button"
                    @click="selectedGroup = (selectedGroup == '{{ group.id }}' ? '' : '{{ group.id }}'); resetTracksScroll()"
                    class="flex items-center gap-2 px-3.5 py-1.5 rounded-full text-xs transition-all duration-200 flex-shrink-0 cursor-pointer border"
                    :class="selectedGroup == '{{ group.id }}'
                        ? 'bg-purple-100/90 dark:bg-cyber-elevated text-pink-700 dark:text-cyber-neon border-purple-300/80 dark:border-white/20 font-black shadow-xs'
                        : 'bg-white/80 dark:bg-cyber-surface/80 text-slate-600 dark:text-cyber-silver border-purple-100/70 dark:border-white/10 hover:bg-purple-50 dark:hover:bg-cyber-elevated font-semibold'">
                <div class="w-4 h-4 rounded-full bg-gradient-to-tr from-pink-400 to-purple-500 text-white flex items-center justify-center text-[9px] font-black shrink-0">
                    {{ group.name|slice:":1" }}
                </div>
                <span>{{ group.name }}</span>
                <span class="text-[10px] font-mono px-1.5 py-0.2 rounded-full bg-slate-100 dark:bg-black/30 text-slate-500 dark:text-slate-400"
                      x-text="hasActiveFilters() ? getGroupVisibleCount('{{ group.id }}') : '{{ group.cegs_count }}'">
                    {{ group.cegs_count }}
                </span>
            </button>
        {% endfor %}

    </div>
</div>
