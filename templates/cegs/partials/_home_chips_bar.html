<!-- Barra de Chips / Pílulas de Navegação Rápida por Artista (Soft Y2K / Cyber-Luxury) -->
<div class="relative w-full py-1">
    <div class="flex items-center gap-2 overflow-x-auto no-scrollbar scroll-smooth px-1 py-1.5">
        
        <!-- Pílula: Todos os Artistas -->
        <button type="button"
                @click="selectedGroup = ''; if(selectedEra) selectedEra = ''; resetTracksScroll()"
                class="flex items-center gap-2 px-3.5 py-1.5 rounded-full text-xs transition-all duration-200 flex-shrink-0 cursor-pointer border select-none active:scale-[0.98]"
                :class="!selectedGroup 
                    ? 'bg-gradient-to-r from-pink-50 via-purple-50 to-pink-50 dark:from-pink-950/60 dark:via-purple-950/60 dark:to-pink-950/60 text-pink-700 dark:text-pink-300 border-pink-300/90 dark:border-pink-500/50 shadow-xs dark:shadow-[0_0_14px_rgba(244,114,182,0.22)] font-black ring-1 ring-pink-300/40 dark:ring-pink-500/30' 
                    : 'bg-white/90 dark:bg-white/[0.04] text-slate-600 dark:text-slate-300 border-purple-100/80 dark:border-white/10 hover:bg-white dark:hover:bg-white/[0.08] hover:text-slate-900 dark:hover:text-white hover:border-pink-200 dark:hover:border-white/20 hover:-translate-y-0.5 font-semibold backdrop-blur-md shadow-2xs'">
            <div class="w-5 h-5 rounded-full bg-pink-100 dark:bg-pink-950/70 text-pink-600 dark:text-pink-400 flex items-center justify-center shrink-0">
                <i data-lucide="sparkles" class="w-3 h-3" stroke-width="1.75"></i>
            </div>
            <span>Todos</span>
            <span class="text-[10px] font-mono tabular-nums font-bold px-1.5 py-0.5 rounded-full"
                  :class="!selectedGroup ? 'bg-pink-200/80 dark:bg-pink-900/50 text-pink-800 dark:text-pink-200' : 'bg-slate-100 dark:bg-white/10 text-slate-500 dark:text-slate-400'"
                  x-text="hasActiveFilters() ? totalVisibleCount() : '{{ active_cegs|length }}'">
                {{ active_cegs|length }}
            </span>
        </button>

        <!-- Pílulas Individuais para cada Grupo Ativo com Avatar Real -->
        {% for group in open_groups %}
            <button type="button"
                    @click="selectedGroup = (selectedGroup == '{{ group.id }}' ? '' : '{{ group.id }}'); resetTracksScroll()"
                    class="flex items-center gap-2 px-3 py-1.5 rounded-full text-xs transition-all duration-200 flex-shrink-0 cursor-pointer border select-none active:scale-[0.98]"
                    :class="selectedGroup == '{{ group.id }}'
                        ? 'bg-gradient-to-r from-pink-50 via-purple-50 to-pink-50 dark:from-pink-950/60 dark:via-purple-950/60 dark:to-pink-950/60 text-pink-700 dark:text-pink-300 border-pink-300/90 dark:border-pink-500/50 shadow-xs dark:shadow-[0_0_14px_rgba(244,114,182,0.22)] font-black ring-1 ring-pink-300/40 dark:ring-pink-500/30'
                        : 'bg-white/90 dark:bg-white/[0.04] text-slate-600 dark:text-slate-300 border-purple-100/80 dark:border-white/10 hover:bg-white dark:hover:bg-white/[0.08] hover:text-slate-900 dark:hover:text-white hover:border-pink-200 dark:hover:border-white/20 hover:-translate-y-0.5 font-semibold backdrop-blur-md shadow-2xs'">
                
                <!-- Avatar Circular com Foto Real do Grupo ou Fallback -->
                <div class="w-5 h-5 rounded-full overflow-hidden shrink-0 flex items-center justify-center ring-1 ring-pink-300/40 dark:ring-white/15 bg-gradient-to-tr from-pink-500 to-purple-600 text-white shadow-2xs">
                    {% if group.image_url %}
                        <img src="{{ group.image_url }}" alt="{{ group.name }}" loading="lazy" class="w-full h-full object-cover">
                    {% else %}
                        <span class="text-[10px] font-black">{{ group.name|slice:":1" }}</span>
                    {% endif %}
                </div>

                <span>{{ group.name }}</span>
                <span class="text-[10px] font-mono tabular-nums font-bold px-1.5 py-0.5 rounded-full"
                      :class="selectedGroup == '{{ group.id }}' ? 'bg-pink-200/80 dark:bg-pink-900/50 text-pink-800 dark:text-pink-200' : 'bg-slate-100 dark:bg-white/10 text-slate-500 dark:text-slate-400'"
                      x-text="hasActiveFilters() ? getGroupVisibleCount('{{ group.id }}') : '{{ group.cegs_count }}'">
                    {{ group.cegs_count }}
                </span>
            </button>
        {% endfor %}

    </div>
</div>
