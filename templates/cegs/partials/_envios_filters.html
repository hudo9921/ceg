<!-- BARRA DE FILTROS E BUSCA -->
<div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-5 shadow-2xs space-y-4">
    <form method="get" action="{% url 'envios_nacionais' %}" class="space-y-4">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
            <div class="flex items-center gap-2">
                <span class="text-base font-bold text-slate-800 dark:text-slate-200">Filtrar Envios Nacionais</span>
                <span class="px-2.5 py-0.5 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 font-bold text-xs rounded-full">
                    {{ pacotes|length }} pacote(s) encontrado(s)
                </span>
            </div>

            {% if status_filter or participant_filter or feedback_filter or search_query %}
                <a href="{% url 'envios_nacionais' %}" class="text-xs text-pink-600 dark:text-pink-400 hover:text-pink-700 font-bold underline underline-offset-2 flex items-center gap-1">
                    <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
                    <span>Limpar todos os filtros</span>
                </a>
            {% endif %}
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-12 gap-3 items-end">
            <!-- Busca Textual -->
            <div class="md:col-span-4 space-y-1">
                <label class="text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wide">Busca Rápida</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                        <i data-lucide="search" class="w-3.5 h-3.5"></i>
                    </span>
                    <input type="text" name="q" value="{{ search_query }}" placeholder="Rastreio, PAC-XXXX, nome ou @..."
                           class="w-full pl-8 pr-3 py-2 bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-xl text-xs font-semibold text-slate-800 dark:text-slate-200 placeholder-slate-400 focus:bg-white dark:focus:bg-slate-850 focus:outline-none focus:ring-2 focus:ring-pink-500">
                </div>
            </div>

            <!-- Filtro de Status -->
            <div class="md:col-span-3 space-y-1">
                <label class="text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wide">Status do Pacote</label>
                <select name="status" class="w-full bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-xs font-semibold text-slate-700 dark:text-slate-200 focus:bg-white">
                    <option value="">Todos os Status</option>
                    <option value="SOLICITADO" {% if status_filter == 'SOLICITADO' %}selected{% endif %}>Solicitados pelo Joiner</option>
                    <option value="EM_PREPARACAO" {% if status_filter == 'EM_PREPARACAO' %}selected{% endif %}>Em Preparação / Embalando</option>
                    <option value="ENVIADO" {% if status_filter == 'ENVIADO' %}selected{% endif %}>Enviado Nacionalmente</option>
                    <option value="ENTREGUE" {% if status_filter == 'ENTREGUE' %}selected{% endif %}>Entregue</option>
                </select>
            </div>

            <!-- Filtro de Participante (Joiner) -->
            <div class="md:col-span-3 space-y-1">
                <label class="text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wide">Destinatário (Joiner)</label>
                <select name="participant_id" class="w-full bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-xs font-semibold text-slate-700 dark:text-slate-200 focus:bg-white">
                    <option value="">Todos os Joiners</option>
                    {% for p in all_participants %}
                        <option value="{{ p.id }}" {% if participant_filter == p.id|stringformat:"s" %}selected{% endif %}>
                            {{ p.name }}{% if p.username %} [{{ p.username }}]{% endif %}{% if p.social_handle %} ({{ p.social_handle }}){% endif %}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <!-- Filtro de Feedback -->
            <div class="md:col-span-2 space-y-1">
                <label class="text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wide">Avaliações</label>
                <select name="feedback" class="w-full bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-xs font-semibold text-slate-700 dark:text-slate-200 focus:bg-white">
                    <option value="">Todos</option>
                    <option value="com_feedback" {% if feedback_filter == 'com_feedback' %}selected{% endif %}>Com Avaliação</option>
                    <option value="sem_feedback" {% if feedback_filter == 'sem_feedback' %}selected{% endif %}>Sem Avaliação</option>
                </select>
            </div>
        </div>

        <div class="flex justify-end pt-1">
            <button type="submit" class="px-4 py-2 bg-slate-900 dark:bg-slate-800 hover:bg-slate-800 dark:hover:bg-slate-700 text-white font-bold text-xs rounded-xl shadow-sm transition flex items-center gap-1.5 cursor-pointer">
                <i data-lucide="search" class="w-3.5 h-3.5"></i>
                <span>Aplicar Filtros</span>
            </button>
        </div>
    </form>
</div>
