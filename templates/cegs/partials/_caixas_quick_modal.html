{% comment %}Mudar a etapa de uma caixa (ui-sheet). As CEGs da caixa acompanham e os compradores são avisados.{% endcomment %}
<div x-show="quickModalOpen" x-cloak class="ui-scrim flex items-end sm:items-center justify-center p-0 sm:p-4"
     @click.self="quickModalOpen = false" @keydown.escape.window="quickModalOpen = false">
    <form :action="'/caixas/' + targetCaixaSlug + '/status/'" method="post" class="ui-sheet sm:!rounded-ui-card w-full sm:max-w-md space-y-4"
          role="dialog" aria-modal="true" aria-labelledby="etapa-title">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ request.get_full_path }}">
        <div>
            <h2 id="etapa-title" class="ui-disp text-2xl">Mudar etapa</h2>
            <p class="ui-muted text-sm mt-1" x-text="targetCaixaName"></p>
        </div>
        <label class="block space-y-1.5">
            <span class="ui-label">Nova etapa</span>
            <select name="novo_status" x-model="selectedStatus" class="ui-input w-full cursor-pointer">
                {% for val, label in status_choices %}<option value="{{ val }}">{{ label }}</option>{% endfor %}
            </select>
            <span class="block ui-muted text-[13px]">As CEGs da caixa mudam junto e os compradores recebem um aviso.</span>
        </label>
        <label class="block space-y-1.5">
            <span class="ui-label">Data do evento (opcional)</span>
            <input type="date" name="data_evento" class="ui-input w-full">
        </label>
        <div class="flex flex-col-reverse sm:flex-row sm:justify-end gap-2.5">
            <button type="button" class="ui-btn ui-btn-ghost" @click="quickModalOpen = false">Cancelar</button>
            <button type="submit" class="ui-btn ui-btn-primary">Salvar etapa</button>
        </div>
    </form>
</div>
