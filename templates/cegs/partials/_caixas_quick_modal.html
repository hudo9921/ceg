<!-- Modal de Atualização Rápida de Status da Remessa (Alpine.js) -->
{% if is_staff_user %}
    <div x-show="quickModalOpen" x-cloak
         class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-sm"
         @keydown.escape.window="quickModalOpen = false">
        <div class="bg-white dark:bg-cyber-surface rounded-2xl max-w-md w-full p-6 shadow-2xl border border-purple-100/60 dark:border-white/10 space-y-4"
             @click.away="quickModalOpen = false">
            <div class="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-white/10">
                <div class="flex items-center gap-2">
                    <div class="w-8 h-8 rounded-xl bg-sky-100 dark:bg-sky-950/60 text-sky-600 dark:text-sky-400 flex items-center justify-center">
                        <i data-lucide="zap" class="w-4 h-4"></i>
                    </div>
                    <h3 class="font-black text-slate-900 dark:text-slate-100 text-base" x-text="'Atualizar: ' + targetCaixaName"></h3>
                </div>
                <button type="button" @click="quickModalOpen = false" class="text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 cursor-pointer p-1">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>

            <form :action="'/caixas/' + targetCaixaSlug + '/status/'" method="post" class="space-y-4">
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ request.get_full_path }}">

                <div class="space-y-1.5">
                    <label class="block text-xs font-bold text-slate-700 dark:text-slate-300">Selecione o Novo Status</label>
                    <select name="novo_status" x-model="selectedStatus"
                            class="w-full bg-slate-50 dark:bg-cyber-obsidian border border-slate-300 dark:border-white/10 text-sm font-semibold rounded-xl px-3 py-2.5 text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-sky-500 focus:outline-none">
                        {% for val, label in status_choices %}
                            <option value="{{ val }}">{{ label }}</option>
                        {% endfor %}
                    </select>
                    <p class="text-[11px] text-sky-600 dark:text-sky-400 font-medium flex items-center gap-1.5 pt-0.5">
                        <i data-lucide="info" class="w-3.5 h-3.5 shrink-0"></i>
                        <span>Todas as CEGs atreladas serão sincronizadas em cascata e compradores notificados.</span>
                    </p>
                </div>

                <div class="space-y-1.5">
                    <label class="block text-xs font-bold text-slate-700 dark:text-slate-300">Data do Evento (Opcional)</label>
                    <input type="date" name="data_evento"
                           class="w-full bg-slate-50 dark:bg-cyber-obsidian border border-slate-300 dark:border-white/10 text-sm rounded-xl px-3 py-2 text-slate-800 dark:text-slate-100 focus:ring-2 focus:ring-sky-500 focus:outline-none">
                </div>

                <div class="flex items-center justify-end gap-2 pt-3 border-t border-slate-100 dark:border-white/10">
                    <button type="button" @click="quickModalOpen = false"
                            class="px-4 py-2 text-xs font-bold text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl transition cursor-pointer">
                        Cancelar
                    </button>
                    <button type="submit"
                            class="px-5 py-2 text-xs font-bold text-white bg-sky-600 hover:bg-sky-700 rounded-xl shadow-md shadow-sky-500/20 transition cursor-pointer flex items-center gap-1.5">
                        <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
                        <span>Confirmar & Sincronizar</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
{% endif %}
