<!-- BOTÕES INTERATIVOS DE PAGAMENTO E STATUS DE PACOTE -->
<div class="flex flex-wrap items-center gap-2 w-full md:w-auto justify-start md:justify-end">
    <!-- Botão Interativo: Pagamento do Item -->
    <button type="button"
            @click.stop="togglePayment(item, 'item')"
            :disabled="isToggling(item.uid, 'item')"
            class="group relative text-center px-3 py-1.5 rounded-xl border text-[11px] font-bold cursor-pointer transition transform active:scale-95 hover:shadow-2xs focus:outline-none"
            :class="item.is_item_paid 
                ? 'bg-emerald-50 dark:bg-emerald-950/40 text-emerald-700 dark:text-emerald-300 border-emerald-300 dark:border-emerald-800/50 hover:bg-emerald-100 hover:border-emerald-400' 
                : 'bg-amber-50 dark:bg-amber-950/40 text-amber-800 dark:text-amber-300 border-amber-300 dark:border-amber-800/50 hover:bg-amber-100 hover:border-amber-400'"
            title="Clique para alternar status do Item entre Pago e Pendente">
        <span class="block text-[9px] uppercase tracking-wider text-slate-400 dark:text-slate-500 group-hover:text-slate-600 dark:group-hover:text-slate-300">Item ✎</span>
        <span class="inline-flex items-center gap-1">
            <template x-if="isToggling(item.uid, 'item')">
                <i data-lucide="loader-2" class="w-3 h-3 animate-spin"></i>
            </template>
            <template x-if="!isToggling(item.uid, 'item')">
                <span class="inline-flex items-center gap-0.5">
                    <template x-if="item.is_item_paid">
                        <span class="inline-flex items-center gap-0.5"><i data-lucide="check" class="w-3 h-3 text-emerald-600 dark:text-emerald-400"></i> Pago</span>
                    </template>
                    <template x-if="!item.is_item_paid">
                        <span class="inline-flex items-center gap-0.5"><i data-lucide="clock" class="w-3 h-3 text-amber-600 dark:text-amber-400"></i> Pendente</span>
                    </template>
                </span>
            </template>
        </span>
    </button>

    <!-- Botão Interativo: Frete Internacional -->
    <button type="button"
            @click.stop="togglePayment(item, 'inter')"
            :disabled="isToggling(item.uid, 'inter')"
            class="group relative text-center px-3 py-1.5 rounded-xl border text-[11px] font-bold cursor-pointer transition transform active:scale-95 hover:shadow-2xs focus:outline-none"
            :class="item.is_frete_inter_paid 
                ? 'bg-emerald-50 dark:bg-emerald-950/40 text-emerald-700 dark:text-emerald-300 border-emerald-300 dark:border-emerald-800/50 hover:bg-emerald-100 hover:border-emerald-400' 
                : (item.frete_inter_valor > 0 ? 'bg-purple-50 dark:bg-purple-950/40 text-purple-800 dark:text-purple-300 border-purple-300 dark:border-purple-800/50 hover:bg-purple-100 hover:border-purple-400' : 'bg-slate-50 dark:bg-white/5 text-slate-500 dark:text-slate-400 border-slate-200 dark:border-white/10 hover:bg-slate-100')"
            title="Clique para alternar status do Frete Inter entre Pago e Pendente">
        <span class="block text-[9px] uppercase tracking-wider text-slate-400 dark:text-slate-500 group-hover:text-slate-600 dark:group-hover:text-slate-300">Inter ✎</span>
        <span class="inline-flex items-center gap-1">
            <template x-if="isToggling(item.uid, 'inter')">
                <i data-lucide="loader-2" class="w-3 h-3 animate-spin"></i>
            </template>
            <template x-if="!isToggling(item.uid, 'inter')">
                <span class="inline-flex items-center gap-0.5">
                    <template x-if="item.is_frete_inter_paid">
                        <span class="inline-flex items-center gap-0.5"><i data-lucide="plane" class="w-3 h-3 text-emerald-600 dark:text-emerald-400"></i> Pago</span>
                    </template>
                    <template x-if="!item.is_frete_inter_paid">
                        <span x-text="item.frete_inter_valor > 0 ? 'R$ ' + item.frete_inter_valor.toFixed(2) : 'A definir'"></span>
                    </template>
                </span>
            </template>
        </span>
    </button>

    <!-- Botão Interativo: Taxa Aduaneira -->
    <button type="button"
            @click.stop="togglePayment(item, 'taxa')"
            :disabled="isToggling(item.uid, 'taxa')"
            class="group relative text-center px-3 py-1.5 rounded-xl border text-[11px] font-bold cursor-pointer transition transform active:scale-95 hover:shadow-2xs focus:outline-none"
            :class="item.is_taxa_aduaneira_paid 
                ? 'bg-emerald-50 dark:bg-emerald-950/40 text-emerald-700 dark:text-emerald-300 border-emerald-300 dark:border-emerald-800/50 hover:bg-emerald-100 hover:border-emerald-400' 
                : (item.taxa_aduaneira_valor > 0 ? 'bg-rose-50 dark:bg-rose-950/40 text-rose-800 dark:text-rose-300 border-rose-300 dark:border-rose-800/50 hover:bg-rose-100 hover:border-rose-400' : 'bg-slate-50 dark:bg-white/5 text-slate-500 dark:text-slate-400 border-slate-200 dark:border-white/10 hover:bg-slate-100')"
            title="Clique para alternar status da Taxa Aduaneira entre Paga e Pendente">
        <span class="block text-[9px] uppercase tracking-wider text-slate-400 dark:text-slate-500 group-hover:text-slate-600 dark:group-hover:text-slate-300">Taxa ✎</span>
        <span class="inline-flex items-center gap-1">
            <template x-if="isToggling(item.uid, 'taxa')">
                <i data-lucide="loader-2" class="w-3 h-3 animate-spin"></i>
            </template>
            <template x-if="!isToggling(item.uid, 'taxa')">
                <span class="inline-flex items-center gap-0.5">
                    <template x-if="item.is_taxa_aduaneira_paid">
                        <span class="inline-flex items-center gap-0.5"><i data-lucide="landmark" class="w-3 h-3 text-emerald-600 dark:text-emerald-400"></i> Paga</span>
                    </template>
                    <template x-if="!item.is_taxa_aduaneira_paid">
                        <span x-text="item.taxa_aduaneira_valor > 0 ? 'R$ ' + item.taxa_aduaneira_valor.toFixed(2) : 'A definir'"></span>
                    </template>
                </span>
            </template>
        </span>
    </button>

    <!-- Status do Pacote -->
    <div class="min-w-[140px] text-right">
        <!-- Pacote Já Enviado Nacionalmente / Entregue -->
        <template x-if="item.pacote_status === 'ENVIADO' || item.pacote_status === 'ENTREGUE'">
            <div class="space-y-1">
                <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg text-xs font-black bg-emerald-100 dark:bg-emerald-950/50 text-emerald-800 dark:text-emerald-300 border border-emerald-300 dark:border-emerald-800/50 shadow-2xs"
                      title="Item já despachado nacionalmente">
                    <i data-lucide="truck" class="w-3 h-3"></i>
                    <span x-text="item.pacote_status === 'ENTREGUE' ? 'Entregue' : 'Enviado'"></span>
                    <span class="text-[10px] font-mono opacity-80" x-text="'(' + item.pacote_identificador + ')'"></span>
                </span>
                <template x-if="item.pacote_rastreio">
                    <div>
                        <a :href="'https://rastreamento.correios.com.br/app/index.php?codigo=' + item.pacote_rastreio" target="_blank"
                           class="text-[11px] font-mono font-black text-blue-600 dark:text-blue-400 hover:text-blue-800 underline inline-flex items-center gap-0.5"
                           title="Rastrear envio nacional">
                            <span x-text="item.pacote_rastreio"></span>
                            <i data-lucide="external-link" class="w-2.5 h-2.5"></i>
                        </a>
                    </div>
                </template>
            </div>
        </template>

        <!-- Pacote Em Preparação (Não Enviado ainda) -->
        <template x-if="item.pacote_status !== 'ENVIADO' && item.pacote_status !== 'ENTREGUE' && item.pacote_identificador">
            <div class="space-y-0.5">
                <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg text-xs font-bold bg-blue-100 dark:bg-blue-950/50 text-blue-800 dark:text-blue-300 border border-blue-200 dark:border-blue-800/50">
                    <i data-lucide="package" class="w-3 h-3"></i>
                    <span x-text="item.pacote_identificador"></span>
                </span>
                <template x-if="item.pacote_rastreio">
                    <div class="text-[10px] font-bold text-blue-600 dark:text-blue-400 font-mono" x-text="item.pacote_rastreio"></div>
                </template>
            </div>
        </template>

        <!-- Sem Pacote / Livre -->
        <template x-if="!item.pacote_identificador">
            <span class="inline-block px-2.5 py-1 bg-slate-100 dark:bg-white/5 text-slate-500 dark:text-slate-400 rounded-lg text-xs font-semibold">
                Livre / Sem Pacote
            </span>
        </template>
    </div>
</div>
