<!-- SEÇÃO DE PACOTES NACIONAIS JÁ EXISTENTES DO JOINER -->
{% if pacotes %}
    <div class="bg-white dark:bg-[#14121B] rounded-2xl border border-slate-200 dark:border-white/10 p-6 shadow-sm space-y-5">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
            <div class="flex items-center gap-2.5">
                <div class="w-8 h-8 rounded-xl bg-blue-100 dark:bg-blue-900/40 text-blue-700 dark:text-blue-300 flex items-center justify-center">
                    <i data-lucide="package" class="w-4 h-4"></i>
                </div>
                <div>
                    <h3 class="text-base font-black text-slate-900 dark:text-white">Pacotes Nacionais Deste Joiner</h3>
                    <p class="text-xs text-slate-500 dark:text-slate-400">Acompanhe os envios criados, adicione código de rastreamento e marque como enviado</p>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            {% for pacote in pacotes %}
                {% include 'cegs/partials/_joiner_package_card.html' %}
            {% endfor %}
        </div>
    </div>
{% endif %}
