<!-- SEÇÕES 1 E 2: ERA, TÍTULO, CAPA, DATAS E STATUS DA CEG -->

<!-- Seção 1: Era & Grupo -->
<div class="p-4 sm:p-5 bg-slate-50/80 dark:bg-white/[0.03] rounded-2xl border border-slate-200/80 dark:border-white/10 space-y-3.5">
    <span class="text-xs font-black text-pink-600 dark:text-pink-400 uppercase tracking-wider flex items-center gap-1.5">
        <i data-lucide="disc" class="w-3.5 h-3.5"></i>
        <span>1. Era e Título da Compra em Grupo</span>
    </span>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div>
            <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">Filtrar por Grupo</label>
            <select x-model="selectedGroupId" @change="onCegGroupChange()"
                    class="w-full bg-white dark:bg-cyber-surface border border-slate-200 dark:border-white/10 rounded-xl px-3 py-2 text-xs font-semibold text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-pink-500">
                <option value="">-- Selecione o Grupo --</option>
                <template x-for="g in groups" :key="g.id">
                    <option :value="g.id" x-text="g.name" :selected="g.id == selectedGroupId"></option>
                </template>
            </select>
        </div>

        <div>
            <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">Era / Comeback *</label>
            <select name="era_id" required x-model="selectedEraId" @change="onCegEraChange()"
                    class="w-full bg-white dark:bg-cyber-surface border border-slate-200 dark:border-white/10 rounded-xl px-3 py-2 text-xs font-bold text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-pink-500">
                <option value="">-- Selecione a Era correspondente --</option>
                {% for e in eras %}
                    <option value="{{ e.id }}"
                            data-group="{{ e.group.id }}"
                            x-show="!selectedGroupId || selectedGroupId == '{{ e.group.id }}'">
                        {{ e.group.name }} — {{ e.name }}
                    </option>
                {% endfor %}
            </select>
        </div>
    </div>

    <div>
        <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">Título da CEG *</label>
        <input type="text" name="title" required
               placeholder="Ex: CEG TWICE With YOU-th — Digipack & POB Soundwave Split"
               class="w-full bg-white dark:bg-cyber-surface border border-slate-200 dark:border-white/10 rounded-xl px-3.5 py-2 text-xs font-bold text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-pink-500">
    </div>

    <div>
        <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">Banner / Foto de Capa da CEG</label>

        <!-- Preview Adaptativo Sem Cortes -->
        <div x-show="cegBannerPreview" class="relative rounded-2xl overflow-hidden border border-pink-200 dark:border-white/10 h-44 bg-slate-950 flex items-center justify-center group mb-2">
            <img :src="cegBannerPreview" alt="" class="absolute inset-0 w-full h-full object-cover blur-xl opacity-40 scale-110 pointer-events-none">
            <img :src="cegBannerPreview" alt="Banner CEG Preview" class="relative z-10 max-h-44 w-auto max-w-full object-contain mx-auto">
            <button type="button" @click="clearCegBanner()"
                    class="absolute top-2 right-2 z-20 px-2.5 py-1 bg-rose-600/90 hover:bg-rose-700 text-white rounded-lg font-bold text-[10px] shadow transition flex items-center gap-1 cursor-pointer">
                <i data-lucide="trash-2" class="w-3 h-3"></i>
                <span>Remover</span>
            </button>
        </div>

        <!-- Dropzone Interativa: PC, Arrastar ou Ctrl+V -->
        <div @dragover.prevent="cegDragOver = true"
             @dragleave.prevent="cegDragOver = false"
             @drop.prevent="cegDragOver = false; if ($event.dataTransfer.files[0]) handleCegBannerFile($event.dataTransfer.files[0])"
             @click="$refs.cegFileInput.click()"
             :class="cegDragOver ? 'border-pink-500 bg-pink-50 dark:bg-pink-950/30 ring-2 ring-pink-300' : 'border-slate-300 dark:border-white/10 bg-white dark:bg-cyber-surface hover:bg-pink-50/40 dark:hover:bg-white/10 hover:border-pink-300'"
             class="border-2 border-dashed rounded-2xl p-4 text-center cursor-pointer transition flex flex-col items-center justify-center gap-1.5 mb-2 select-none">
            <i data-lucide="image" class="w-6 h-6 text-pink-500"></i>
            <p class="text-xs font-bold text-slate-800 dark:text-slate-200">
                Clique para escolher do PC ou dê <kbd class="px-1.5 py-0.5 bg-pink-100 dark:bg-pink-950/60 text-pink-700 dark:text-pink-300 border border-pink-200 dark:border-white/10 rounded font-black text-[10px]">Ctrl + V</kbd>
            </p>
            <p class="text-[10px] text-slate-400">Arraste a capa da CEG para cá</p>
        </div>

        <input type="file" x-ref="cegFileInput" name="banner_file" accept="image/*" class="hidden"
               @change="if ($event.target.files[0]) handleCegBannerFile($event.target.files[0])">
        <input type="hidden" name="banner_base64" x-ref="cegBannerBase64Input" :value="cegBannerBase64">
        <input type="hidden" name="banner_url" x-ref="cegBannerUrlInput" :value="cegBannerUrl">

        <div class="mt-1">
            <div class="flex items-center gap-2 mb-1" x-show="cegBannerUrl && (cegBannerUrl.startsWith('/media/') || cegBannerUrl.startsWith('data:'))">
                <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-[10px] font-bold bg-emerald-50 dark:bg-emerald-950/50 text-emerald-700 dark:text-emerald-300 border border-emerald-200 dark:border-white/10">
                    <i data-lucide="check" class="w-2.5 h-2.5"></i>
                    <span>Banner do computador ativo</span>
                </span>
                <span class="text-[10px] text-slate-400">Para trocar por link da web, digite abaixo:</span>
            </div>
            <input type="text"
                   :value="cegBannerUrl && (cegBannerUrl.startsWith('/media/') || cegBannerUrl.startsWith('data:')) ? '' : cegBannerUrl"
                   @input="cegBannerUrl = $event.target.value; cegBannerPreview = $event.target.value; cegBannerBase64 = ''; if ($refs.cegBannerUrlInput) $refs.cegBannerUrlInput.value = $event.target.value; if ($refs.cegBannerBase64Input) $refs.cegBannerBase64Input.value = ''"
                   placeholder="Ou cole a URL direta do banner (https://...)"
                   class="w-full bg-white dark:bg-cyber-surface border border-slate-200 dark:border-white/10 rounded-xl px-3.5 py-2 text-xs text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-pink-500 transition">
        </div>
    </div>
</div>

<!-- Seção 2: Datas, Horário de Abertura & Status -->
<div class="p-4 sm:p-5 bg-slate-50/80 dark:bg-white/[0.03] rounded-2xl border border-slate-200/80 dark:border-white/10 space-y-3.5">
    <span class="text-xs font-black text-purple-600 dark:text-purple-400 uppercase tracking-wider flex items-center gap-1.5">
        <i data-lucide="clock" class="w-3.5 h-3.5"></i>
        <span>2. Horário de Abertura (Standby / Countdown) & Status</span>
    </span>
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
        <div>
            <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">Status Inicial</label>
            <select name="status" x-model="cegStatus"
                    class="w-full bg-white dark:bg-cyber-surface border border-slate-200 dark:border-white/10 rounded-xl px-3 py-2 text-xs font-bold text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-pink-500">
                <option value="OPEN" selected>Aberta para Reservas (Imediato)</option>
                <option value="POLLING">Enquete / Sondagem de Demanda (Sem Sets Iniciais)</option>
                <option value="SCHEDULED">Agendada (Standby / Countdown)</option>
                <option value="DRAFT">Rascunho</option>
            </select>
        </div>

        <div>
            <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">Hora de Abertura (Standby / Countdown)</label>
            <input type="datetime-local" name="opens_at"
                   class="w-full bg-white dark:bg-cyber-surface border border-slate-200 dark:border-white/10 rounded-xl px-3 py-2 text-xs font-semibold text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-pink-500">
            <span class="text-[10px] text-pink-600 dark:text-pink-400 font-semibold block mt-0.5"
                  x-text="cegStatus === 'POLLING' ? 'Opcional na Enquete: Deixe em branco para abrir votação imediata, ou defina um horário para contagem regressiva!' : 'Exibe cronômetro regressivo na página pública até a abertura!'">
            </span>
        </div>

        <div>
            <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">Hora de Encerramento (opcional)</label>
            <input type="datetime-local" name="closes_at"
                   class="w-full bg-white dark:bg-cyber-surface border border-slate-200 dark:border-white/10 rounded-xl px-3 py-2 text-xs font-semibold text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-pink-500">
        </div>
    </div>
</div>
