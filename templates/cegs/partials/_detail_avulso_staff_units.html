<!-- ==========================================
     PAINEL STAFF: GESTÃO DE UNIDADES DO ITEM AVULSO
     Acordeão retrátil para conferência e toggles de pagamento
     100% Lucide Icons (`stroke-width="1.75"`) (< 200 linhas)
     ========================================== -->
{% if user.is_staff %}
<div class="pt-2 border-t border-slate-100 dark:border-white/5" x-data="{ staffUnitsOpen: false }">
    <button type="button" @click.stop="staffUnitsOpen = !staffUnitsOpen"
        class="w-full py-1.5 px-2 rounded-xl text-[10px] font-bold transition flex items-center justify-between border cursor-pointer select-none
               bg-slate-50 hover:bg-purple-50 text-slate-700 hover:text-purple-700 border-slate-200/80 hover:border-purple-300
               dark:bg-white/[0.04] dark:hover:bg-white/[0.08] dark:text-slate-300 dark:hover:text-cyber-neon dark:border-white/10 shadow-2xs">
        <span class="flex items-center gap-1.5 truncate">
            <i data-lucide="shield" class="w-3 h-3 text-purple-500" stroke-width="1.75"></i>
            <span class="truncate">Unidades Físicas</span>
            <span class="px-1.5 py-0.2 rounded-full text-[9px] font-black bg-purple-100 text-purple-800 dark:bg-purple-950/80 dark:text-purple-300 border border-purple-200 dark:border-purple-800/60">
                {{ idef.slots_count }}
            </span>
        </span>
        <i data-lucide="chevron-down" class="w-3 h-3 text-slate-400 transition-transform duration-200" stroke-width="1.75"
           :class="staffUnitsOpen ? 'rotate-180 text-purple-600 dark:text-cyber-neon' : ''"></i>
    </button>

    <div x-show="staffUnitsOpen" x-cloak
        x-transition:enter="transition ease-out duration-200"
        x-transition:enter-start="opacity-0 -translate-y-1"
        x-transition:enter-end="opacity-100 translate-y-0"
        class="mt-2 space-y-1.5 max-h-56 overflow-y-auto pr-0.5 custom-scrollbar">
        {% for slot in idef.matching_slots %}
        <div class="p-2 rounded-xl bg-slate-50 dark:bg-white/[0.03] border border-slate-200/80 dark:border-white/5 space-y-1.5 text-xs shadow-2xs"
             x-data="{
                 unitSlotId: {{ slot.id }},
                 isItemPaid: {{ slot.is_item_paid|yesno:'true,false' }},
                 isInterPaid: {{ slot.is_frete_inter_paid|yesno:'true,false' }},
                 loading: false,
                 async togglePay(field) {
                     if (this.loading) return;
                     this.loading = true;
                     try {
                         const csrf = document.querySelector('[name=csrfmiddlewaretoken]')?.value || '{{ csrf_token }}';
                         const res = await fetch('/slots/' + this.unitSlotId + '/toggle-payment/', {
                             method: 'POST',
                             headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrf },
                             body: JSON.stringify({ field: field })
                         });
                         const data = await res.json();
                         if (data.success) {
                             this.isItemPaid = data.is_item_paid;
                             this.isInterPaid = data.is_frete_inter_paid;
                         } else {
                             alert(data.message || 'Erro ao alterar pagamento');
                         }
                     } catch(e) {
                         alert('Erro: ' + e);
                     } finally {
                         this.loading = false;
                     }
                 }
             }">
            <div class="flex items-center justify-between text-[10px] gap-1">
                <div class="flex items-center gap-1.5 min-w-0">
                    <span class="font-black text-slate-700 dark:text-slate-300 font-mono">
                        #{{ slot.unit_number }}
                    </span>
                    {% if slot.claimed_by %}
                    <span class="font-bold text-pink-600 dark:text-pink-400 truncate max-w-[100px]" title="{{ slot.claimed_by.display_name }}">
                        {{ slot.claimed_by.social_handle|default:slot.claimed_by.display_name }}
                    </span>
                    {% else %}
                    <span class="font-black text-emerald-600 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-950/60 px-1.5 py-0.5 rounded text-[9px]">
                        Disponível
                    </span>
                    {% endif %}
                </div>

                <div class="flex items-center gap-1.5 shrink-0">
                    <template x-if="claimLogsBySlot[{{ slot.id }}] && claimLogsBySlot[{{ slot.id }}].length > 0">
                        <button type="button" @click.stop="openSlotLogsModal({{ slot.id }})"
                            class="text-[9px] font-bold text-purple-600 dark:text-purple-400 hover:underline flex items-center gap-0.5 cursor-pointer"
                            title="Ver histórico de reservas">
                            <i data-lucide="history" class="w-2.5 h-2.5" stroke-width="1.75"></i>
                            <span x-text="'Logs (' + claimLogsBySlot[{{ slot.id }}].length + ')'"></span>
                        </button>
                    </template>
                    <button type="button"
                        @click.stop="openManageSlotModal({
                            id: {{ slot.id }}, itemDefId: {{ idef.id }},
                            name: '{{ idef.name|escapejs }} (Unid. #{{ slot.unit_number }})',
                            member: '{{ idef.member_name|default:''|escapejs }}',
                            itemType: '{{ idef.item_type }}', tipoItemId: '{{ idef.tipo_item_id|default:'' }}',
                            setNumber: 'Avulso #{{ slot.unit_number }}', price: '{{ slot.price|stringformat:'.2f' }}', status: '{{ slot.status }}',
                            statusDisplay: '{% if slot.status == 'PAID' %}Confirmado / Pago{% elif slot.status == 'RESERVED' %}Reservado{% else %}Disponível{% endif %}',
                            claimedById: '{{ slot.claimed_by.id|default:'' }}', claimedByName: '{{ slot.claimed_by.display_name|default:''|escapejs }}',
                            claimedByHandle: '{{ slot.claimed_by.social_handle|default:''|escapejs }}', isItemPaid: isItemPaid
                        })"
                        class="text-[9px] font-bold text-pink-600 dark:text-pink-400 hover:underline flex items-center gap-0.5 cursor-pointer"
                        title="Gerenciar vaga, trocar joiner ou status">
                        <i data-lucide="settings-2" class="w-2.5 h-2.5" stroke-width="1.75"></i>
                        <span>Gerenciar</span>
                    </button>
                </div>
            </div>

            {% if slot.claimed_by %}
            <div class="flex items-center gap-1 pt-1 border-t border-slate-200/60 dark:border-white/5">
                <button type="button" @click.stop="togglePay('is_item_paid')" :disabled="loading"
                    class="flex-1 py-1 px-1.5 rounded-lg text-[9px] font-black transition flex items-center justify-center gap-1 cursor-pointer"
                    :class="isItemPaid
                        ? 'bg-emerald-100 text-emerald-800 dark:bg-emerald-950/80 dark:text-emerald-300 border border-emerald-300 dark:border-emerald-700'
                        : 'bg-white dark:bg-slate-800 text-slate-500 border border-slate-200 dark:border-white/10 hover:border-emerald-300'">
                    <i data-lucide="check" class="w-2.5 h-2.5" stroke-width="1.75"></i>
                    <span>Item</span>
                </button>
                <button type="button" @click.stop="togglePay('is_frete_inter_paid')" :disabled="loading"
                    class="flex-1 py-1 px-1.5 rounded-lg text-[9px] font-black transition flex items-center justify-center gap-1 cursor-pointer"
                    :class="isInterPaid
                        ? 'bg-sky-100 text-sky-800 dark:bg-sky-950/80 dark:text-sky-300 border border-sky-300 dark:border-sky-700'
                        : 'bg-white dark:bg-slate-800 text-slate-500 border border-slate-200 dark:border-white/10 hover:border-sky-300'">
                    <i data-lucide="plane" class="w-2.5 h-2.5" stroke-width="1.75"></i>
                    <span>Inter</span>
                </button>
            </div>
            {% endif %}
        </div>
        {% endfor %}
    </div>
</div>
{% endif %}
