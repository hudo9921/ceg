<!-- Cards de Resumo Rápido (KPIs) -->
<div id="kpisContainer" class="grid grid-cols-2 md:grid-cols-4 gap-4 transition-opacity duration-150" :class="isLoading ? 'opacity-50 pointer-events-none' : 'opacity-100'">
    <!-- 1. Total de Logs -->
    <div class="bg-white dark:bg-slate-900 p-5 rounded-2xl border border-slate-200 dark:border-white/10 shadow-2xs space-y-1">
        <div class="flex items-center justify-between text-slate-500 dark:text-slate-400">
            <span class="text-xs font-bold uppercase tracking-wider">Total de Eventos</span>
            <i data-lucide="clipboard-list" class="w-5 h-5 text-slate-400"></i>
        </div>
        <p class="text-2xl font-black text-slate-900 dark:text-white">{{ total_logs }}</p>
        <p class="text-[11px] text-slate-400 font-medium">Registros no histórico geral</p>
    </div>

    <!-- 2. Contas Criadas -->
    <div class="bg-white dark:bg-slate-900 p-5 rounded-2xl border border-purple-100 dark:border-purple-900/30 shadow-2xs space-y-1">
        <div class="flex items-center justify-between text-purple-600 dark:text-purple-400">
            <span class="text-xs font-bold uppercase tracking-wider">Contas / Joiners</span>
            <i data-lucide="user" class="w-5 h-5"></i>
        </div>
        <p class="text-2xl font-black text-purple-700 dark:text-purple-300">{{ total_accounts }}</p>
        <p class="text-[11px] text-purple-400 font-medium">Participantes cadastrados</p>
    </div>

    <!-- 3. Claims & Tentativas -->
    <div class="bg-white dark:bg-slate-900 p-5 rounded-2xl border border-sky-100 dark:border-sky-900/30 shadow-2xs space-y-1">
        <div class="flex items-center justify-between text-sky-600 dark:text-sky-400">
            <span class="text-xs font-bold uppercase tracking-wider">Claims & Corridas</span>
            <i data-lucide="target" class="w-5 h-5"></i>
        </div>
        <p class="text-2xl font-black text-sky-700 dark:text-sky-300">{{ total_claims }}</p>
        <p class="text-[11px] text-sky-400 font-medium">Tentativas e reservas</p>
    </div>

    <!-- 4. Pagamentos Auditados -->
    <div class="bg-white dark:bg-slate-900 p-5 rounded-2xl border border-emerald-100 dark:border-emerald-900/30 shadow-2xs space-y-1">
        <div class="flex items-center justify-between text-emerald-600 dark:text-emerald-400">
            <span class="text-xs font-bold uppercase tracking-wider">Alterações de Pagamento</span>
            <i data-lucide="credit-card" class="w-5 h-5"></i>
        </div>
        <p class="text-2xl font-black text-emerald-700 dark:text-emerald-300">{{ total_payments }}</p>
        <p class="text-[11px] text-emerald-400 font-medium">Item, frete e taxa auditados</p>
    </div>
</div>
