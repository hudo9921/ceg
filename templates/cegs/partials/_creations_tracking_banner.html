{% comment %}Atalho para acompanhar as CEGs criadas (vagas, sets e pagamentos) e as caixas.{% endcomment %}
<section class="ui-card p-5 flex flex-col sm:flex-row sm:items-center gap-4" aria-label="Acompanhar">
    <div class="flex-1 space-y-1">
        <h2 class="ui-disp text-xl">Acompanhar o que você criou</h2>
        <p class="ui-muted text-sm">Vagas preenchidas, sets fechando, pagamentos e frete/taxa de cada CEG.</p>
    </div>
    <div class="flex flex-wrap gap-2">
        <a href="{% url 'cegs_status' %}" class="ui-btn ui-btn-primary">Ver CEGs</a>
        <a href="{% url 'caixas_dashboard' %}" class="ui-btn ui-btn-ghost">Ver caixas</a>
    </div>
</section>
