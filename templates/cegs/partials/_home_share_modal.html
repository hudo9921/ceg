<!-- Modal do Gerador de Divulgação (Exclusivo para Staff / Admin GOM) -->
{% if user.is_staff %}
<div x-show="shareModalOpen" x-cloak
     class="fixed inset-0 z-50 overflow-y-auto bg-slate-950/70 backdrop-blur-xs flex items-center justify-center p-4 sm:p-6"
     @keydown.escape.window="closeShareModal()">
    <div class="bg-white dark:bg-cyber-surface rounded-3xl max-w-xl w-full p-6 sm:p-7 shadow-2xl space-y-5 border border-purple-100/70 dark:border-white/10 transition-all transform my-auto"
         @click.away="closeShareModal()">

        <!-- Header -->
        <div class="flex items-center justify-between pb-3 border-b border-purple-100/60 dark:border-white/5">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-pink-500 to-purple-600 text-white flex items-center justify-center text-xl shadow-xs">
                    <i data-lucide="share-2" class="w-5 h-5"></i>
                </div>
                <div>
                    <h3 class="font-black text-slate-900 dark:text-cyber-silver text-base leading-tight">
                        Gerador de Divulgação de Vagas
                    </h3>
                    <p class="text-xs text-slate-500 dark:text-slate-400 font-medium">
                        Texto pronto para redes sociais da CEG <span class="font-bold text-slate-800 dark:text-cyber-silver" x-text="currentShareCeg ? currentShareCeg.title : ''"></span>
                    </p>
                </div>
            </div>
            <button type="button" @click="closeShareModal()"
                    class="p-2 rounded-full bg-slate-100 dark:bg-cyber-elevated text-slate-400 hover:text-slate-700 dark:hover:text-cyber-silver transition cursor-pointer">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
        </div>

        <!-- Customização: Marcador e Opções -->
        <div class="space-y-3 bg-purple-50/40 dark:bg-cyber-elevated/60 p-3.5 rounded-2xl border border-purple-100/60 dark:border-white/5">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2.5">
                <div class="flex items-center gap-2">
                    <span class="text-xs font-bold text-slate-600 dark:text-cyber-silver">Marcador de vaga:</span>
                    <div class="inline-flex rounded-xl bg-white dark:bg-cyber-surface p-1 border border-purple-100 dark:border-white/10 shadow-2xs gap-1">
                        <button type="button" @click="shareEmoji = '🟢'"
                                class="px-2 py-0.5 rounded-lg text-sm transition cursor-pointer"
                                :class="shareEmoji === '🟢' ? 'bg-purple-100 dark:bg-cyber-elevated text-pink-700 dark:text-cyber-neon font-black' : 'hover:bg-slate-100 dark:hover:bg-cyber-elevated'">🟢</button>
                        <button type="button" @click="shareEmoji = '⭕'"
                                class="px-2 py-0.5 rounded-lg text-sm transition cursor-pointer"
                                :class="shareEmoji === '⭕' ? 'bg-purple-100 dark:bg-cyber-elevated text-pink-700 dark:text-cyber-neon font-black' : 'hover:bg-slate-100 dark:hover:bg-cyber-elevated'">⭕</button>
                        <button type="button" @click="shareEmoji = '✅'"
                                class="px-2 py-0.5 rounded-lg text-sm transition cursor-pointer"
                                :class="shareEmoji === '✅' ? 'bg-purple-100 dark:bg-cyber-elevated text-pink-700 dark:text-cyber-neon font-black' : 'hover:bg-slate-100 dark:hover:bg-cyber-elevated'">✅</button>
                        <button type="button" @click="shareEmoji = '🪪'"
                                class="px-2 py-0.5 rounded-lg text-sm transition cursor-pointer"
                                :class="shareEmoji === '🪪' ? 'bg-purple-100 dark:bg-cyber-elevated text-pink-700 dark:text-cyber-neon font-black' : 'hover:bg-slate-100 dark:hover:bg-cyber-elevated'">🪪</button>
                    </div>
                </div>

                <div class="flex items-center gap-4 text-xs font-bold text-slate-600 dark:text-cyber-silver">
                    <label class="flex items-center gap-1.5 cursor-pointer">
                        <input type="checkbox" x-model="shareShowSoldOut" class="rounded text-pink-600 focus:ring-pink-500">
                        <span>Mostrar esgotados (❌)</span>
                    </label>
                    <label class="flex items-center gap-1.5 cursor-pointer" x-show="currentShareCeg && currentShareCeg.price_display">
                        <input type="checkbox" x-model="shareIncludePrice" class="rounded text-pink-600 focus:ring-pink-500">
                        <span>Incluir valor</span>
                    </label>
                </div>
            </div>
        </div>

        <!-- Preview do Texto -->
        <div class="space-y-2">
            <div class="flex items-center justify-between">
                <span class="text-xs font-black text-slate-700 dark:text-cyber-silver uppercase tracking-wider flex items-center gap-1.5">
                    <i data-lucide="file-text" class="w-3.5 h-3.5 text-purple-400"></i>
                    <span>Prévia do Texto:</span>
                </span>
                <span class="text-[11px] font-semibold text-slate-400">
                    <span x-text="shareText.length"></span> caracteres
                    <span x-show="shareText.length <= 280" class="text-emerald-600 dark:text-emerald-400 font-bold ml-1">✓ Cabe no Twitter/X</span>
                </span>
            </div>
            <textarea
                readonly
                :value="shareText"
                @click="$event.target.select()"
                rows="8"
                class="w-full text-xs font-mono bg-slate-900 text-slate-100 p-3.5 rounded-2xl border border-slate-700 focus:outline-hidden focus:ring-2 focus:ring-pink-500 leading-relaxed resize-y select-all shadow-inner"
                title="Clique para selecionar tudo"></textarea>
        </div>

        <!-- Botão Copiar -->
        <div class="pt-2 border-t border-purple-100/60 dark:border-white/5 flex justify-end">
            <button type="button" @click="copyShareText()"
                    class="w-full sm:w-auto px-6 py-3 rounded-2xl font-black text-xs transition flex items-center justify-center gap-2 shadow-sm cursor-pointer select-none"
                    :class="shareCopied
                        ? 'bg-emerald-600 hover:bg-emerald-700 text-white shadow-emerald-500/20'
                        : 'bg-gradient-to-r from-purple-600 via-pink-600 to-rose-500 hover:from-purple-700 hover:to-rose-600 text-white'">
                <i data-lucide="check" x-show="shareCopied" class="w-4 h-4"></i>
                <i data-lucide="copy" x-show="!shareCopied" class="w-4 h-4"></i>
                <span x-text="shareCopied ? 'Copiado para o Clipboard!' : 'Copiar Texto Completo'"></span>
            </button>
        </div>

    </div>
</div>
{% endif %}
