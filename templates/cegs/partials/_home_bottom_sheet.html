<!-- Modal & Gaveta Universal de Vagas Disponíveis (Mobile Bottom Sheet & Desktop Acrylic Modal) -->
<div x-show="bottomSheetOpen"
     x-cloak
     class="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4"
     aria-labelledby="bottom-sheet-title"
     role="dialog"
     aria-modal="true"
     @keydown.escape.window="closeBottomSheet()">
    
    <!-- Backdrop com Blur Suave -->
    <div x-show="bottomSheetOpen"
         x-transition:enter="transition-opacity ease-out duration-300"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="transition-opacity ease-in duration-200"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0"
         class="fixed inset-0 bg-slate-950/70 backdrop-blur-sm cursor-pointer"
         @click="closeBottomSheet()"></div>

    <!-- Container Dialog (Gaveta no Celular / Modal Centralizado no Desktop) -->
    <div x-show="bottomSheetOpen"
         :style="'--era-accent: ' + (activeSheetCeg?.theme_color || '#F472B6') + ';'"
         x-transition:enter="transition ease-out duration-300 transform"
         x-transition:enter-start="translate-y-full sm:translate-y-0 sm:scale-95 sm:opacity-0"
         x-transition:enter-end="translate-y-0 sm:scale-100 sm:opacity-100"
         x-transition:leave="transition ease-in duration-200 transform"
         x-transition:leave-start="translate-y-0 sm:scale-100 sm:opacity-100"
         x-transition:leave-end="translate-y-full sm:translate-y-0 sm:scale-95 sm:opacity-0"
         class="relative z-10 w-full sm:max-w-lg bg-white dark:bg-[#14121B] rounded-t-[32px] sm:rounded-3xl border border-slate-200/80 dark:border-white/10 shadow-2xl p-5 sm:p-6 space-y-4 max-h-[88vh] flex flex-col overflow-hidden">
        
        <!-- Puxador Superior no Mobile com Acento da Era -->
        <div class="sm:hidden flex justify-center -mt-2 pb-1">
            <div class="w-12 h-1.5 rounded-full bg-slate-300 dark:bg-white/20"></div>
        </div>

        <!-- Cabeçalho do Card Selecionado com Foto/Banner -->
        <div class="flex items-start justify-between gap-3 border-b border-slate-100 dark:border-white/10 pb-3">
            <div class="flex items-center gap-3 min-w-0 flex-1">
                <template x-if="activeSheetCeg?.banner_url">
                    <img :src="activeSheetCeg.banner_url"
                         class="w-12 h-12 rounded-2xl object-cover shrink-0 border border-slate-200/80 dark:border-white/10 shadow-2xs">
                </template>
                <div class="min-w-0 flex-1">
                    <span class="text-[10px] font-black uppercase tracking-wider block truncate"
                          :style="'color: var(--era-title-color, var(--era-accent));'"
                          x-text="activeSheetCeg?.group_era"></span>
                    <h3 class="text-sm sm:text-base font-black text-slate-900 dark:text-white leading-snug line-clamp-2"
                        x-text="activeSheetCeg?.title"></h3>
                </div>
            </div>
            <button type="button"
                    @click="closeBottomSheet()"
                    class="p-2 rounded-xl bg-slate-100 dark:bg-white/10 text-slate-400 hover:text-slate-700 dark:hover:text-white cursor-pointer transition active:scale-95 shrink-0">
                <i data-lucide="x" class="w-4 h-4" stroke-width="1.75"></i>
            </button>
        </div>

        <!-- Indicadores de Preço e Total de Vagas -->
        <div class="grid grid-cols-2 gap-3 p-3 rounded-2xl bg-slate-50/90 dark:bg-white/[0.03] border border-slate-200/80 dark:border-white/10">
            <div>
                <span class="text-[10px] uppercase font-bold text-slate-400 dark:text-slate-500 block">A partir de</span>
                <span class="text-sm sm:text-base font-black font-mono tabular-nums"
                      :style="'color: var(--era-price-color, var(--era-accent));'"
                      x-text="'R$ ' + (activeSheetCeg?.price || '0.00')"></span>
            </div>
            <div>
                <span class="text-[10px] uppercase font-bold text-slate-400 dark:text-slate-500 block">Vagas Livres</span>
                <span class="text-sm sm:text-base font-black font-mono tabular-nums text-emerald-600 dark:text-emerald-400 flex items-center gap-1.5">
                    <i data-lucide="layers" class="w-4 h-4" stroke-width="1.75"></i>
                    <span x-text="activeSheetCeg?.vagas + ' disponíveis'"></span>
                </span>
            </div>
        </div>

        <!-- Lista Completa de Vagas por Integrante -->
        <div class="flex-1 overflow-hidden flex flex-col min-h-0 space-y-2">
            <div class="flex items-center justify-between text-xs font-bold text-slate-700 dark:text-slate-300 px-0.5">
                <span class="flex items-center gap-1.5">
                    <i data-lucide="sparkles" class="w-3.5 h-3.5 text-pink-500"></i>
                    <span>Itens Disponíveis para Reserva</span>
                </span>
                <span class="text-[11px] font-mono tabular-nums text-slate-400 dark:text-slate-500 font-normal"
                      x-text="(activeSheetCeg?.items || []).length + ' opções'"></span>
            </div>

            <!-- Grade Scrollável de Vagas -->
            <div class="overflow-y-auto max-h-[38vh] sm:max-h-[44vh] pr-1 space-y-2 no-scrollbar">
                <template x-for="(item, idx) in (activeSheetCeg?.items || [])" :key="idx">
                    <div class="p-2.5 rounded-2xl bg-white dark:bg-white/[0.04] border border-slate-200/80 dark:border-white/10 flex items-center justify-between gap-2.5 shadow-2xs hover:border-pink-300 dark:hover:border-pink-500/40 transition">
                        <div class="flex items-center gap-2.5 min-w-0">
                            <div class="w-8 h-8 rounded-xl bg-pink-50 dark:bg-pink-950/70 text-pink-700 dark:text-pink-300 font-black text-xs flex items-center justify-center shrink-0 border border-pink-200/60 dark:border-pink-800/40 shadow-2xs">
                                <span x-text="item.name ? item.name.slice(0, 1) : '★'"></span>
                            </div>
                            <div class="min-w-0">
                                <div class="text-xs font-black text-slate-900 dark:text-white truncate" x-text="item.name"></div>
                                <div class="text-[10px] text-slate-500 dark:text-slate-400 flex items-center gap-1.5 flex-wrap">
                                    <span x-text="item.item_name"></span>
                                    <span class="text-slate-300 dark:text-white/20">&bull;</span>
                                    <span class="text-emerald-600 dark:text-emerald-400 font-bold" x-text="item.sets"></span>
                                </div>
                            </div>
                        </div>
                        <div class="text-right shrink-0">
                            <span class="text-xs font-black font-mono tabular-nums text-pink-600 dark:text-pink-400"
                                  x-text="'R$ ' + item.price"></span>
                        </div>
                    </div>
                </template>
            </div>
        </div>

        <!-- Botão de Ação: Ir Direto para a CEG -->
        <div class="pt-2 border-t border-slate-100 dark:border-white/10">
            <a :href="activeSheetCeg?.url"
               :style="'background: linear-gradient(135deg, ' + (activeSheetCeg?.theme_color || '#db2777') + ', #9333ea); box-shadow: 0 4px 16px -2px color-mix(in srgb, ' + (activeSheetCeg?.theme_color || '#db2777') + ' 45%, transparent);'"
               class="w-full py-3.5 px-6 rounded-2xl hover:brightness-110 text-white font-black text-xs sm:text-sm active:scale-[0.98] transition-all flex items-center justify-center gap-2 cursor-pointer shadow-md">
                <span>Ir para a CEG e Reservar Photocard</span>
                <i data-lucide="arrow-right" class="w-4 h-4" stroke-width="1.75"></i>
            </a>
        </div>

    </div>
</div>
