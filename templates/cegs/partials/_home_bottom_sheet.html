<!-- Bottom Sheet (Gaveta Inferior Ergonômica para Mobile com Acabamento Cyber-Luxury) -->
<div x-show="bottomSheetOpen"
     x-cloak
     class="relative z-50 md:hidden"
     aria-labelledby="bottom-sheet-title"
     role="dialog"
     aria-modal="true">
    
    <!-- Backdrop com Blur Suave -->
    <div x-show="bottomSheetOpen"
         x-transition:enter="transition-opacity ease-out duration-300"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="transition-opacity ease-in duration-200"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0"
         class="fixed inset-0 bg-slate-950/70 backdrop-blur-xs"
         @click="closeBottomSheet()"></div>

    <!-- Gaveta Deslizante que Sobe do Rodapé -->
    <div class="fixed inset-x-0 bottom-0 pointer-events-auto">
        <div x-show="bottomSheetOpen"
             x-transition:enter="transition ease-out duration-300 transform"
             x-transition:enter-start="translate-y-full"
             x-transition:enter-end="translate-y-0"
             x-transition:leave="transition ease-in duration-200 transform"
             x-transition:leave-start="translate-y-0"
             x-transition:leave-end="translate-y-full"
             class="w-full bg-white/95 dark:bg-cyber-surface/95 backdrop-blur-2xl rounded-t-[32px] border-t border-purple-100/70 dark:border-white/10 border-t-white/90 dark:border-t-white/20 shadow-2xl p-5 space-y-4 max-h-[85vh] overflow-y-auto">
            
            <!-- Barra Superior Acetinada para Arrastar/Fechar -->
            <div class="flex justify-center -mt-1 pb-2">
                <div class="w-12 h-1.5 rounded-full bg-slate-300 dark:bg-white/20"></div>
            </div>

            <!-- Cabeçalho do Card Selecionado -->
            <div class="flex items-start justify-between gap-3">
                <div class="min-w-0 flex-1">
                    <span class="text-[11px] font-extrabold uppercase tracking-wider text-pink-600 dark:text-cyber-neon"
                          x-text="activeSheetCeg?.group_era"></span>
                    <h3 class="text-base font-black text-slate-800 dark:text-cyber-silver leading-snug mt-0.5"
                        x-text="activeSheetCeg?.title"></h3>
                </div>
                <button type="button"
                        @click="closeBottomSheet()"
                        class="p-2 rounded-full bg-slate-100 dark:bg-cyber-elevated text-slate-400 hover:text-slate-600 dark:hover:text-cyber-silver cursor-pointer transition active:scale-90">
                    <i data-lucide="x" class="w-4 h-4" stroke-width="1.75"></i>
                </button>
            </div>

            <!-- Preço e Vagas Disponíveis -->
            <div class="grid grid-cols-2 gap-3 p-3.5 rounded-2xl bg-purple-50/50 dark:bg-cyber-elevated border border-purple-100/60 dark:border-white/5">
                <div>
                    <span class="text-[10px] uppercase font-bold text-slate-400 block">Preço</span>
                    <span class="text-base font-black font-mono tabular-nums text-pink-600 dark:text-cyber-neon"
                          x-text="'R$ ' + (activeSheetCeg?.price || '0.00')"></span>
                </div>
                <div>
                    <span class="text-[10px] uppercase font-bold text-slate-400 block">Vagas Livres</span>
                    <span class="text-base font-black font-mono tabular-nums text-emerald-600 dark:text-emerald-400 flex items-center gap-1.5">
                        <i data-lucide="layers" class="w-4 h-4" stroke-width="1.75"></i>
                        <span x-text="activeSheetCeg?.vagas + ' slots'"></span>
                    </span>
                </div>
            </div>

            <!-- Membros com Vagas Disponíveis -->
            <div class="space-y-1.5" x-show="activeSheetCeg?.members?.length">
                <span class="text-xs font-bold text-slate-600 dark:text-cyber-silver">Integrantes com vaga neste momento:</span>
                <div class="flex flex-wrap gap-1.5">
                    <template x-for="member in (activeSheetCeg?.members || [])" :key="member">
                        <span class="px-2.5 py-1 rounded-full text-xs font-bold bg-white dark:bg-cyber-surface text-purple-700 dark:text-cyber-electric border border-purple-100 dark:border-white/10 shadow-2xs"
                              x-text="member"></span>
                    </template>
                </div>
            </div>

            <!-- Botão de Ação no Alcance do Polegar (Altura Ergonômica 48px+) -->
            <div class="pt-2">
                <a :href="activeSheetCeg?.url"
                   class="w-full py-4 px-6 rounded-2xl bg-slate-900 hover:bg-slate-800 text-white dark:bg-white dark:text-slate-950 dark:hover:bg-slate-100 font-black text-sm shadow-md active:scale-98 transition-all flex items-center justify-center gap-2">
                    <span>Acessar e Escolher Photocards</span>
                    <i data-lucide="arrow-right" class="w-4 h-4" stroke-width="1.75"></i>
                </a>
            </div>

        </div>
    </div>
</div>
