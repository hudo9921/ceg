<!-- MODAL 1: DESPACHO / MARCAR COMO ENVIADO -->
<div x-show="dispatchModalOpen" x-cloak class="fixed inset-0 z-50 overflow-y-auto" role="dialog" aria-modal="true">
    <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs" @click="dispatchModalOpen = false"></div>
    <div class="flex min-h-full items-center justify-center p-4">
        <div class="relative bg-white dark:bg-slate-900 rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4 border border-slate-200 dark:border-slate-800" @click.stop>
            <div class="flex items-center justify-between border-b border-slate-100 dark:border-slate-800 pb-3">
                <div class="flex items-center gap-2">
                    <i data-lucide="rocket" class="w-5 h-5 text-emerald-600 dark:text-emerald-400"></i>
                    <h3 class="text-base font-black text-slate-900 dark:text-white">Despachar Pacote</h3>
                </div>
                <button type="button" @click="dispatchModalOpen = false" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 cursor-pointer">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <form :action="'/envios/pacote/' + dispatchPacoteId + '/marcar-enviado/'" method="post" class="space-y-4">
                {% csrf_token %}
                <input type="hidden" name="next" value="/envios/">

                <div class="bg-slate-50 dark:bg-slate-800/60 p-3 rounded-xl border border-slate-200 dark:border-slate-700 text-xs">
                    <span class="text-slate-500 dark:text-slate-400">Pacote selecionado:</span>
                    <strong class="text-slate-900 dark:text-white ml-1" x-text="dispatchPacoteIdentificador"></strong>
                </div>

                <div class="space-y-1">
                    <label class="text-xs font-bold text-slate-700 dark:text-slate-300">Código de Rastreio <span class="text-red-500">*</span></label>
                    <input type="text" name="codigo_rastreio" x-model="dispatchCodigoRastreio" required
                           placeholder="Ex: NL123456789BR ou QD123456789BR"
                           class="w-full uppercase font-mono px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl text-xs font-bold text-slate-900 dark:text-white focus:bg-white focus:ring-2 focus:ring-pink-500">
                </div>

                <div class="space-y-1">
                    <label class="text-xs font-bold text-slate-700 dark:text-slate-300">Transportadora / Modalidade</label>
                    <input type="text" name="transportadora" x-model="dispatchTransportadora"
                           placeholder="Ex: Correios Mini Envios, PAC, Sedex, Jadlog"
                           class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl text-xs font-semibold text-slate-900 dark:text-white focus:bg-white focus:ring-2 focus:ring-pink-500">
                </div>

                <div class="pt-2 flex justify-end gap-2">
                    <button type="button" @click="dispatchModalOpen = false"
                            class="px-4 py-2 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 rounded-xl text-xs font-bold hover:bg-slate-50 dark:hover:bg-slate-800 transition cursor-pointer">
                        Cancelar
                    </button>
                    <button type="submit"
                            class="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold shadow transition flex items-center gap-1.5 cursor-pointer">
                        <i data-lucide="rocket" class="w-3.5 h-3.5"></i>
                        <span>Confirmar Despacho</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
