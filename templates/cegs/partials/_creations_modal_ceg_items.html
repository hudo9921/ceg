<!-- SEÇÃO 6: CONSTRUTOR DINÂMICO DE PHOTOCARDS, VALORES & PRÉ-RESERVAS -->
<div class="p-4 bg-pink-50/50 dark:bg-pink-950/20 rounded-2xl border border-pink-200/80 dark:border-pink-500/30 space-y-4">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b border-pink-100 dark:border-white/10 pb-2">
        <div>
            <span class="text-xs font-black text-pink-900 dark:text-pink-300 uppercase tracking-wider flex items-center gap-1.5">
                <i data-lucide="layers" class="w-3.5 h-3.5 text-pink-500"></i>
                <span>6. Definição de Itens, Valores e Pré-Reservas</span>
            </span>
            <span class="text-[11px] text-slate-500 dark:text-cyber-silver">
                Defina os photocards/itens da CEG e pré-reserve slots para participantes cadastrados se desejar.
            </span>
        </div>
        <div class="flex items-center gap-2 self-start sm:self-auto flex-wrap">
            <button type="button" @click="openCropStudioForCeg()"
                    :disabled="!cegBannerPreview && !cegBannerUrl"
                    :class="(cegBannerPreview || cegBannerUrl) ? 'bg-gradient-to-r from-pink-600 to-purple-600 hover:from-pink-500 hover:to-purple-500 text-white shadow-sm' : 'bg-slate-100 dark:bg-white/5 text-slate-400 border border-slate-200 dark:border-white/10 cursor-not-allowed opacity-60'"
                    class="px-2.5 py-1.5 font-bold text-xs rounded-xl transition flex items-center gap-1.5 cursor-pointer"
                    :title="(cegBannerPreview || cegBannerUrl) ? 'Recortar fotos dos integrantes a partir da imagem da CEG' : 'Anexe o banner da CEG primeiro para recortar'">
                <i data-lucide="scissors" class="w-3.5 h-3.5"></i>
                <span>Recortar Fotos</span>
            </button>
            <button type="button" @click="showNewTipoModal = true"
                    class="px-2.5 py-1.5 bg-violet-50 dark:bg-violet-950/40 hover:bg-violet-100 dark:hover:bg-violet-900/50 text-violet-800 dark:text-violet-300 border border-violet-200/60 dark:border-white/10 font-bold text-xs rounded-xl transition flex items-center gap-1 cursor-pointer">
                <i data-lucide="tag" class="w-3.5 h-3.5"></i>
                <span>+ Novo Tipo</span>
            </button>
            <button type="button" @click="addItem()"
                    class="px-3 py-1.5 bg-pink-600 hover:bg-pink-700 text-white font-bold text-xs rounded-xl transition flex items-center gap-1 cursor-pointer hover:scale-[1.02]">
                <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                <span>Adicionar Item</span>
            </button>
        </div>
    </div>

    <!-- Barra de Atalho em Lote (Mass Apply) & Tipo de Item -->
    <div class="p-3.5 bg-white/95 dark:bg-cyber-surface/95 border border-pink-200/70 dark:border-white/10 rounded-2xl space-y-3 shadow-xs">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-1.5 border-b border-pink-100 dark:border-white/10 pb-2">
            <span class="text-[11px] font-black text-pink-900 dark:text-pink-300 uppercase flex items-center gap-1.5">
                <i data-lucide="zap" class="w-3.5 h-3.5 text-amber-500"></i>
                <span>Configuração em Lote (Mass Apply)</span>
            </span>
            <div class="flex items-center gap-2">
                <button type="button" @click="populateItemsFromGroup(selectedGroupId)"
                        x-show="selectedGroupId"
                        title="Recarrega a lista de itens com os integrantes do grupo selecionado"
                        class="text-[10px] text-pink-700 dark:text-pink-300 hover:text-pink-900 bg-pink-100 dark:bg-pink-950/60 hover:bg-pink-200 px-2 py-0.5 rounded-lg font-bold transition flex items-center gap-1 cursor-pointer">
                    <i data-lucide="rotate-ccw" class="w-3 h-3"></i>
                    <span>Restaurar Integrantes</span>
                </button>
                <span class="text-[10px] text-pink-700 dark:text-pink-300 bg-pink-50 dark:bg-pink-950/40 border border-pink-200 dark:border-white/10 px-2 py-0.5 rounded font-bold">Atalho Ágil</span>
            </div>
        </div>

        <!-- Linha de Mass Apply: Tipo de Item, Subcategoria, Preço e Botão Aplicar -->
        <div class="p-2.5 bg-pink-50/50 dark:bg-cyber-elevated/40 rounded-xl border border-pink-100/70 dark:border-white/10 space-y-2">
            <div class="grid grid-cols-1 sm:grid-cols-12 gap-2 items-end">
                <!-- 1. Tipo de Item em Lote -->
                <div :class="isPhotocardTipo(batchTipoItemId) ? 'sm:col-span-3' : 'sm:col-span-5'">
                    <label class="block text-[10px] font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wide mb-1">Tipo de Item</label>
                    <select x-model="batchTipoItemId" @change="onBatchTipoChange()"
                            class="w-full bg-white dark:bg-cyber-surface border border-slate-200 dark:border-white/10 rounded-lg px-2.5 py-1.5 text-xs font-bold text-slate-800 dark:text-white focus:ring-2 focus:ring-pink-500 shadow-2xs">
                        <template x-for="t in tiposItem" :key="t.id">
                            <option :value="t.id" x-text="t.nome" :selected="t.id == batchTipoItemId"></option>
                        </template>
                    </select>
                </div>

                <!-- 2. Subcategoria (Regulares, Pob, LD, VCE, Broadcast) -->
                <div class="sm:col-span-3" x-show="isPhotocardTipo(batchTipoItemId)">
                    <label class="block text-[10px] font-bold text-pink-900 dark:text-pink-300 uppercase tracking-wide mb-1 flex items-center gap-1">
                        <i data-lucide="sparkles" class="w-3 h-3 text-pink-500"></i>
                        <span>Subcategoria</span>
                    </label>
                    <select x-model="batchSubCategory"
                            class="w-full bg-white dark:bg-cyber-surface border border-pink-300 dark:border-white/10 text-pink-950 dark:text-pink-200 font-black rounded-lg px-2.5 py-1.5 text-xs focus:ring-2 focus:ring-pink-500 shadow-2xs">
                        <option value="Regulares">Regulares</option>
                        <option value="Pob">Pob</option>
                        <option value="LD">LD</option>
                        <option value="VCE">VCE</option>
                        <option value="Broadcast">Broadcast</option>
                    </select>
                </div>

                <!-- 3. Preço Padrão em Lote -->
                <div class="sm:col-span-3">
                    <label class="block text-[10px] font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wide mb-1">Preço em Lote (R$)</label>
                    <div class="relative">
                        <span class="absolute left-2.5 top-1.5 text-xs text-slate-400 font-bold">R$</span>
                        <input type="number" step="0.01" x-model="batchDefaultPrice"
                               class="w-full bg-white dark:bg-cyber-surface border border-slate-200 dark:border-white/10 rounded-lg pl-8 pr-2 py-1.5 text-xs font-black text-slate-900 dark:text-white focus:ring-2 focus:ring-pink-500 shadow-2xs">
                    </div>
                </div>

                <!-- 4. Botão Mass Apply -->
                <div :class="isPhotocardTipo(batchTipoItemId) ? 'sm:col-span-3' : 'sm:col-span-4'">
                    <button type="button" @click="applyBatchToAll()"
                            class="w-full py-2 px-3 bg-slate-900 dark:bg-pink-600 hover:bg-black dark:hover:bg-pink-700 text-white font-black text-xs rounded-lg shadow transition flex items-center justify-center gap-1.5 cursor-pointer">
                        <i data-lucide="zap" class="w-3 h-3 text-amber-400"></i>
                        <span>Aplicar em Todos</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Adicionar Itens Extras por Nomes -->
        <div class="grid grid-cols-1 sm:grid-cols-12 gap-2 items-center pt-0.5">
            <div class="sm:col-span-10">
                <input type="text" x-model="batchMembersText"
                       placeholder="Adicionar novos photocards/itens (nomes separados por vírgula)..."
                       @keydown.enter.prevent="addMembersBatch()"
                       class="w-full bg-slate-50 dark:bg-cyber-elevated border border-slate-200 dark:border-white/10 rounded-lg px-3 py-1.5 text-xs text-slate-800 dark:text-white focus:bg-white focus:ring-1 focus:ring-pink-500">
            </div>
            <div class="sm:col-span-2">
                <button type="button" @click="addMembersBatch()"
                        class="w-full py-1.5 bg-pink-600 hover:bg-pink-700 text-white font-bold text-xs rounded-lg shadow-xs transition flex items-center justify-center gap-1 cursor-pointer">
                    <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                    <span>Gerar</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Lista Dinâmica de Itens -->
    <div class="space-y-2.5">
        <template x-for="(item, index) in items" :key="index">
            <div class="p-3 bg-white/95 dark:bg-cyber-surface/95 border border-slate-200 dark:border-white/10 rounded-2xl space-y-2 shadow-xs">
                <div class="flex flex-col sm:flex-row items-start sm:items-center gap-2">
                    <!-- Miniatura / Photocard e Gatilho de Recorte -->
                    <div class="w-8 h-10 rounded-lg bg-pink-50 dark:bg-pink-950/40 border border-pink-200 dark:border-white/10 shrink-0 flex items-center justify-center overflow-hidden relative group/thumb cursor-pointer shadow-2xs"
                         @click="openCropStudioForCeg(index)"
                         title="Clique para recortar ou alterar a foto deste integrante no estúdio">
                        <template x-if="item.image_base64 || item.image_url">
                            <img :src="item.image_base64 || item.image_url" class="w-full h-full object-cover">
                        </template>
                        <template x-if="!item.image_base64 && !item.image_url">
                            <span class="text-[11px] text-pink-700 dark:text-cyber-neon font-black" x-text="index + 1"></span>
                        </template>
                        <div class="absolute inset-0 bg-black/60 opacity-0 group-hover/thumb:opacity-100 transition flex items-center justify-center text-white">
                            <i data-lucide="scissors" class="w-3 h-3"></i>
                        </div>
                    </div>

                    <!-- Nome do Item (Tipo de item ou Subtipo por padrão) -->
                    <div class="flex-1 w-full sm:w-auto">
                        <input type="text" x-model="item.name" required
                               placeholder="Nome do Item (Ex: LD, Pob, Álbum...)"
                               class="w-full bg-slate-50 dark:bg-cyber-elevated border border-slate-200 dark:border-white/10 rounded-lg px-3 py-1.5 text-xs font-bold text-slate-900 dark:text-white">
                    </div>

                    <!-- Integrante -->
                    <div class="w-full sm:w-28">
                        <input type="text" x-model="item.member_name"
                               placeholder="Integrante"
                               class="w-full bg-slate-50 dark:bg-cyber-elevated border border-slate-200 dark:border-white/10 rounded-lg px-2.5 py-1.5 text-xs text-slate-700 dark:text-cyber-silver">
                    </div>

                    <!-- Tipo -->
                    <div class="w-full sm:w-28">
                        <select x-model="item.tipo_item_id"
                                @change="onItemTipoChange(item, index)"
                                class="w-full bg-slate-50 dark:bg-cyber-elevated border border-slate-200 dark:border-white/10 rounded-lg px-2 py-1.5 text-xs font-semibold text-slate-700 dark:text-cyber-silver">
                            <template x-for="t in tiposItem" :key="t.id">
                                <option :value="t.id" x-text="t.nome" :selected="t.id == item.tipo_item_id"></option>
                            </template>
                        </select>
                    </div>

                    <!-- Subcategoria (Exibida se for Photocard) -->
                    <div class="w-full sm:w-28" x-show="isPhotocardTipo(item.tipo_item_id)">
                        <select x-model="item.sub_category"
                                @change="onItemSubCategoryChange(item, index)"
                                title="Subcategoria do Photocard"
                                class="w-full bg-pink-50 dark:bg-cyber-elevated border border-pink-300 dark:border-white/10 text-pink-950 dark:text-pink-200 font-bold rounded-lg px-2 py-1.5 text-xs focus:ring-2 focus:ring-pink-500">
                            <option value="Regulares">Regulares</option>
                            <option value="Pob">Pob</option>
                            <option value="LD">LD</option>
                            <option value="VCE">VCE</option>
                            <option value="Broadcast">Broadcast</option>
                        </select>
                    </div>

                    <!-- Preço -->
                    <div class="w-full sm:w-24 relative">
                        <span class="absolute left-2.5 top-1.5 text-xs text-slate-400 font-bold">R$</span>
                        <input type="number" step="0.01" x-model="item.default_price" required
                               class="w-full bg-slate-50 dark:bg-cyber-elevated border border-slate-200 dark:border-white/10 rounded-lg pl-7 pr-2 py-1.5 text-xs font-black text-slate-900 dark:text-white">
                    </div>

                    <!-- Botão Excluir -->
                    <button type="button" @click="removeItem(index)" title="Remover item"
                            class="text-slate-400 hover:text-red-600 dark:hover:text-rose-400 p-1.5 rounded-lg hover:bg-red-50 dark:hover:bg-white/5 cursor-pointer">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                    </button>
                </div>

                <!-- Linha de Pré-Reserva para Participante Cadastrado -->
                <div class="pt-2 border-t border-slate-100 dark:border-white/10 flex flex-col sm:flex-row sm:items-center justify-between gap-2 text-xs">
                    <div class="flex items-center gap-2 w-full sm:w-auto">
                        <span class="text-[11px] font-bold text-slate-600 dark:text-slate-400 flex items-center gap-1">
                            <i data-lucide="lock" class="w-3 h-3 text-amber-500"></i>
                            <span>Pré-reservar para:</span>
                        </span>
                        <select x-model="item.participant_id"
                                :class="item.participant_id ? 'border-amber-400 bg-amber-50 dark:bg-amber-950/40 text-amber-900 dark:text-amber-200 font-bold' : 'border-slate-200 dark:border-white/10 bg-slate-50 dark:bg-cyber-elevated text-slate-700 dark:text-cyber-silver'"
                                class="border rounded-lg px-2.5 py-1 text-xs focus:ring-2 focus:ring-pink-500">
                            <option value="">-- Aberto para Claim Geral (Sem Pré-Reserva) --</option>
                            <template x-for="p in participants" :key="p.id">
                                <option :value="p.id"
                                        x-text="p.name + (p.username ? ' (' + p.username + ')' : '') + ' • ' + p.whatsapp">
                                </option>
                            </template>
                        </select>
                    </div>

                    <div x-show="item.participant_id" class="text-[11px] text-amber-700 dark:text-amber-400 font-bold flex items-center gap-1">
                        <i data-lucide="check-circle" class="w-3 h-3"></i>
                        <span>Slot #1 começará garantido para este participante</span>
                    </div>
                </div>
            </div>
        </template>
    </div>

    <!-- Totalizadores -->
    <div class="p-3 bg-white/95 dark:bg-cyber-surface/95 border border-pink-200/80 dark:border-white/10 rounded-2xl flex items-center justify-between text-xs font-bold text-slate-700 dark:text-cyber-silver shadow-xs">
        <span>Total de Itens: <strong class="text-pink-600 dark:text-cyber-neon" x-text="items.length"></strong></span>
        <span>Faturamento 1 Set: <strong class="text-emerald-700 dark:text-emerald-400" x-text="'R$ ' + calculateSetTotal()"></strong></span>
    </div>
</div>
