{% comment %}Filtros detalhados (em cascata): grupo → era e integrante; status do item.{% endcomment %}
<div class="ui-card p-4 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
    <label class="space-y-1.5">
        <span class="ui-label">Grupo ou solista</span>
        <select x-model="selectedGroup" @change="onGroupChange()" class="ui-input w-full cursor-pointer">
            <option value="">Todos os grupos</option>
            {% for g in groups %}<option value="{{ g.id }}">{{ g.name }}</option>{% endfor %}
        </select>
    </label>
    <label class="space-y-1.5">
        <span class="ui-label">Era</span>
        <select x-model="selectedEra" @change="onFilterChange()" class="ui-input w-full cursor-pointer">
            <option value="">Todas as eras</option>
            <template x-for="e in filteredEras" :key="e.id"><option :value="e.id" x-text="e.name" :selected="e.id == selectedEra"></option></template>
        </select>
    </label>
    <label class="space-y-1.5">
        <span class="ui-label">Integrante</span>
        <select x-model="selectedMember" @change="onFilterChange()" class="ui-input w-full cursor-pointer">
            <option value="">Todos os integrantes</option>
            <template x-for="m in filteredMembers" :key="m"><option :value="m" x-text="m" :selected="m == selectedMember"></option></template>
        </select>
    </label>
    <label class="space-y-1.5">
        <span class="ui-label">Status</span>
        <select x-model="selectedStatus" @change="onFilterChange()" class="ui-input w-full cursor-pointer">
            <option value="DISPONIVEL">Disponíveis</option>
            <option value="RESERVADO">Reservados</option>
            <option value="VENDIDO">Vendidos</option>
            <option value="ALL">Todos</option>
        </select>
    </label>
</div>
