<!-- Linha 2: Dropdowns em Cascata (Grupo, Era, Membro, Status) -->
<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 pt-1">
    <!-- Dropdown de Grupo -->
    <div>
        <label class="block text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1 flex items-center gap-1">
            <i data-lucide="music-2" class="w-3.5 h-3.5 text-pink-500"></i>
            <span>Grupo / Solista</span>
        </label>
        <select x-model="selectedGroup" @change="onGroupChange()"
                class="w-full py-2 px-3 bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 rounded-xl text-xs font-semibold text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-pink-500/30 cursor-pointer">
            <option value="">Todos os Grupos</option>
            {% for g in groups %}
                <option value="{{ g.id }}">{{ g.name }}</option>
            {% endfor %}
        </select>
    </div>

    <!-- Dropdown de Era (Filtrado pelo Grupo) -->
    <div>
        <label class="block text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1 flex items-center gap-1">
            <i data-lucide="disc-3" class="w-3.5 h-3.5 text-purple-500"></i>
            <span>Era / Comeback</span>
        </label>
        <select x-model="selectedEra" @change="onFilterChange()"
                class="w-full py-2 px-3 bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 rounded-xl text-xs font-semibold text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-pink-500/30 cursor-pointer">
            <option value="">Todas as Eras</option>
            <template x-for="e in filteredEras" :key="e.id">
                <option :value="e.id" x-text="e.name" :selected="e.id == selectedEra"></option>
            </template>
        </select>
    </div>

    <!-- Dropdown de Membro / Integrante (Filtrado em cascata pelo Grupo) -->
    <div>
        <div class="flex items-center justify-between mb-1">
            <label class="block text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider flex items-center gap-1">
                <i data-lucide="sparkles" class="w-3.5 h-3.5 text-amber-500"></i>
                <span>Membro / Integrante</span>
            </label>
            <template x-if="selectedGroup && filteredMembers.length > 0">
                <span class="text-[10px] font-bold text-pink-500" x-text="filteredMembers.length + ' membro(s)'"></span>
            </template>
        </div>
        <select x-model="selectedMember" @change="onFilterChange()"
                class="w-full py-2 px-3 bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 rounded-xl text-xs font-semibold text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-pink-500/30 cursor-pointer">
            <option value="">Todos os Integrantes</option>
            <template x-for="m in filteredMembers" :key="m">
                <option :value="m" x-text="m" :selected="m == selectedMember"></option>
            </template>
        </select>
    </div>

    <!-- Status dos Itens -->
    <div>
        <label class="block text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1 flex items-center gap-1">
            <i data-lucide="package" class="w-3.5 h-3.5 text-teal-500"></i>
            <span>Status do Item</span>
        </label>
        <select x-model="selectedStatus" @change="onFilterChange()"
                class="w-full py-2 px-3 bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 rounded-xl text-xs font-semibold text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-pink-500/30 cursor-pointer">
            <option value="DISPONIVEL">Disponíveis (Pronta Entrega)</option>
            <option value="RESERVADO">Reservados</option>
            <option value="VENDIDO">Vendidos</option>
            <option value="ALL">Todos os Status</option>
        </select>
    </div>
</div>
