<!-- Painel Direito: Pré-visualização e Confirmação -->
<div class="lg:col-span-7 bg-white dark:bg-slate-900 p-6 rounded-2xl border border-slate-200 dark:border-white/10 shadow-sm space-y-4">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-3 border-b border-slate-100 dark:border-white/10">
        <div>
            <h3 class="text-sm font-black text-slate-900 dark:text-white flex items-center gap-2">
                <i data-lucide="eye" class="w-4 h-4 text-slate-500"></i>
                <span>Pré-visualização da Alocação</span>
            </h3>
            <p class="text-xs text-slate-400">Verifique os slots correspondentes antes de gravar no banco.</p>
        </div>

        <!-- Resumo dos Status -->
        <div class="flex items-center gap-2 text-xs font-bold" x-show="parseResult.rows && parseResult.rows.length > 0">
            <span class="px-2 py-0.5 rounded-full bg-emerald-100 dark:bg-emerald-950/50 text-emerald-800 dark:text-emerald-300">
                Prontos: <strong x-text="parseResult.summary ? parseResult.summary.ready : 0"></strong>
            </span>
            <span class="px-2 py-0.5 rounded-full bg-amber-100 dark:bg-amber-950/50 text-amber-800 dark:text-amber-300" x-show="parseResult.summary && parseResult.summary.conflicts > 0">
                Conflitos: <strong x-text="parseResult.summary.conflicts"></strong>
            </span>
            <span class="px-2 py-0.5 rounded-full bg-rose-100 dark:bg-rose-950/50 text-rose-800 dark:text-rose-300" x-show="parseResult.summary && parseResult.summary.errors > 0">
                Erros: <strong x-text="parseResult.summary.errors"></strong>
            </span>
        </div>
    </div>

    <!-- Lista de Pré-visualização -->
    <div class="max-h-[50vh] overflow-y-auto space-y-2 pr-1" x-show="parseResult.rows && parseResult.rows.length > 0">
        <template x-for="row in parseResult.rows" :key="row.line_number">
            <div class="p-3 rounded-xl border text-xs transition space-y-1.5"
                 :class="{
                     'bg-emerald-50/50 dark:bg-emerald-950/20 border-emerald-200 dark:border-emerald-800/40': row.status === 'READY',
                     'bg-amber-50/60 dark:bg-amber-950/20 border-amber-300 dark:border-amber-800/40': row.status === 'CONFLICT',
                     'bg-rose-50/60 dark:bg-rose-950/20 border-rose-300 dark:border-rose-800/40': row.status === 'ERROR'
                 }">
                <div class="flex items-start justify-between gap-2">
                    <div class="flex items-center gap-2">
                        <span class="font-mono text-[10px] text-slate-400">#<span x-text="row.line_number"></span></span>
                        <span class="font-black px-2 py-0.5 rounded text-[10px]"
                              :class="{
                                  'bg-emerald-600 text-white': row.status === 'READY',
                                  'bg-amber-500 text-white': row.status === 'CONFLICT',
                                  'bg-rose-600 text-white': row.status === 'ERROR'
                              }"
                              x-text="row.status === 'READY' ? 'PRONTO' : (row.status === 'CONFLICT' ? 'CONFLITO' : 'ERRO')"></span>

                        <span class="font-black text-slate-900 dark:text-white" x-text="row.target_item_name || 'Item não detectado'"></span>
                        <span x-show="row.target_set_number" class="text-pink-600 dark:text-pink-400 font-bold bg-pink-50 dark:bg-pink-950/40 px-2 py-0.5 rounded text-[10px]">
                            Set #<span x-text="row.target_set_number"></span>
                        </span>
                    </div>

                    <span class="font-bold text-[10px] uppercase px-2 py-0.5 rounded flex items-center gap-1"
                          :class="row.is_paid ? 'bg-emerald-100 dark:bg-emerald-950/50 text-emerald-800 dark:text-emerald-300' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300'">
                        <i :data-lucide="row.is_paid ? 'check' : 'clock'" class="w-3 h-3"></i>
                        <span x-text="row.is_paid ? 'Pago' : 'Pendente'"></span>
                    </span>
                </div>

                <div class="flex items-center justify-between text-slate-600 dark:text-slate-300 pt-1 border-t border-slate-100/80 dark:border-white/5">
                    <div>
                        <span class="font-bold text-slate-800 dark:text-white" x-text="row.participant_name || 'Sem nome'"></span>
                        <span class="text-slate-400" x-show="row.participant_handle" x-text="' (' + row.participant_handle + ')'"></span>
                        <span class="text-slate-400" x-show="row.participant_phone" x-text="' • ' + row.participant_phone"></span>
                        <span x-show="row.participant_is_new" class="text-[10px] bg-indigo-50 dark:bg-indigo-950/50 text-indigo-600 dark:text-indigo-400 px-1.5 py-0.5 rounded font-bold ml-1">
                            Novo Cadastro
                        </span>
                    </div>

                    <div class="text-[11px] text-right font-medium"
                         :class="row.status === 'ERROR' ? 'text-rose-600 font-bold' : (row.status === 'CONFLICT' ? 'text-amber-700 dark:text-amber-400' : 'text-emerald-700 dark:text-emerald-400')"
                         x-text="row.message"></div>
                </div>
            </div>
        </template>
    </div>

    <!-- Estado Vazio -->
    <div x-show="!parseResult.rows || parseResult.rows.length === 0"
         class="py-16 text-center border-2 border-dashed border-slate-200 dark:border-white/10 rounded-2xl">
        <i data-lucide="clipboard-list" class="w-10 h-10 text-slate-300 dark:text-slate-600 mx-auto mb-2"></i>
        <div class="text-sm font-bold text-slate-700 dark:text-slate-300">Nenhuma linha analisada ainda</div>
        <div class="text-xs text-slate-400 mt-1 max-w-sm mx-auto">
            Cole suas linhas de vendas no campo ao lado e clique em "Analisar Linhas & Pré-visualizar".
        </div>
    </div>

    <!-- Botão de Gravação Definitiva -->
    <div class="pt-4 border-t border-slate-100 dark:border-white/10" x-show="parseResult.rows && parseResult.rows.length > 0">
        <button type="button"
                @click="executeBulkAllocation()"
                :disabled="executing || (parseResult.summary && parseResult.summary.ready === 0)"
                class="w-full py-3.5 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 disabled:opacity-50 text-white rounded-xl text-sm font-black transition flex items-center justify-center gap-2 shadow-md cursor-pointer">
            <span x-show="executing" class="animate-spin">
                <i data-lucide="loader-2" class="w-4 h-4"></i>
            </span>
            <span x-show="!executing">
                <i data-lucide="check-circle-2" class="w-4 h-4"></i>
            </span>
            <span>Confirmar e Alocar (<span x-text="parseResult.summary ? parseResult.summary.ready : 0"></span> Slots Prontos)</span>
        </button>
    </div>
</div>
