<!-- Cabeçalho Principal de Envios Nacionais -->
<div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-6 sm:p-8 shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
    <div class="space-y-1">
        <div class="flex items-center gap-2">
            <span class="text-xs font-bold text-pink-600 dark:text-pink-400 uppercase tracking-wide">Logística & Despacho Nacional</span>
            <span class="px-2 py-0.5 bg-pink-100 dark:bg-pink-950/60 text-pink-700 dark:text-pink-300 font-black text-[10px] rounded-full uppercase tracking-wider border border-pink-200 dark:border-pink-800">Staff / Admin</span>
        </div>
        <h1 class="text-2xl sm:text-3xl font-black text-slate-900 dark:text-white tracking-tight flex items-center gap-2.5">
            <i data-lucide="truck" class="w-7 h-7 text-pink-600 dark:text-pink-400"></i>
            <span>Envios Nacionais & Gestão de Pacotes</span>
        </h1>
        <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400">
            Acompanhe todos os pacotes físicos montados, despachos com código de rastreamento, entregas confirmadas e avaliações dos clientes.
        </p>
    </div>

    <div class="flex flex-wrap items-center gap-3">
        <a href="{% url 'consulta_joiner' %}" class="px-4 py-2 bg-pink-50 dark:bg-pink-950/50 text-pink-700 dark:text-pink-300 border border-pink-200 dark:border-pink-800 hover:bg-pink-100 rounded-xl text-xs font-bold transition flex items-center gap-1.5 shadow-2xs">
            <i data-lucide="search" class="w-3.5 h-3.5"></i>
            <span>Consulta Joiner 360º</span>
        </a>
        <a href="{% url 'caixas_dashboard' %}" class="px-4 py-2 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 rounded-xl text-xs font-bold transition flex items-center gap-1.5 shadow-2xs">
            <i data-lucide="plane" class="w-3.5 h-3.5"></i>
            <span>Caixas & Remessas (KR/JP)</span>
        </a>
    </div>
</div>
