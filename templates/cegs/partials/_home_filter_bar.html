{% comment %}Busca e filtros da home (DESIGN_SYSTEM §7.7): a busca fica sempre à mostra; os demais filtros abrem em "Filtros".{% endcomment %}
<div class="space-y-3" x-data="{ moreFilters: false }">
    <div class="flex items-center gap-2">
        <div class="flex-1 min-w-0">

        <div class="space-y-1">
            <label for="home-search" class="sr-only">Buscar CEG</label>
            <div class="relative">
                <input type="search" id="home-search"
                       x-model="searchQuery"
                       @input="resetTracksScroll()"
                       placeholder="Buscar grupo, era, integrante ou item"
                       class="ui-input w-full pl-11 pr-10">
                <i data-lucide="search" class="w-4 h-4 ui-muted absolute left-4 top-1/2 -translate-y-1/2 pointer-events-none" stroke-width="1.75"></i>
                <button type="button"
                        x-show="searchQuery"
                        x-cloak
                        @click="searchQuery = ''; resetTracksScroll()"
                        class="ui-icon-btn !w-9 !h-9 absolute right-1 top-1/2 -translate-y-1/2" aria-label="Limpar busca">
                    <i data-lucide="x" class="w-3.5 h-3.5" stroke-width="1.75"></i>
                </button>
            </div>
        </div>
        </div>
        <button type="button" class="ui-btn ui-btn-ghost shrink-0" @click="moreFilters = !moreFilters" :aria-expanded="(moreFilters || hasActiveFilters()).toString()" aria-controls="home-more-filters">
            <i data-lucide="sliders-horizontal" class="w-4 h-4" stroke-width="1.75"></i><span>Filtros</span>
        </button>
    </div>
    <div id="home-more-filters" class="ui-card ui-hud p-4 space-y-3" x-show="moreFilters || hasActiveFilters()" x-cloak x-transition>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3">
        {% if multi_gom %}
        <!-- 1b. Filtro por GOM (só com CEGs de mais de um GOM) -->
        <div class="space-y-1">
            <label class="ui-label flex items-center gap-1.5">
                <span>GOM:</span>
            </label>
            <select x-model="selectedGom" @change="resetTracksScroll()"
                    class="ui-input w-full">
                <option value="">Todos os GOMs</option>
                {% for g in open_goms %}<option value="{{ g.id }}">{{ g.name }} ({{ g.cegs_count }})</option>{% endfor %}
            </select>
        </div>
        {% endif %}

        <!-- 2. Filtro por Grupo -->
        <div class="space-y-1">
            <label class="ui-label flex items-center gap-1.5">
                <span>Filtrar Grupo:</span>
            </label>
            <select x-model="selectedGroup"
                    @change="selectedEra = ''; resetTracksScroll()"
                    class="ui-input w-full">
                <option value="">Todos os Grupos</option>
                {% for group in open_groups %}
                    <option value="{{ group.id }}">{{ group.name }} ({{ group.cegs_count }})</option>
                {% endfor %}
            </select>
        </div>

        <!-- 3. Filtro por Era -->
        <div class="space-y-1">
            <label class="ui-label flex items-center gap-1.5">
                <span>Era:</span>
            </label>
            <select x-model="selectedEra"
                    @change="resetTracksScroll()"
                    class="ui-input w-full">
                <option value="">Todas as Eras</option>
                {% for era in open_eras %}
                    <option value="{{ era.id }}"
                            x-show="!selectedGroup || selectedGroup == '{{ era.group_id }}'">
                        {% if not selectedGroup %}[{{ era.group_name }}] {% endif %}{{ era.name }} ({{ era.cegs_count }})
                    </option>
                {% endfor %}
            </select>
        </div>

        <!-- 4. Filtro por Membro (Bias!) -->
        <div class="space-y-1">
            <label class="ui-label flex items-center gap-1.5">
                <span>Membro (Bias):</span>
            </label>
            <select x-model="selectedMember"
                    @change="resetTracksScroll()"
                    class="ui-input w-full">
                <option value="">Todos os Membros</option>
                {% for m in open_members %}
                    <option value="{{ m|lower }}">{{ m }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- 5. Filtro por Tipo de Item -->
        <div class="space-y-1">
            <label class="ui-label flex items-center gap-1.5">
                <span>Tipo de Item:</span>
            </label>
            <select x-model="selectedTipo"
                    @change="resetTracksScroll()"
                    class="ui-input w-full">
                <option value="">Qualquer tipo</option>
                <option value="mista">CEGs Mistas ({{ count_mistas }})</option>
                {% for t in pool_tipos_item %}
                    {% if t.count_apenas > 0 %}
                        <option value="apenas_{{ t.id }}">Apenas {{ t.nome }} ({{ t.count_apenas }})</option>
                    {% endif %}
                    {% if t.count_contem > 0 %}
                        <option value="contem_{{ t.id }}">Contém {{ t.nome }} ({{ t.count_contem }})</option>
                    {% endif %}
                {% endfor %}
            </select>
        </div>

        <!-- 6. Ordenação -->
        <div class="space-y-1">
            <label class="ui-label flex items-center gap-1.5">
                <span>Ordenar:</span>
            </label>
            <select x-model="sortBy"
                    @change="sortCards()"
                    class="ui-input w-full">
                <option value="recentes">Mais Recentes</option>
                <option value="preco_asc">Menor Preço</option>
                <option value="preco_desc">Maior Preço</option>
                <option value="vagas_desc">Mais Vagas Disponíveis</option>
                <option value="vagas_asc">Quase Esgotando</option>
            </select>
        </div>

    </div>

    <!-- Barra de Feedback Dinâmico quando há Filtros Ativos -->
    <div x-show="hasActiveFilters()"
         x-cloak
         x-transition
         class="pt-3 border-t border-ui-line flex flex-wrap items-center justify-between gap-2 text-sm">
        <div class="flex flex-wrap items-center gap-2 font-semibold">
            <span>Filtros ativos:</span>
            <span class="ui-chip !h-7 !px-2.5 !text-[12px]"
                  x-text="totalVisibleCount() + ' CEG' + (totalVisibleCount() === 1 ? '' : 's') + ' encontrada' + (totalVisibleCount() === 1 ? '' : 's')">
            </span>
            <span x-show="selectedMember" class="px-2.5 py-0.5 rounded-full bg-pink-100/80 dark:bg-pink-950/50 border border-pink-200/80 dark:border-pink-800/40 text-pink-800 dark:text-pink-300 font-bold text-[11px]">
                Membro: <span x-text="selectedMember"></span>
            </span>
            <span x-show="searchQuery" class="px-2.5 py-0.5 rounded-full bg-purple-100/80 dark:bg-purple-950/50 border border-purple-200/80 dark:border-purple-800/40 text-purple-800 dark:text-purple-300 font-bold text-[11px]">
                Busca: "<span x-text="searchQuery"></span>"
            </span>
        </div>
        
        <button type="button"
                @click="clearFilters()"
                class="ui-btn ui-btn-ghost ui-btn-sm">
            <i data-lucide="x" class="w-3.5 h-3.5" stroke-width="1.75"></i>
            <span>Limpar filtros</span>
        </button>
    </div>
</div>
</div>
