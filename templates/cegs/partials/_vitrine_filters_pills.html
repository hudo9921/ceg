{% comment %}Tipos de item em chips e, com Photocard escolhido, as subcategorias (regular, POB, lucky draw…).{% endcomment %}
<div class="flex gap-2 overflow-x-auto pb-1" role="toolbar" aria-label="Tipo de item">
    <button type="button" class="ui-chip flex-none" :class="!selectedTipo && 'is-on'" :aria-pressed="(!selectedTipo).toString()" @click="setTipo('')">Todos</button>
    {% for tipo in tipos_item %}
        <button type="button" class="ui-chip flex-none" :class="selectedTipo === '{{ tipo.id }}' && 'is-on'"
                :aria-pressed="(selectedTipo === '{{ tipo.id }}').toString()" @click="setTipo('{{ tipo.id }}')">{{ tipo.nome }}</button>
    {% endfor %}
    <button type="button" x-show="hasActiveFilters" x-cloak class="ui-btn ui-btn-ghost ui-btn-sm flex-none ml-auto" @click="clearFilters()">Limpar filtros</button>
</div>

<div x-show="isPhotocardActive || selectedSubCategory" x-cloak class="flex gap-2 overflow-x-auto pb-1" role="toolbar" aria-label="Tipo de photocard">
    <button type="button" class="ui-chip flex-none !h-8 !text-[13px]" :class="!selectedSubCategory && 'is-on'" @click="setSubCategory('')">Todos os photocards</button>
    {% for sub in photocard_subcategories %}
        <button type="button" class="ui-chip flex-none !h-8 !text-[13px]" :class="selectedSubCategory === '{{ sub|escapejs }}' && 'is-on'"
                @click="setSubCategory('{{ sub|escapejs }}')">{{ sub }}</button>
    {% endfor %}
</div>
