{% comment %}Topo dos Avisos do GOM (P5f): pendentes e "marcar todas como lidas".{% endcomment %}
<header class="flex flex-wrap items-end justify-between gap-4">
    <div class="space-y-2">
        <p class="ui-label">Avisos</p>
        <h1 class="ui-disp text-4xl">Avisos do GOM</h1>
        <p class="ui-muted text-[15px]">
            <span x-show="unreadCount > 0" class="ui-status ui-danger" x-text="unreadCount + (unreadCount === 1 ? ' não lido' : ' não lidos')"></span>
            <span x-show="unreadCount === 0" class="ui-status ui-ok">Tudo lido</span>
            · reservas, pedidos de envio, pagamentos e enquetes
        </p>
    </div>
    <button type="button" class="ui-btn ui-btn-ghost" @click="markAllAsRead()" :disabled="unreadCount === 0 || isMarkingAll"
            x-text="isMarkingAll ? 'Atualizando…' : 'Marcar todas como lidas'">Marcar todas como lidas</button>
</header>
