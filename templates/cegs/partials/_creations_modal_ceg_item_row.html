<!-- ITEM ROW DO CONSTRUTOR DE CEG (CARD DE PHOTOCARD/ITEM) -->
<div class="p-3.5 bg-white dark:bg-[#1A1724] border border-slate-200/80 dark:border-white/10 rounded-2xl space-y-2.5 shadow-xs transition hover:border-pink-300 dark:hover:border-pink-500/30">
    <div class="flex flex-col sm:flex-row items-start sm:items-center gap-2.5">
        <!-- Miniatura / Photocard e Gatilho de Recorte -->
        <div class="w-9 h-11 rounded-xl bg-pink-50 dark:bg-pink-950/40 border border-pink-200 dark:border-white/10 shrink-0 flex items-center justify-center overflow-hidden relative group/thumb cursor-pointer shadow-2xs"
             @click="openCropStudioForCeg(index)"
             title="Clique para recortar ou alterar a foto deste integrante no estúdio">
            <template x-if="item.image_base64 || item.image_url">
                <img :src="item.image_base64 || item.image_url" class="w-full h-full object-cover">
            </template>
            <template x-if="!item.image_base64 && !item.image_url">
                <span class="text-xs text-pink-700 dark:text-pink-300 font-black" x-text="index + 1"></span>
            </template>
            <div class="absolute inset-0 bg-black/60 opacity-0 group-hover/thumb:opacity-100 transition flex items-center justify-center text-white">
                <i data-lucide="scissors" class="w-3.5 h-3.5"></i>
            </div>
        </div>

        <!-- Nome do Item (Tipo de item ou Subtipo por padrão) -->
        <div class="flex-1 w-full sm:w-auto">
            <input type="text" x-model="item.name" required
                   placeholder="Nome do Item (Ex: LD, Pob, Álbum...)"
                   class="w-full bg-slate-50 dark:bg-cyber-surface border border-slate-200 dark:border-white/10 rounded-xl px-3 py-1.5 text-xs font-bold text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-pink-500">
        </div>

        <!-- Integrante -->
        <div class="w-full sm:w-28">
            <input type="text" x-model="item.member_name"
                   placeholder="Integrante"
                   class="w-full bg-slate-50 dark:bg-cyber-surface border border-slate-200 dark:border-white/10 rounded-xl px-2.5 py-1.5 text-xs text-slate-700 dark:text-slate-300 focus:outline-none focus:ring-2 focus:ring-pink-500">
        </div>

        <!-- Tipo -->
        <div class="w-full sm:w-28">
            <select x-model="item.tipo_item_id"
                    @change="onItemTipoChange(item, index)"
                    class="w-full bg-slate-50 dark:bg-cyber-surface border border-slate-200 dark:border-white/10 rounded-xl px-2 py-1.5 text-xs font-semibold text-slate-700 dark:text-slate-300 focus:outline-none focus:ring-2 focus:ring-pink-500">
                <template x-for="t in tiposItem" :key="t.id">
                    <option :value="t.id" x-text="t.nome" :selected="t.id == item.tipo_item_id"></option>
                </template>
            </select>
        </div>

        <!-- Subcategoria (Exibida se for Photocard) -->
        <div class="w-full sm:w-28" x-show="isPhotocardTipo(item.tipo_item_id)">
            <select x-model="item.sub_category"
                    @change="onItemSubCategoryChange(item, index)"
                    title="Subcategoria do Photocard"
                    class="w-full bg-pink-50 dark:bg-pink-950/30 border border-pink-300 dark:border-white/10 text-pink-950 dark:text-pink-200 font-bold rounded-xl px-2 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-pink-500">
                <option value="Regulares">Regulares</option>
                <option value="Pob">Pob</option>
                <option value="LD">LD</option>
                <option value="VCE">VCE</option>
                <option value="Broadcast">Broadcast</option>
            </select>
        </div>

        <!-- Preço -->
        <div class="w-full sm:w-24 relative">
            <span class="absolute left-2.5 top-1.5 text-xs text-slate-400 font-bold">R$</span>
            <input type="number" step="0.01" x-model="item.default_price" required
                   class="w-full bg-slate-50 dark:bg-cyber-surface border border-slate-200 dark:border-white/10 rounded-xl pl-7 pr-2 py-1.5 text-xs font-black text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-pink-500">
        </div>

        <!-- Botão Excluir -->
        <button type="button" @click="removeItem(index)" title="Remover item"
                class="text-slate-400 hover:text-red-600 dark:hover:text-rose-400 p-1.5 rounded-xl hover:bg-red-50 dark:hover:bg-white/5 cursor-pointer transition">
            <i data-lucide="trash-2" class="w-4 h-4"></i>
        </button>
    </div>

    <!-- Linha de Pré-Reserva para Participante Cadastrado -->
    <div class="pt-2 border-t border-slate-100 dark:border-white/10 flex flex-col sm:flex-row sm:items-center justify-between gap-2 text-xs">
        <div class="flex items-center gap-2 w-full sm:w-auto">
            <span class="text-[11px] font-bold text-slate-600 dark:text-slate-400 flex items-center gap-1">
                <i data-lucide="lock" class="w-3 h-3 text-amber-500"></i>
                <span>Pré-reservar para:</span>
            </span>
            <select x-model="item.participant_id"
                    :class="item.participant_id ? 'border-amber-400 bg-amber-50 dark:bg-amber-950/40 text-amber-900 dark:text-amber-200 font-bold' : 'border-slate-200 dark:border-white/10 bg-slate-50 dark:bg-cyber-surface text-slate-700 dark:text-slate-300'"
                    class="border rounded-xl px-2.5 py-1 text-xs focus:outline-none focus:ring-2 focus:ring-pink-500">
                <option value="">-- Aberto para Claim Geral (Sem Pré-Reserva) --</option>
                <template x-for="p in participants" :key="p.id">
                    <option :value="p.id"
                            x-text="p.name + (p.username ? ' (' + p.username + ')' : '') + ' • ' + p.whatsapp">
                    </option>
                </template>
            </select>
        </div>

        <div x-show="item.participant_id" class="text-[11px] text-amber-700 dark:text-amber-400 font-bold flex items-center gap-1">
            <i data-lucide="check-circle" class="w-3 h-3"></i>
            <span>Slot #1 começará garantido para este participante</span>
        </div>
    </div>
</div>
