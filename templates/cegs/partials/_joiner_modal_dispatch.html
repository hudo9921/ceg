<!-- MODAL 2: MARCAR COMO ENVIADO NACIONALMENTE (DESPACHO) -->
<div x-show="dispatchModalOpen" x-cloak
     class="fixed inset-0 z-50 overflow-y-auto bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="bg-white dark:bg-[#14121B] rounded-3xl border border-slate-200 dark:border-white/10 shadow-2xl max-w-md w-full p-6 space-y-5"
         @click.away="dispatchModalOpen = false">

        <div class="flex items-center justify-between border-b border-slate-100 dark:border-white/10 pb-3">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-xl bg-emerald-100 dark:bg-emerald-950/50 text-emerald-700 dark:text-emerald-300 flex items-center justify-center">
                    <i data-lucide="send" class="w-4 h-4"></i>
                </div>
                <div>
                    <h3 class="text-sm font-black text-slate-900 dark:text-white">Confirmar Envio Nacional</h3>
                    <p class="text-xs text-slate-500 dark:text-slate-400" x-text="'Pacote: ' + dispatchPacoteIdentificador"></p>
                </div>
            </div>
            <button type="button" @click="dispatchModalOpen = false" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 text-xl font-bold">
                ✕
            </button>
        </div>

        <form method="post" :action="'/envios/pacote/' + dispatchPacoteId + '/marcar-enviado/'" class="space-y-4">
            {% csrf_token %}
            <div class="text-xs text-slate-600 dark:text-slate-300 leading-relaxed bg-emerald-50/70 dark:bg-emerald-950/30 p-3 rounded-xl border border-emerald-200 dark:border-emerald-800/40">
                Ao confirmar, o status deste pacote passará para <strong>Enviado Nacionalmente</strong> e uma notificação com o código de rastreamento será disponibilizada no painel do participante.
            </div>

            <div class="space-y-1">
                <label class="text-xs font-bold text-slate-700 dark:text-slate-300">Código de Rastreamento (Correios / Transportadora):</label>
                <input type="text" name="codigo_rastreio" x-model="dispatchCodigoRastreio" required placeholder="Ex: NL123456789BR"
                       class="w-full bg-slate-50 dark:bg-white/5 border border-slate-300 dark:border-white/10 rounded-xl px-3 py-2 text-xs font-mono font-bold uppercase text-slate-900 dark:text-white focus:bg-white dark:focus:bg-slate-900 focus:ring-2 focus:ring-emerald-500">
            </div>

            <div class="space-y-1">
                <label class="text-xs font-bold text-slate-700 dark:text-slate-300">Transportadora:</label>
                <input type="text" name="transportadora" x-model="dispatchTransportadora" placeholder="Correios Mini Envios"
                       class="w-full bg-slate-50 dark:bg-white/5 border border-slate-300 dark:border-white/10 rounded-xl px-3 py-2 text-xs text-slate-800 dark:text-slate-200 focus:bg-white dark:focus:bg-slate-900 focus:ring-2 focus:ring-emerald-500">
            </div>

            <div class="pt-3 border-t border-slate-100 dark:border-white/10 flex items-center justify-end gap-2">
                <button type="button" @click="dispatchModalOpen = false"
                        class="px-4 py-2 border border-slate-200 dark:border-white/10 text-slate-600 dark:text-slate-400 rounded-xl text-xs font-bold hover:bg-slate-50 dark:hover:bg-white/5 transition">
                    Voltar
                </button>
                <button type="submit"
                        class="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-black shadow transition flex items-center gap-1.5">
                    <i data-lucide="send" class="w-3.5 h-3.5"></i>
                    <span>Despachar & Notificar Joiner</span>
                </button>
            </div>
        </form>
    </div>
</div>
