<!-- BARRA FLUTUANTE DE EMPACOTAMENTO QUANDO HÁ ITENS SELECIONADOS -->
<div x-show="selectedUids.length > 0"
     x-transition:enter="transition ease-out duration-200"
     x-transition:enter-start="opacity-0 translate-y-4"
     x-transition:enter-end="opacity-100 translate-y-0"
     class="sticky top-4 z-40 bg-slate-900/95 backdrop-blur-md text-white rounded-2xl p-4 shadow-xl border border-slate-800 flex flex-col sm:flex-row items-center justify-between gap-4">
    <div class="flex items-center gap-3">
        <span class="w-8 h-8 rounded-xl bg-pink-500 text-white flex items-center justify-center font-black text-sm">
            <i data-lucide="package" class="w-4 h-4"></i>
        </span>
        <div>
            <span class="text-sm font-black" x-text="selectedUids.length + ' item(ns) selecionado(s)'"></span>
            <p class="text-xs text-slate-300">Prontos para serem agrupados em um pacote nacional de envio.</p>
        </div>
    </div>

    <div class="flex items-center gap-2 w-full sm:w-auto">
        <button type="button" @click="clearSelection()"
                class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-bold transition">
            Desmarcar
        </button>
        <button type="button" @click="openPackagingModal()"
                class="flex-1 sm:flex-none px-4 py-2 bg-gradient-to-r from-pink-500 to-rose-500 hover:from-pink-600 hover:to-rose-600 text-white font-black text-xs rounded-xl shadow transition flex items-center justify-center gap-2">
            <i data-lucide="package" class="w-3.5 h-3.5"></i>
            <span>Empacotar Selecionados</span>
        </button>
    </div>
</div>
