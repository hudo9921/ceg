{% comment %}
"Seguir <grupo>" no cabeçalho da CEG (apps/participants/seguindo.py): quem segue vê as CEGs do grupo primeiro
(sem notificação). Sem login, leva para o login e volta. `segue_grupo` vem do CEGDetailView.
{% endcomment %}
<span x-data="{ seguindo: {{ segue_grupo|yesno:'true,false' }}, async alternar() {
        const csrf = document.querySelector('[name=csrfmiddlewaretoken]')?.value || '{{ csrf_token }}';
        const res = await fetch('{% url "seguindo_alternar" %}', { method: 'POST', headers: { 'X-CSRFToken': csrf, 'Content-Type': 'application/json' }, body: JSON.stringify({ group_id: {{ ceg.era.group_id }} }) });
        const data = await res.json();
        if (data.requires_auth) { window.location = '/me/login/?next=' + encodeURIComponent(location.pathname); return; }
        if (data.success) this.seguindo = data.seguindo; } }" class="contents">
    <button type="button" class="ui-btn ui-btn-sm" :class="seguindo ? 'ui-btn-primary' : 'ui-btn-ghost'" @click="alternar()" :aria-pressed="seguindo.toString()"
            title="Ver as CEGs de {{ ceg.era.group.name }} primeiro na home e nas lojas">
        <i data-lucide="heart" class="w-4 h-4" stroke-width="1.75"></i>
        <span x-text="seguindo ? 'Seguindo {{ ceg.era.group.name|escapejs }}' : 'Seguir {{ ceg.era.group.name|escapejs }}'">Seguir {{ ceg.era.group.name }}</span>
    </button>
</span>
