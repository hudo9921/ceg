{% comment %}Ficha do item da Vitrine (ui-sheet): foto, preço, status, descrição e "Tenho interesse" no WhatsApp da GOM dona.{% endcomment %}
<div x-show="modalOpen" x-cloak class="ui-scrim flex items-end sm:items-center justify-center p-0 sm:p-4"
     @click.self="modalOpen = false" @keydown.escape.window="modalOpen = false">
    <div class="ui-sheet sm:!rounded-ui-card w-full sm:max-w-md max-h-[92vh] overflow-y-auto space-y-4" role="dialog" aria-modal="true" aria-labelledby="vitrine-item-title">
        <div class="flex items-start justify-between gap-3">
            <div class="min-w-0">
                <p class="ui-label truncate" x-text="[activeItem.group, activeItem.era, activeItem.subCategory].filter(Boolean).join(' · ') || activeItem.tipo"></p>
                <h2 id="vitrine-item-title" class="ui-disp text-2xl" x-text="activeItem.titulo"></h2>
                <p class="ui-muted text-sm" x-show="activeItem.integrante" x-text="activeItem.integrante"></p>
            </div>
            <button type="button" class="ui-icon-btn flex-none" aria-label="Fechar" @click="modalOpen = false">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
            </button>
        </div>

        <div class="ui-pc w-full max-w-[260px] mx-auto">
            <template x-if="activeItem.imageUrl"><img :src="activeItem.imageUrl" :alt="activeItem.titulo"></template>
            <template x-if="!activeItem.imageUrl"><span class="ui-pc-empty font-bold" x-text="activeItem.titulo"></span></template>
        </div>

        <div class="ui-well flex items-center justify-between gap-3 p-3.5">
            <span>
                <span class="block ui-label">Valor</span>
                <span class="block ui-mono text-2xl font-bold">R$ <span x-text="formatPreco(activeItem.preco)"></span></span>
            </span>
            <span class="ui-status" :class="activeItem.status === 'DISPONIVEL' ? 'ui-ok' : 'ui-warn'"
                  x-text="activeItem.status === 'DISPONIVEL' ? 'Pronta entrega' : (activeItem.status === 'RESERVADO' ? 'Reservado' : 'Vendido')"></span>
        </div>

        <p x-show="activeItem.descricao" class="text-[15px] whitespace-pre-line" x-text="activeItem.descricao"></p>

        <template x-if="activeItem.status === 'DISPONIVEL'">
            <div class="space-y-2">
                <a :href="whatsappUrl" target="_blank" rel="noopener noreferrer" class="ui-btn ui-btn-primary w-full">Tenho interesse · falar no WhatsApp</a>
                <p class="ui-muted text-[13px] text-center">A mensagem já vai com o nome do item e o valor<span x-show="activeItem.gom" x-text="', para ' + activeItem.gom"></span>.</p>
            </div>
        </template>
    </div>
</div>
