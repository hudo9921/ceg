<!-- Filtros & Barra de Pesquisa de Remessas -->
<div class="bg-white/90 dark:bg-cyber-surface/90 backdrop-blur-md p-4 rounded-2xl border border-sky-100/80 dark:border-white/10 shadow-sm flex flex-col md:flex-row items-center justify-between gap-4 transition-colors">
    <!-- Abas de Origem -->
    <div class="flex items-center gap-1.5 overflow-x-auto w-full md:w-auto pb-1 md:pb-0 no-scrollbar">
        <a href="?{% if status_filter %}status={{ status_filter }}&{% endif %}{% if search_query %}q={{ search_query }}{% endif %}"
           class="px-3.5 py-1.5 rounded-xl text-xs font-bold transition whitespace-nowrap flex items-center gap-1.5 {% if not origem_filter %}bg-slate-900 dark:bg-white text-white dark:text-slate-950 shadow-xs{% else %}text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800/60{% endif %}">
            <i data-lucide="layers" class="w-3.5 h-3.5"></i>
            <span>Todas as Origens</span>
        </a>
        <a href="?origem=KR{% if status_filter %}&status={{ status_filter }}{% endif %}{% if search_query %}&q={{ search_query }}{% endif %}"
           class="px-3.5 py-1.5 rounded-xl text-xs font-bold transition whitespace-nowrap flex items-center gap-1.5 {% if origem_filter == 'KR' %}bg-sky-600 dark:bg-sky-500 text-white shadow-xs{% else %}text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800/60{% endif %}">
            <span class="w-2 h-2 rounded-full bg-sky-400 inline-block"></span>
            <span>Coreia do Sul (KR)</span>
        </a>
        <a href="?origem=JP{% if status_filter %}&status={{ status_filter }}{% endif %}{% if search_query %}&q={{ search_query }}{% endif %}"
           class="px-3.5 py-1.5 rounded-xl text-xs font-bold transition whitespace-nowrap flex items-center gap-1.5 {% if origem_filter == 'JP' %}bg-rose-600 dark:bg-rose-500 text-white shadow-xs{% else %}text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800/60{% endif %}">
            <span class="w-2 h-2 rounded-full bg-rose-400 inline-block"></span>
            <span>Japão / Mercari (JP)</span>
        </a>
    </div>

    <!-- Filtro de Status e Busca -->
    <form method="get" class="flex items-center gap-2 w-full md:w-auto">
        {% if origem_filter %}
            <input type="hidden" name="origem" value="{{ origem_filter }}">
        {% endif %}
        <div class="relative">
            <select name="status" onchange="this.form.submit()"
                    class="bg-sky-50/50 dark:bg-cyber-obsidian border border-sky-200/60 dark:border-white/10 text-xs font-semibold rounded-xl px-3 py-2 text-slate-700 dark:text-slate-200 focus:ring-2 focus:ring-sky-500 focus:outline-none">
                <option value="">Todos os Status</option>
                {% for val, label in status_choices %}
                    <option value="{{ val }}" {% if status_filter == val %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="relative flex-grow md:w-64">
            <input type="text" name="q" value="{{ search_query }}" placeholder="Buscar caixa, rastreio ou CEG..."
                   class="w-full bg-sky-50/50 dark:bg-cyber-obsidian border border-sky-200/60 dark:border-white/10 text-xs rounded-xl pl-8 pr-3 py-2 text-slate-800 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 focus:ring-2 focus:ring-sky-500 focus:outline-none">
            <span class="absolute left-2.5 top-2.5 text-slate-400 dark:text-slate-500 flex items-center pointer-events-none">
                <i data-lucide="search" class="w-3.5 h-3.5"></i>
            </span>
        </div>

        {% if origem_filter or status_filter or search_query %}
            <a href="{% url 'caixas_dashboard' %}" class="text-xs text-rose-500 hover:text-rose-700 dark:text-rose-400 dark:hover:text-rose-300 px-2 py-1 font-bold flex items-center gap-1 transition" title="Limpar filtros">
                <i data-lucide="x" class="w-3.5 h-3.5"></i>
                <span class="hidden sm:inline">Limpar</span>
            </a>
        {% endif %}
    </form>
</div>
