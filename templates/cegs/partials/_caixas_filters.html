{% comment %}Filtros da lista de caixas: origem (chips), status e busca (GET).{% endcomment %}
<div class="flex flex-col md:flex-row md:items-center gap-3">
    <div class="flex gap-2 overflow-x-auto pb-1" role="toolbar" aria-label="Origem">
        <a href="?{% if status_filter %}status={{ status_filter }}&{% endif %}{% if search_query %}q={{ search_query|urlencode }}{% endif %}" class="ui-chip flex-none{% if not origem_filter %} is-on{% endif %}">Todas</a>
        <a href="?origem=KR{% if status_filter %}&status={{ status_filter }}{% endif %}{% if search_query %}&q={{ search_query|urlencode }}{% endif %}" class="ui-chip flex-none{% if origem_filter == 'KR' %} is-on{% endif %}">Coreia</a>
        <a href="?origem=JP{% if status_filter %}&status={{ status_filter }}{% endif %}{% if search_query %}&q={{ search_query|urlencode }}{% endif %}" class="ui-chip flex-none{% if origem_filter == 'JP' %} is-on{% endif %}">Japão</a>
    </div>
    <form method="get" class="flex flex-1 gap-2 md:justify-end">
        {% if origem_filter %}<input type="hidden" name="origem" value="{{ origem_filter }}">{% endif %}
        <label class="flex-none"><span class="sr-only">Etapa</span>
            <select name="status" onchange="this.form.submit()" class="ui-input cursor-pointer">
                <option value="">Todas as etapas</option>
                {% for val, label in status_choices %}<option value="{{ val }}" {% if status_filter == val %}selected{% endif %}>{{ label }}</option>{% endfor %}
            </select>
        </label>
        <label class="flex-1 md:max-w-xs"><span class="sr-only">Buscar</span>
            <input type="search" name="q" value="{{ search_query }}" class="ui-input w-full" placeholder="Caixa, rastreio ou CEG…">
        </label>
        {% if origem_filter or status_filter or search_query %}<a href="{% url 'caixas_dashboard' %}" class="ui-btn ui-btn-ghost">Limpar</a>{% endif %}
    </form>
</div>
