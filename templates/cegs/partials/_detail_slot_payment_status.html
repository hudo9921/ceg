{% comment %}
Pagamentos da vaga. Equipe: alterna item/frete/taxa pago e abre o histórico de disputa.
Joiner: linha discreta com o que já foi pago numa vaga reservada.
{% endcomment %}
{% if staff_can.pagar %}
<div class="grid grid-cols-3 gap-1" role="group" aria-label="Pagamentos desta vaga">
    <button type="button" @click.stop="toggle('item')" :disabled="loading" class="ui-chip !h-8 !px-2 justify-center text-[12px]"
            :class="{ 'is-on': isItemPaid }" :aria-pressed="isItemPaid.toString()" title="Item: R$ {{ slot.price|floatformat:2 }}">Item</button>
    <button type="button" @click.stop="toggle('inter')" :disabled="loading" class="ui-chip !h-8 !px-2 justify-center text-[12px]"
            :class="{ 'is-on': isInterPaid }" :aria-pressed="isInterPaid.toString()" title="Frete internacional">Inter</button>
    <button type="button" @click.stop="toggle('taxa')" :disabled="loading" class="ui-chip !h-8 !px-2 justify-center text-[12px]"
            :class="{ 'is-on': isTaxaPaid }" :aria-pressed="isTaxaPaid.toString()" title="Taxa aduaneira">Taxa</button>
</div>
<template x-if="claimLogsBySlot[{{ slot.id }}] && claimLogsBySlot[{{ slot.id }}].length > 0">
    <button type="button" class="ui-btn ui-btn-ghost ui-btn-sm w-full" title="Histórico de tentativas e disputa desta vaga"
            @click.stop="openSlotLogsModal({{ slot.id }}, '{{ slot.item_definition.name|escapejs }}', {{ set.set_number }})">
        <span x-text="'Histórico (' + claimLogsBySlot[{{ slot.id }}].length + ')'"></span>
    </button>
</template>
{% elif slot.claimed_by %}
<p class="m-0 px-1 text-[12px] flex flex-wrap gap-x-2">
    <span :class="isItemPaid ? 'ui-ok font-semibold' : 'ui-muted'" x-text="isItemPaid ? 'Item pago' : 'Item pendente'"></span>
    <span :class="isInterPaid ? 'ui-ok font-semibold' : 'ui-muted'" x-text="isInterPaid ? 'Frete pago' : 'Frete pendente'"></span>
    <span :class="isTaxaPaid ? 'ui-ok font-semibold' : 'ui-muted'" x-text="isTaxaPaid ? 'Taxa paga' : 'Taxa pendente'"></span>
</p>
{% endif %}
