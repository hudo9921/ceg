<!-- ==========================================
     SLOT CARD: STATUS DE PAGAMENTO & CONTROLES STAFF
     Toggles Interativos (Staff) & Badges Informativos (Joiner)
     ========================================== -->
{% if user.is_staff %}
<!-- Check Marks Interativos para Organizador (Item, Inter, Taxa) -->
<div class="mt-2 pt-2 border-t border-slate-100 dark:border-white/5 bg-slate-50/80 dark:bg-slate-900/70 -mx-3 -mb-3 sm:-mx-3.5 sm:-mb-3.5 p-2 rounded-b-2xl">
    <div class="grid grid-cols-3 gap-1 text-[9px] font-bold">
        <!-- Toggle Item -->
        <button type="button" @click.stop="toggle('item')" :disabled="loading"
                :class="isItemPaid ? 'bg-emerald-600 text-white border-emerald-600 shadow-xs' : 'bg-white dark:bg-cyber-surface text-slate-500 dark:text-slate-400 border-slate-200 dark:border-white/10 hover:border-emerald-300'"
                class="py-1 px-0.5 border rounded-lg transition flex items-center justify-center gap-0.5 cursor-pointer disabled:opacity-50 active:scale-95"
                title="Item: R$ {{ slot.price|floatformat:2 }}">
            <span x-text="isItemPaid ? '✔' : '○'"></span>
            <span>Item</span>
        </button>

        <!-- Toggle Frete Inter -->
        <button type="button" @click.stop="toggle('inter')" :disabled="loading"
                :class="isInterPaid ? 'bg-sky-600 text-white border-sky-600 shadow-xs' : 'bg-white dark:bg-cyber-surface text-slate-500 dark:text-slate-400 border-slate-200 dark:border-white/10 hover:border-sky-300'"
                class="py-1 px-0.5 border rounded-lg transition flex items-center justify-center gap-0.5 cursor-pointer disabled:opacity-50 active:scale-95"
                title="Frete Internacional">
            <span x-text="isInterPaid ? '✔' : '○'"></span>
            <span>Inter</span>
        </button>

        <!-- Toggle Taxa Aduaneira -->
        <button type="button" @click.stop="toggle('taxa')" :disabled="loading"
                :class="isTaxaPaid ? 'bg-purple-600 text-white border-purple-600 shadow-xs' : 'bg-white dark:bg-cyber-surface text-slate-500 dark:text-slate-400 border-slate-200 dark:border-white/10 hover:border-purple-300'"
                class="py-1 px-0.5 border rounded-lg transition flex items-center justify-center gap-0.5 cursor-pointer disabled:opacity-50 active:scale-95"
                title="Taxa Aduaneira">
            <span x-text="isTaxaPaid ? '✔' : '○'"></span>
            <span>Taxa</span>
        </button>
    </div>
</div>

<!-- Histórico de Claim deste Slot (Auditoria Staff) -->
<template x-if="claimLogsBySlot[{{ slot.id }}] && claimLogsBySlot[{{ slot.id }}].length > 0">
    <div class="mt-2 pt-2 border-t border-slate-100 dark:border-white/5 -mx-3 -mb-3 sm:-mx-3.5 sm:-mb-3.5 px-3 pb-2 sm:px-3.5 bg-slate-50/60 dark:bg-slate-900/60 rounded-b-2xl flex justify-center">
        <button type="button"
                @click.stop="openSlotLogsModal({{ slot.id }}, '{{ slot.item_definition.name|escapejs }}', {{ set.set_number }})"
                class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-lg text-[9px] font-bold text-purple-700 dark:text-pink-300 bg-purple-50 dark:bg-white/[0.04] hover:bg-purple-100 border border-purple-200 dark:border-white/10 transition cursor-pointer shadow-2xs active:scale-95"
                title="Ver histórico de tentativas e disputa de claim">
            <i data-lucide="history" class="w-2.5 h-2.5" stroke-width="1.75"></i>
            <span x-text="'Histórico (' + claimLogsBySlot[{{ slot.id }}].length + ')'"></span>
        </button>
    </div>
</template>

{% elif slot.claimed_by %}
<!-- Badges Informativos de Pagamento para Participantes -->
<div class="mt-1 pt-2 border-t border-slate-100 dark:border-white/5 grid grid-cols-3 gap-0.5 text-[9px] font-semibold text-slate-600 dark:text-slate-400 text-center">
    <div class="py-0.5 px-0.5 rounded-md border"
         :class="isItemPaid ? 'text-emerald-700 dark:text-emerald-300 font-bold bg-emerald-50/80 dark:bg-emerald-950/60 border-emerald-200 dark:border-emerald-800/60' : 'text-slate-400 dark:text-slate-500 bg-slate-50 dark:bg-white/[0.02] border-slate-100 dark:border-white/5'">
        <span x-text="isItemPaid ? '✔ Item' : '○ Item'"></span>
    </div>
    <div class="py-0.5 px-0.5 rounded-md border"
         :class="isInterPaid ? 'text-sky-700 dark:text-sky-300 font-bold bg-sky-50/80 dark:bg-sky-950/60 border-sky-200 dark:border-sky-800/60' : 'text-slate-400 dark:text-slate-500 bg-slate-50 dark:bg-white/[0.02] border-slate-100 dark:border-white/5'">
        <span x-text="isInterPaid ? '✔ Inter' : '○ Inter'"></span>
    </div>
    <div class="py-0.5 px-0.5 rounded-md border"
         :class="isTaxaPaid ? 'text-purple-700 dark:text-purple-300 font-bold bg-purple-50/80 dark:bg-purple-950/60 border-purple-200 dark:border-purple-800/60' : 'text-slate-400 dark:text-slate-500 bg-slate-50 dark:bg-white/[0.02] border-slate-100 dark:border-white/5'">
        <span x-text="isTaxaPaid ? '✔ Taxa' : '○ Taxa'"></span>
    </div>
</div>
{% endif %}
