<!-- Linha 1: Barra de Pesquisa, Ordenação e Botão Limpar Filtros -->
<div class="grid grid-cols-1 md:grid-cols-12 gap-3 items-center">
    <div class="md:col-span-7 relative">
        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <i data-lucide="search" class="w-4 h-4"></i>
        </span>
        <input type="text"
               x-model="searchQuery"
               @input.debounce.150ms="onFilterChange()"
               placeholder="Buscar por nome do item, integrante, grupo ou era..."
               class="w-full pl-10 pr-8 py-2.5 bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 rounded-xl text-xs sm:text-sm text-slate-800 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-pink-500/30 focus:border-pink-500 transition">
        <button type="button"
                x-show="searchQuery"
                x-cloak
                @click="searchQuery = ''; onFilterChange()"
                class="absolute inset-y-0 right-0 pr-3 flex items-center text-xs text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 cursor-pointer">
            <i data-lucide="x" class="w-3.5 h-3.5"></i>
        </button>
    </div>

    <div class="md:col-span-3">
        <select x-model="selectedSort" @change="sortCards()"
                class="w-full py-2.5 px-3 bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 rounded-xl text-xs font-bold text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-pink-500/30 cursor-pointer">
            <option value="destaque">Destaques Primeiro</option>
            <option value="recentes">Mais Recentes</option>
            <option value="menor_preco">Menor Preço</option>
            <option value="maior_preco">Maior Preço</option>
            <option value="nome">Nome (A-Z)</option>
        </select>
    </div>

    <div class="md:col-span-2 flex justify-end">
        <button type="button"
                x-show="hasActiveFilters"
                x-cloak
                @click="clearFilters()"
                class="w-full py-2.5 px-3 rounded-xl bg-rose-50 dark:bg-rose-950/40 hover:bg-rose-100 dark:hover:bg-rose-900/60 text-rose-600 dark:text-rose-400 border border-rose-200 dark:border-rose-900/60 font-black text-xs transition flex items-center justify-center gap-1.5 cursor-pointer shadow-2xs">
            <i data-lucide="x" class="w-3.5 h-3.5"></i>
            <span>Limpar Filtros</span>
        </button>
    </div>
</div>
