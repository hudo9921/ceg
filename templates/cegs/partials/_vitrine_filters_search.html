{% comment %}Busca, ordenação e o botão que abre os filtros detalhados (grupo, era, integrante, status).{% endcomment %}
<div class="flex flex-col sm:flex-row gap-2.5">
    <label class="flex-1 relative">
        <span class="sr-only">Buscar na vitrine</span>
        <input type="search" x-model="searchQuery" @input.debounce.150ms="onFilterChange()" class="ui-input w-full"
               placeholder="Buscar item, integrante, grupo ou era…">
    </label>
    <div class="flex gap-2.5">
        <label class="flex-1 sm:flex-none">
            <span class="sr-only">Ordenar</span>
            <select x-model="selectedSort" @change="sortCards()" class="ui-input w-full sm:w-auto cursor-pointer">
                <option value="destaque">Destaques primeiro</option>
                <option value="recentes">Mais recentes</option>
                <option value="menor_preco">Menor preço</option>
                <option value="maior_preco">Maior preço</option>
                <option value="nome">Nome (A–Z)</option>
            </select>
        </label>
        <button type="button" class="ui-btn ui-btn-ghost flex-none" @click="moreOpen = !moreOpen" :aria-expanded="moreOpen.toString()">
            Filtros<span x-show="selectedGroup || selectedEra || selectedMember || (selectedStatus && selectedStatus !== 'DISPONIVEL')" x-cloak class="w-2 h-2 rounded-full bg-ui-accent" aria-label="filtros ativos"></span>
        </button>
    </div>
</div>
