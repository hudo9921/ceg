<!-- ==========================================
     BARRA FLUTUANTE DE CHECKOUT MULTI-SLOT
     Barra Suspensa com Carrinho Reativo (< 200 linhas)
     ========================================== -->
<div x-data="{}" x-show="!isStandby && $store.claimSelection.slots.length > 0" x-cloak
    x-transition:enter="transition ease-out duration-300"
    x-transition:enter-start="translate-y-full opacity-0" x-transition:enter-end="translate-y-0 opacity-100"
    x-transition:leave="transition ease-in duration-200" x-transition:leave-start="translate-y-0 opacity-100"
    x-transition:leave-end="translate-y-full opacity-0"
    class="fixed bottom-0 left-0 right-0 z-50 bg-slate-900/95 dark:bg-cyber-surface/95 backdrop-blur-xl border-t border-pink-500/40 dark:border-pink-500/30 shadow-2xl px-4 py-3 sm:px-6">
    <div class="max-w-5xl mx-auto flex items-center gap-3 flex-wrap sm:flex-nowrap">
        <!-- Itens selecionados (resumo em chips) -->
        <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2 flex-wrap">
                <span class="text-xs font-black text-pink-300 dark:text-pink-300 shrink-0 font-mono"
                    x-text="$store.claimSelection.slots.reduce((acc, s) => acc + (s.isAvulso ? s.quantity : 1), 0) + ' item(ns) selecionado(s)'"></span>
                <div class="flex items-center gap-1.5 flex-wrap max-h-16 overflow-y-auto no-scrollbar">
                    <template x-for="s in $store.claimSelection.slots" :key="s.id">
                        <span
                            class="text-[10px] font-bold text-white bg-pink-600/80 dark:bg-white/[0.08] px-2 py-0.5 rounded-lg border border-pink-500/50 dark:border-white/10 flex items-center gap-1 shadow-2xs">
                            <span x-text="s.isAvulso ? ('Avulso · ' + s.name + ' (' + s.quantity + 'x)') : ('Set #' + s.setNumber + ' · ' + (s.member ? s.member : s.name))"></span>
                            <button type="button" @click.stop="s.isAvulso ? $store.claimSelection.setAvulso({ id: s.itemDefId }, 0) : $store.claimSelection.toggle(s)"
                                class="text-pink-200 hover:text-white ml-0.5 cursor-pointer flex items-center transition"
                                title="Remover da seleção">
                                <i data-lucide="x" class="w-3 h-3" stroke-width="1.75"></i>
                            </button>
                        </span>
                    </template>
                </div>
            </div>
        </div>

        <!-- Botões de Ação -->
        <div class="flex items-center gap-2 shrink-0">
            <button type="button" @click="$store.claimSelection.clear()"
                class="px-3 py-2 text-xs font-bold text-slate-400 hover:text-white transition cursor-pointer">
                Limpar
            </button>
            <button type="button" @click="$store.claimSelection.openModal(); $dispatch('sync-claim-selection')"
                :disabled="$store.claimSelection.slots.length === 0"
                class="px-5 py-2.5 bg-gradient-to-r from-pink-600 to-rose-600 hover:from-pink-500 hover:to-rose-500 text-white text-sm font-black rounded-xl transition shadow-lg shadow-pink-600/25 flex items-center gap-2 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed active:scale-95">
                <i data-lucide="shopping-bag" class="w-4 h-4" stroke-width="1.75"></i>
                <span
                    x-text="'Finalizar Compra (' + $store.claimSelection.slots.reduce((acc, s) => acc + (s.isAvulso ? s.quantity : 1), 0) + ')'"></span>
            </button>
        </div>
    </div>
</div>
