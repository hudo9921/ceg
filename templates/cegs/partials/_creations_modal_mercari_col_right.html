<!-- COLUNA DIREITA: CAIXA MERCARI, STATUS E FOTO/PROOF (lg:col-span-5) -->
<div class="lg:col-span-5 space-y-4">
    <!-- Conexão com Caixa Mercari -->
    <div class="p-4 bg-slate-50/80 dark:bg-cyber-elevated/40 border border-slate-200 dark:border-white/10 rounded-2xl space-y-3">
        <div>
            <label class="text-xs font-black text-slate-900 dark:text-white flex items-center gap-1.5">
                <i data-lucide="package" class="w-3.5 h-3.5 text-rose-500"></i>
                <span>Caixa Mercari (Remessa)</span>
            </label>
            <p class="text-[10px] text-slate-500 dark:text-cyber-silver">
                Vincule este pedido a uma caixa Mercari já existente para consolidação e envio.
            </p>
        </div>

        <select name="caixa_id" x-model="selectedCaixaId"
                class="w-full bg-white dark:bg-cyber-surface border border-slate-300 dark:border-white/10 rounded-xl px-3 py-2.5 text-xs font-bold text-slate-900 dark:text-white focus:ring-2 focus:ring-rose-500 shadow-2xs transition">
            <option value="">-- Sem Caixa (Item Avulso / Definir depois) --</option>
            {% if caixas_mercari %}
                <optgroup label="🇯🇵 Caixas Mercari Existentes (Japão)">
                    {% for cx in caixas_mercari %}
                        <option value="{{ cx.id }}">
                            [JP] {{ cx.nome }} ({{ cx.get_status_display }})
                        </option>
                    {% endfor %}
                </optgroup>
            {% endif %}
            <optgroup label="📦 Outras Caixas / Remessas">
                {% for cx in caixas %}
                    {% if cx.origem != 'JP' %}
                        <option value="{{ cx.id }}">
                            [{{ cx.origem }}] {{ cx.nome }} ({{ cx.get_status_display }})
                        </option>
                    {% endif %}
                {% endfor %}
            </optgroup>
        </select>

        <!-- Card Dinâmico de Remessa Mercari Conectada -->
        <template x-if="selectedCaixaInfo">
            <div class="p-3 bg-gradient-to-r from-rose-50 to-amber-50 dark:from-rose-950/30 dark:to-amber-950/30 border-2 border-rose-200 dark:border-rose-500/30 rounded-xl space-y-1">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-1.5 text-xs font-black text-rose-950 dark:text-rose-200">
                        <i data-lucide="plane" class="w-3.5 h-3.5 text-rose-500"></i>
                        <span x-text="selectedCaixaInfo.nome"></span>
                    </div>
                    <span class="text-[10px] font-black uppercase px-2 py-0.5 rounded-full bg-rose-200 dark:bg-rose-900/60 text-rose-900 dark:text-rose-200"
                          x-text="selectedCaixaInfo.status_display"></span>
                </div>
                <p class="text-[10px] text-slate-600 dark:text-slate-400 leading-snug">
                    Remessa consolidada. O item avançará automaticamente pelo fluxo internacional junto com esta caixa.
                </p>
            </div>
        </template>

        <template x-if="!selectedCaixaInfo">
            <div class="p-2.5 bg-amber-50/70 dark:bg-amber-950/20 border border-amber-200/80 dark:border-amber-500/30 rounded-xl text-[11px] text-amber-900 dark:text-amber-200 flex items-center gap-2">
                <i data-lucide="info" class="w-3.5 h-3.5 text-amber-500 flex-shrink-0"></i>
                <span>Item avulso (sem caixa). Você poderá atrelá-lo a uma Caixa Mercari posteriormente.</span>
            </div>
        </template>
    </div>

    <!-- Status Inicial do Item -->
    <div>
        <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">Status Inicial do Item *</label>
        <select name="status"
                class="w-full bg-slate-50 dark:bg-cyber-elevated border border-slate-200 dark:border-white/10 rounded-xl px-3 py-2 text-xs font-bold text-slate-900 dark:text-white focus:ring-2 focus:ring-rose-500 focus:bg-white dark:focus:bg-cyber-surface transition">
            {% for val, label in item_individual_statuses %}
                <option value="{{ val }}" {% if val == 'COMPRADO' %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
        </select>
    </div>

    <!-- Foto / Comprovante de Compra (Proof) -->
    <div class="p-4 bg-rose-50/50 dark:bg-rose-950/20 border border-rose-200/80 dark:border-rose-500/30 rounded-2xl space-y-3">
        <div class="flex items-center justify-between">
            <label class="text-xs font-black text-rose-900 dark:text-rose-300 flex items-center gap-1.5">
                <i data-lucide="camera" class="w-3.5 h-3.5 text-rose-500"></i>
                <span>Foto / Proof de Compra</span>
            </label>
            <span class="text-[10px] font-bold text-rose-600 dark:text-rose-400">
                Ctrl+V ativo • Arquivo • Link
            </span>
        </div>

        <!-- Área de Dropzone / Paste -->
        <div class="border-2 border-dashed border-rose-300 dark:border-white/10 rounded-2xl p-3 text-center bg-white dark:bg-cyber-surface hover:bg-rose-50/30 dark:hover:bg-white/5 transition relative">
            <div x-show="itemImagePreview" class="space-y-2">
                <img :src="itemImagePreview" class="max-h-40 mx-auto rounded-xl object-contain shadow-md border border-slate-200 dark:border-white/10">
                <div class="flex items-center justify-center gap-2 pt-1">
                    <span class="text-[10px] font-black text-emerald-700 dark:text-emerald-300 bg-emerald-50 dark:bg-emerald-950/50 border border-emerald-200 dark:border-white/10 px-2 py-0.5 rounded-full flex items-center gap-1">
                        <i data-lucide="check" class="w-3 h-3"></i>
                        <span>Foto Capturada!</span>
                    </span>
                    <button type="button" @click="clearImage()"
                            class="text-xs text-rose-600 dark:text-rose-400 font-bold hover:underline px-2 py-0.5 cursor-pointer">
                        Remover
                    </button>
                </div>
            </div>

            <div x-show="!itemImagePreview" class="space-y-1.5 py-2">
                <i data-lucide="image" class="w-6 h-6 mx-auto text-rose-400"></i>
                <p class="text-xs font-bold text-slate-800 dark:text-slate-200">
                    Dê <kbd class="px-1.5 py-0.5 bg-slate-100 dark:bg-white/10 border border-slate-300 dark:border-white/10 rounded text-rose-700 dark:text-rose-300 font-black">Ctrl + V</kbd> nesta tela
                </p>
                <p class="text-[10px] text-slate-500 dark:text-slate-400">
                    Ou selecione do computador:
                </p>
                <input type="file" name="foto_arquivo" accept="image/*" @change="handleFileChange($event)"
                       class="text-[11px] text-slate-500 dark:text-slate-400 file:mr-2 file:py-1 file:px-2.5 file:rounded-lg file:border-0 file:text-[11px] file:font-bold file:bg-rose-100 dark:file:bg-rose-950/60 file:text-rose-800 dark:file:text-rose-300 hover:file:bg-rose-200 cursor-pointer">
            </div>
        </div>

        <div>
            <label class="block text-[10px] font-bold text-slate-600 dark:text-slate-400 mb-1">Ou cole o link direto da imagem:</label>
            <input type="text" name="foto_url" x-model="itemImageUrl" @input="handleUrlChange()"
                   placeholder="https://exemplo.com/foto-proof.jpg"
                   class="w-full bg-white dark:bg-cyber-surface border border-slate-200 dark:border-white/10 rounded-xl px-3 py-1.5 text-xs text-slate-900 dark:text-white focus:ring-2 focus:ring-rose-500 transition">
        </div>
    </div>
</div>
