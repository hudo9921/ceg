<!-- Grade Tipo Planilha -->
<div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-white/10 shadow-sm overflow-hidden">
    <div class="overflow-x-auto max-h-[70vh]">
        <table class="w-full text-left border-collapse">
            <!-- Cabeçalho com os Sets -->
            <thead class="bg-slate-900 dark:bg-slate-950 text-white text-xs font-black sticky top-0 z-20 shadow-xs">
                <tr>
                    <th class="py-3 px-4 w-72 min-w-[280px] sticky left-0 z-30 bg-slate-900 dark:bg-slate-950 border-r border-slate-800 dark:border-white/10">
                        Item / Integrante
                    </th>
                    <template x-for="s in matrix.sets" :key="s.id">
                        <th class="py-3 px-4 min-w-[240px] text-center border-r border-slate-800 dark:border-white/10">
                            <div class="flex items-center justify-center gap-2">
                                <span class="text-pink-400 text-sm font-black">Set #<span x-text="s.set_number"></span></span>
                                <span class="text-[10px] px-2 py-0.5 rounded-full"
                                      :class="s.is_active ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-400/30' : 'bg-slate-700 text-slate-300'">
                                    <span x-text="s.is_active ? 'Ativo' : 'Inativo'"></span>
                                </span>
                            </div>
                        </th>
                    </template>
                </tr>
            </thead>
            <tbody class="divide-y divide-slate-100 dark:divide-white/5 text-xs">
                <template x-for="item in filteredMatrixItems" :key="item.id">
                    <tr class="hover:bg-slate-50/80 dark:hover:bg-slate-800/40 transition">
                        <!-- Coluna Fixa do Item -->
                        <td class="py-3 px-4 sticky left-0 z-10 bg-white dark:bg-slate-900 group-hover:bg-slate-50 border-r border-slate-200 dark:border-white/10 shadow-2xs">
                            <div class="font-bold text-slate-900 dark:text-white text-sm" x-text="item.name"></div>
                            <div class="flex items-center gap-2 mt-1">
                                <span x-show="item.member_name"
                                      class="text-[10px] font-black uppercase text-pink-700 dark:text-pink-300 bg-pink-50 dark:bg-pink-950/40 px-2 py-0.5 rounded"
                                      x-text="item.member_name"></span>
                                <span class="text-[11px] text-slate-400 font-mono">R$ <span x-text="item.default_price"></span></span>
                            </div>
                        </td>

                        <!-- Células dos Sets -->
                        <template x-for="s in matrix.sets" :key="s.id">
                            <td class="py-2.5 px-3 border-r border-slate-100 dark:border-white/5 align-top">
                                <template x-if="item.slots && item.slots[s.id]">
                                    <div class="p-2.5 rounded-xl border transition space-y-2 relative"
                                         :class="{
                                             'bg-emerald-50/70 dark:bg-emerald-950/30 border-emerald-300 dark:border-emerald-800/50': item.slots[s.id].claimed_by && item.slots[s.id].is_item_paid,
                                             'bg-amber-50/70 dark:bg-amber-950/30 border-amber-300 dark:border-amber-800/50': item.slots[s.id].claimed_by && !item.slots[s.id].is_item_paid,
                                             'bg-slate-50 dark:bg-slate-800/50 border-slate-200 dark:border-white/10 hover:border-slate-300': !item.slots[s.id].claimed_by
                                         }">

                                        <!-- Slot Ocupado -->
                                        <div x-show="item.slots[s.id].claimed_by" class="space-y-1.5">
                                            <div class="flex items-start justify-between gap-1">
                                                <div class="font-bold text-slate-900 dark:text-white text-xs leading-tight truncate"
                                                     :title="item.slots[s.id].claimed_by ? item.slots[s.id].claimed_by.name : ''"
                                                     x-text="item.slots[s.id].claimed_by ? item.slots[s.id].claimed_by.name : ''">
                                                </div>
                                                <button type="button"
                                                        @click="releaseSlot(item.slots[s.id].slot_id)"
                                                        class="text-slate-400 hover:text-rose-600 p-0.5 rounded cursor-pointer"
                                                        title="Liberar slot / remover participante">
                                                    <i data-lucide="x" class="w-3.5 h-3.5"></i>
                                                </button>
                                            </div>

                                            <div class="flex items-center gap-1 text-[11px] text-slate-500 dark:text-slate-400 truncate">
                                                <span x-text="item.slots[s.id].claimed_by ? (item.slots[s.id].claimed_by.social_handle || item.slots[s.id].claimed_by.formatted_phone) : ''"></span>
                                            </div>

                                            <!-- Botão de Alternar Pagamento -->
                                            <div class="pt-1 flex items-center justify-between">
                                                <button type="button"
                                                        @click="toggleSlotPayment(item.slots[s.id].slot_id)"
                                                        class="px-2 py-0.5 rounded-md text-[10px] font-black uppercase tracking-wider transition flex items-center gap-1 cursor-pointer"
                                                        :class="item.slots[s.id].is_item_paid ? 'bg-emerald-600 text-white hover:bg-emerald-700' : 'bg-amber-500 text-white hover:bg-amber-600'">
                                                    <i :data-lucide="item.slots[s.id].is_item_paid ? 'check' : 'clock'" class="w-3 h-3"></i>
                                                    <span x-text="item.slots[s.id].is_item_paid ? 'Pago' : 'Pendente'"></span>
                                                </button>
                                                <span class="text-[10px] font-mono text-slate-400">R$ <span x-text="item.slots[s.id].price"></span></span>
                                            </div>
                                        </div>

                                        <!-- Slot Disponível -->
                                        <div x-show="!item.slots[s.id].claimed_by" class="py-1">
                                            <div x-show="activeSlotPicker !== item.slots[s.id].slot_id">
                                                <button type="button"
                                                        @click="openSlotPicker(item.slots[s.id].slot_id)"
                                                        class="w-full py-2 px-3 rounded-lg border border-dashed border-slate-300 dark:border-white/20 hover:border-indigo-500 hover:bg-indigo-50/50 dark:hover:bg-indigo-950/30 text-slate-500 dark:text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400 text-[11px] font-bold transition text-center flex items-center justify-center gap-1.5 cursor-pointer">
                                                    <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                                                    <span>Alocar Joiner</span>
                                                </button>
                                            </div>

                                            <!-- Autocomplete Inline quando clicado -->
                                            <div x-show="activeSlotPicker === item.slots[s.id].slot_id"
                                                 @click.away="closeSlotPicker()"
                                                 class="space-y-1.5">
                                                <input type="text"
                                                       x-ref="pickerInput"
                                                       x-model="pickerQuery"
                                                       placeholder="Nome, @ ou telefone..."
                                                       class="w-full px-2.5 py-1.5 text-xs bg-white dark:bg-slate-800 text-slate-900 dark:text-white border border-indigo-500 rounded-lg focus:outline-none ring-2 ring-indigo-100 dark:ring-indigo-900 font-semibold">

                                                <div class="max-h-36 overflow-y-auto bg-white dark:bg-slate-800 border border-slate-200 dark:border-white/10 rounded-lg shadow-lg divide-y divide-slate-100 dark:divide-white/5">
                                                    <template x-for="p in pickerFilteredParticipants" :key="p.id">
                                                        <button type="button"
                                                                @click="assignParticipantToSlot(item.slots[s.id].slot_id, p)"
                                                                class="w-full px-2.5 py-1.5 text-left hover:bg-indigo-50 dark:hover:bg-indigo-950/50 text-xs transition flex items-center justify-between cursor-pointer">
                                                            <div class="truncate pr-2">
                                                                <div class="font-bold text-slate-800 dark:text-white" x-text="p.name"></div>
                                                                <div class="text-[10px] text-slate-400" x-text="p.social_handle || p.formatted_phone"></div>
                                                            </div>
                                                            <i data-lucide="arrow-right" class="w-3.5 h-3.5 text-indigo-600 dark:text-indigo-400"></i>
                                                        </button>
                                                    </template>
                                                    <div x-show="pickerFilteredParticipants.length === 0" class="p-2 text-center text-[11px] text-slate-400">
                                                        Nenhum joiner encontrado.
                                                    </div>
                                                </div>

                                                <div class="flex items-center justify-between text-[10px]">
                                                    <label class="flex items-center gap-1 text-slate-600 dark:text-slate-300 cursor-pointer">
                                                        <input type="checkbox" x-model="pickerIsPaid" class="rounded text-indigo-600">
                                                        <span>Já está Pago</span>
                                                    </label>
                                                    <button type="button" @click="closeSlotPicker()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 font-bold cursor-pointer">Cancelar</button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </template>
                                <template x-if="!item.slots || !item.slots[s.id]">
                                    <div class="text-center py-4 text-slate-300 dark:text-slate-600 text-xs">
                                        —
                                    </div>
                                </template>
                            </td>
                        </template>
                    </tr>
                </template>
            </tbody>
        </table>
    </div>
</div>
