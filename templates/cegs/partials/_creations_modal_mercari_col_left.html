<!-- COLUNA ESQUERDA: DADOS DO PEDIDO, COMPRADOR E OBSERVAÇÕES (lg:col-span-7) -->
<div class="lg:col-span-7 space-y-4">
    <!-- Nome / Descrição do Item -->
    <div>
        <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">Nome / Descrição do Item *</label>
        <input type="text" name="nome" required
               placeholder="Ex: Photocard Chaewon Easy Weverse POB, Álbum Selado..."
               class="w-full bg-slate-50 dark:bg-cyber-elevated border border-slate-200 dark:border-white/10 rounded-xl px-3.5 py-2.5 text-xs font-bold text-slate-900 dark:text-white focus:ring-2 focus:ring-rose-500 focus:bg-white dark:focus:bg-cyber-surface transition">
    </div>

    <!-- Tipo de Item (Dinâmico) -->
    <div class="p-3 bg-violet-50/60 dark:bg-purple-950/20 border border-violet-200/80 dark:border-purple-500/30 rounded-2xl space-y-2">
        <div class="flex items-center justify-between">
            <label class="text-xs font-bold text-violet-950 dark:text-purple-300 flex items-center gap-1.5">
                <i data-lucide="tag" class="w-3.5 h-3.5 text-violet-600 dark:text-purple-400"></i>
                <span>Tipo de Item *</span>
            </label>
            <button type="button" @click="showNewTipoModal = true"
                    class="text-[11px] font-bold text-violet-700 dark:text-purple-300 hover:text-violet-900 dark:hover:text-purple-200 bg-white/80 dark:bg-white/10 px-2 py-0.5 rounded-lg border border-violet-200/80 dark:border-white/10 transition cursor-pointer flex items-center gap-1">
                <i data-lucide="plus" class="w-3 h-3"></i>
                <span>Novo Tipo</span>
            </button>
        </div>

        <select name="tipo_item_id" required x-model="itemTipoId"
                class="w-full bg-white dark:bg-cyber-surface border border-violet-200 dark:border-white/10 rounded-xl px-3 py-2 text-xs font-bold text-slate-800 dark:text-white focus:ring-2 focus:ring-violet-500">
            <option value="">-- Selecione o Tipo do Produto --</option>
            <template x-for="t in tiposItem" :key="t.id">
                <option :value="t.id" x-text="t.nome"></option>
            </template>
        </select>
    </div>

    <!-- Link do Pedido, Quantidade e Preço do Produto -->
    <div class="grid grid-cols-1 sm:grid-cols-12 gap-3">
        <div class="sm:col-span-6">
            <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">Link do Pedido (Mercari/Buyee)</label>
            <input type="url" name="link_pedido"
                   placeholder="https://jp.mercari.com/item/m..."
                   class="w-full bg-slate-50 dark:bg-cyber-elevated border border-slate-200 dark:border-white/10 rounded-xl px-3 py-2 text-xs text-slate-800 dark:text-white focus:ring-2 focus:ring-rose-500 focus:bg-white dark:focus:bg-cyber-surface transition">
        </div>

        <div class="sm:col-span-3">
            <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">Quantidade *</label>
            <input type="number" name="quantidade" value="1" min="1" required
                   class="w-full bg-slate-50 dark:bg-cyber-elevated border border-slate-200 dark:border-white/10 rounded-xl px-3 py-2 text-xs font-bold text-slate-800 dark:text-white focus:ring-2 focus:ring-rose-500 text-center">
        </div>

        <div class="sm:col-span-3">
            <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">Preço (R$)</label>
            <input type="number" step="0.01" min="0" name="preco_produto" placeholder="Ex: 85.00"
                   class="w-full bg-slate-50 dark:bg-cyber-elevated border border-slate-200 dark:border-white/10 rounded-xl px-3 py-2 text-xs font-black text-rose-600 dark:text-rose-400 focus:ring-2 focus:ring-rose-500">
        </div>
    </div>

    <!-- Comprador do Item (Seleção Estilo Claim + Sugestões Interativas) -->
    <div class="p-4 bg-gradient-to-br from-rose-50/40 to-purple-50/40 dark:bg-cyber-elevated/40 border border-rose-200/80 dark:border-white/10 rounded-2xl space-y-3">
        <div class="flex items-center justify-between">
            <label class="text-xs font-black text-slate-900 dark:text-white flex items-center gap-1.5">
                <i data-lucide="user-check" class="w-3.5 h-3.5 text-rose-500"></i>
                <span>Comprador do Item (Atribuição)</span>
            </label>
            <span class="text-[10px] font-bold text-slate-400">
                Pode ser cliente já cadastrado ou novo
            </span>
        </div>

        <!-- Seletor Rápido de Participantes Existentes -->
        <div>
            <label class="block text-[11px] font-bold text-slate-700 dark:text-slate-300 mb-1">
                Escolher Cliente Já Cadastrado:
            </label>
            <select x-model="selectedBuyerId" @change="onSelectBuyer($event.target.value)"
                    class="w-full bg-white dark:bg-cyber-surface border border-slate-300 dark:border-white/10 rounded-xl px-3 py-2 text-xs font-bold text-slate-900 dark:text-white focus:ring-2 focus:ring-rose-500 shadow-2xs">
                <option value="">-- Digitar dados manualmente ou escolher abaixo --</option>
                <template x-for="p in participants" :key="p.id">
                    <option :value="p.id"
                            x-text="p.name + (p.username ? ' (' + p.username + ')' : '') + ' • ' + p.whatsapp">
                    </option>
                </template>
            </select>
        </div>

        <input type="hidden" name="comprador_id" :value="buyerParticipantId">
        <input type="hidden" name="participant_id" :value="buyerParticipantId">

        <!-- Campos de Nome, WhatsApp e Social com Autocomplete Instantâneo -->
        <div class="grid grid-cols-1 sm:grid-cols-12 gap-3 pt-1 border-t border-purple-100/70 dark:border-white/10">
            <!-- Nome Completo -->
            <div class="sm:col-span-5 relative" @click.away="showBuyerNameSuggestions = false">
                <label class="block text-[11px] font-bold text-slate-700 dark:text-slate-300 mb-1 flex items-center justify-between">
                    <span>Nome Completo *</span>
                    <span class="text-[9px] text-pink-600 dark:text-cyber-neon font-black" x-show="buyerNameQuery && !buyerParticipantId">Novo Joiner</span>
                </label>
                <input type="text" name="comprador_nome" required x-model="buyerNameQuery"
                       @input="onBuyerNameInput()"
                       @focus="filterBuyerSuggestions('name'); showBuyerNameSuggestions = true"
                       placeholder="Ex: Mariana Silva"
                       class="w-full bg-white dark:bg-cyber-surface border border-slate-200 dark:border-white/10 rounded-xl px-3 py-2 text-xs font-bold text-slate-800 dark:text-white focus:ring-2 focus:ring-rose-500">

                <!-- Sugestões de Clientes Existentes -->
                <div x-show="showBuyerNameSuggestions && buyerSuggestions.length > 0"
                     class="absolute left-0 right-0 top-full mt-1 bg-white dark:bg-cyber-elevated border border-slate-200 dark:border-white/10 rounded-xl shadow-xl z-30 max-h-44 overflow-y-auto divide-y divide-slate-100 dark:divide-white/5">
                    <template x-for="s in buyerSuggestions" :key="s.id">
                        <div @click="selectBuyerSuggestion(s)"
                             class="p-2.5 hover:bg-rose-50 dark:hover:bg-white/10 cursor-pointer text-xs flex items-center justify-between transition">
                            <div>
                                <span class="font-bold text-slate-900 dark:text-white block" x-text="s.name"></span>
                                <span class="text-[10px] text-slate-400" x-text="s.whatsapp"></span>
                            </div>
                            <span class="text-[10px] font-bold text-rose-600 dark:text-rose-400 bg-rose-50 dark:bg-rose-950/40 px-2 py-0.5 rounded-full">Selecionar</span>
                        </div>
                    </template>
                </div>
            </div>

            <!-- WhatsApp -->
            <div class="sm:col-span-4 relative" @click.away="showBuyerPhoneSuggestions = false">
                <label class="block text-[11px] font-bold text-slate-700 dark:text-slate-300 mb-1 flex items-center justify-between">
                    <span>WhatsApp / Fone *</span>
                </label>
                <input type="text" name="comprador_whatsapp" required x-model="buyerPhoneQuery"
                       @input="onBuyerPhoneInput()"
                       @focus="filterBuyerSuggestions('phone'); showBuyerPhoneSuggestions = true"
                       placeholder="11999998888"
                       class="w-full bg-white dark:bg-cyber-surface border border-slate-200 dark:border-white/10 rounded-xl px-3 py-2 text-xs font-mono font-bold text-slate-800 dark:text-white focus:ring-2 focus:ring-rose-500">
                <input type="hidden" name="whatsapp" :value="buyerPhoneQuery">

                <!-- Sugestões de Clientes Existentes -->
                <div x-show="showBuyerPhoneSuggestions && buyerSuggestions.length > 0"
                     class="absolute left-0 right-0 top-full mt-1 bg-white dark:bg-cyber-elevated border border-slate-200 dark:border-white/10 rounded-xl shadow-xl z-30 max-h-44 overflow-y-auto divide-y divide-slate-100 dark:divide-white/5">
                    <template x-for="s in buyerSuggestions" :key="s.id">
                        <div @click="selectBuyerSuggestion(s)"
                             class="p-2.5 hover:bg-rose-50 dark:hover:bg-white/10 cursor-pointer text-xs flex items-center justify-between transition">
                            <div>
                                <span class="font-bold text-slate-900 dark:text-white block" x-text="s.name"></span>
                                <span class="text-[10px] text-slate-400 font-mono" x-text="s.whatsapp"></span>
                            </div>
                            <span class="text-[10px] font-bold text-rose-600 dark:text-rose-400 bg-rose-50 dark:bg-rose-950/40 px-2 py-0.5 rounded-full">Selecionar</span>
                        </div>
                    </template>
                </div>
            </div>

            <!-- Username / @Social -->
            <div class="sm:col-span-3">
                <label class="block text-[11px] font-bold text-slate-700 dark:text-slate-300 mb-1 flex items-center justify-between">
                    <span>Twitter/X / @</span>
                </label>
                <input type="text" name="comprador_social" x-model="buyerSocialQuery"
                       placeholder="@user"
                       class="w-full bg-white dark:bg-cyber-surface border border-slate-200 dark:border-white/10 rounded-xl px-3 py-2 text-xs font-mono text-slate-800 dark:text-white focus:ring-2 focus:ring-rose-500">
                <input type="hidden" name="comprador_username" :value="buyerUsername">
            </div>
        </div>

        <!-- Feedback do Vínculo -->
        <div x-show="buyerParticipantId" class="pt-1 flex items-center gap-2 text-[11px] text-emerald-700 dark:text-emerald-400 font-bold">
            <i data-lucide="check-circle" class="w-3.5 h-3.5"></i>
            <span>Cliente vinculado ao cadastro existente. As notificações e painel serão integrados.</span>
        </div>
    </div>

    <!-- Observações Internas -->
    <div>
        <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">Observações Internas (Opcional)</label>
        <textarea name="observacoes" rows="2"
                  placeholder="Anotações de split, envio conjunto ou detalhes do pedido..."
                  class="w-full bg-slate-50 dark:bg-cyber-elevated border border-slate-200 dark:border-white/10 rounded-xl p-3 text-xs text-slate-800 dark:text-white focus:ring-2 focus:ring-rose-500 focus:bg-white dark:focus:bg-cyber-surface transition"></textarea>
    </div>
</div>
