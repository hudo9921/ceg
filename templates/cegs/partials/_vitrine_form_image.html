<!-- Linha 4: Imagem (Upload de arquivo e URL) -->
<div class="p-4 sm:p-5 rounded-2xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700/80 space-y-4">
    <div class="flex items-center gap-2">
        <i data-lucide="camera" class="w-4 h-4 text-pink-500 stroke-[1.75]"></i>
        <span class="text-xs font-black uppercase tracking-wider text-slate-600 dark:text-slate-300">
            Foto / Imagem do Item
        </span>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 items-center">
        <div class="space-y-3">
            <div>
                <label class="block text-[11px] font-bold text-slate-600 dark:text-slate-300 mb-1.5">
                    Enviar Arquivo de Imagem
                </label>
                <input type="file" name="foto_arquivo" accept="image/*" @change="handleFileChange($event)"
                       class="block w-full text-xs text-slate-500 dark:text-slate-400 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-pink-100 dark:file:bg-pink-950/60 file:text-pink-700 dark:file:text-pink-300 hover:file:bg-pink-200 dark:hover:file:bg-pink-900 transition cursor-pointer">
            </div>

            <div>
                <label class="block text-[11px] font-bold text-slate-600 dark:text-slate-300 mb-1.5">
                    Ou Link / URL Direta da Imagem
                </label>
                <div class="relative">
                    <input type="url" name="image_url" x-model="imageUrlInput"
                           placeholder="https://exemplo.com/foto.jpg"
                           class="w-full px-3.5 py-2 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-xs text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-pink-500/30 focus:border-pink-500 transition">
                </div>
            </div>
        </div>

        <!-- Prévia da Imagem -->
        <div class="flex flex-col items-center justify-center p-3 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700/80 h-36 relative overflow-hidden group">
            <template x-if="previewSrc">
                <div class="h-full w-full flex items-center justify-center">
                    <img :src="previewSrc" alt="Prévia do Photocard" class="h-32 max-w-full object-contain rounded-lg shadow-sm">
                </div>
            </template>
            <template x-if="!previewSrc">
                <div class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 space-y-1.5">
                    <i data-lucide="image" class="w-8 h-8 stroke-[1.5] text-slate-300 dark:text-slate-600"></i>
                    <span class="text-[10px] font-bold uppercase tracking-wider">Sem prévia</span>
                </div>
            </template>
        </div>
    </div>
</div>
