<!-- ========================================================================= -->
<!-- ESTÚDIO DE RECORTE DE FOTOS / PHOTOCARDS (COMPONENTE MODULAR REUTILIZÁVEL) -->
<!-- ========================================================================= -->

<!-- Carregamento do Cropper.js (CDN leve e de alta performance) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

<style>
/* Estilização de Alta Visibilidade e Contraste para o Cropper no Tema Escuro */
.cropper-container {
    width: 100% !important;
    height: 100% !important;
    max-height: 68vh !important;
}
.cropper-view-box {
    outline: 2.5px solid #f43f5e !important;
    outline-color: rgba(244, 63, 94, 0.95) !important;
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.6), 0 0 16px rgba(244, 63, 94, 0.6) !important;
    border-radius: 4px;
}
.cropper-face {
    background-color: transparent !important;
}
.cropper-modal {
    background-color: #020617 !important;
    opacity: 0.8 !important;
}
.cropper-line {
    background-color: #f43f5e !important;
}
.cropper-dashed {
    border-color: rgba(255, 255, 255, 0.9) !important;
    border-style: dashed !important;
}
.cropper-point {
    background-color: #f43f5e !important;
    width: 10px !important;
    height: 10px !important;
    border: 2px solid #ffffff !important;
    border-radius: 50% !important;
    box-shadow: 0 0 6px rgba(0, 0, 0, 0.9) !important;
    opacity: 1 !important;
}
.cropper-point.point-se {
    width: 14px !important;
    height: 14px !important;
    border-radius: 3px !important;
}
</style>

<div x-show="cropStudioOpen"
     x-cloak
     x-transition:enter="transition ease-out duration-200"
     x-transition:enter-start="opacity-0 scale-95"
     x-transition:enter-end="opacity-100 scale-100"
     x-transition:leave="transition ease-in duration-150"
     x-transition:leave-start="opacity-100 scale-100"
     x-transition:leave-end="opacity-0 scale-95"
     @keydown.window.escape="if (cropStudioOpen) closeCropStudio()"
     @keydown.window.enter="if (cropStudioOpen && !cropStudioSaving) { $event.preventDefault(); cropCurrentItemAndNext(); }"
     class="fixed inset-0 z-[60] bg-slate-950/95 backdrop-blur-md flex flex-col text-slate-100 select-none overflow-hidden"
     style="font-family: inherit;">

    <!-- TOPBAR DO ESTÚDIO -->
    <div class="flex-shrink-0 h-16 border-b border-slate-800 bg-slate-900/80 px-4 sm:px-6 flex items-center justify-between gap-4">
        <div class="flex items-center gap-3 min-w-0">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-pink-500 to-purple-600 flex items-center justify-center text-xl shadow-lg shadow-pink-500/20 shrink-0">
                ✂️
            </div>
            <div class="min-w-0">
                <div class="flex items-center gap-2">
                    <h2 class="text-base sm:text-lg font-black tracking-tight text-white truncate">
                        Estúdio de Recorte de Photocards
                    </h2>
                    <span class="hidden sm:inline-block px-2 py-0.5 rounded-full text-[10px] font-black uppercase tracking-wider bg-pink-500/20 text-pink-300 border border-pink-400/30">
                        Esteira Ágil
                    </span>
                </div>
                <p class="text-xs text-slate-400 truncate">
                    Selecione a área de cada photocard a partir da imagem oficial da CEG
                </p>
            </div>
        </div>

        <div class="flex items-center gap-2">
            <button type="button"
                    @click="closeCropStudio()"
                    class="px-3.5 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white font-bold text-xs transition border border-slate-700 flex items-center gap-1.5 cursor-pointer"
                    title="Fechar estúdio e voltar (ESC)">
                <span>✕</span>
                <span class="hidden sm:inline">Fechar</span>
            </button>
        </div>
    </div>

    <!-- CONTEÚDO PRINCIPAL (ÁREA DE RECORTE + BARRA LATERAL) -->
    <div class="flex-1 min-h-0 flex flex-col lg:flex-row overflow-hidden">

        <!-- LADO ESQUERDO: WORKSPACE DE RECORTE (CROPPER.JS) -->
        <div class="flex-1 min-w-0 flex flex-col bg-slate-950 p-3 sm:p-4 border-b lg:border-b-0 lg:border-r border-slate-800">
            <!-- Barra de Ferramentas do Recorte -->
            <div class="flex-shrink-0 mb-3 flex flex-wrap items-center justify-between gap-2 bg-slate-900/90 p-2.5 rounded-xl border border-slate-800">
                <!-- Seletor de Proporção (Aspect Ratio) -->
                <div class="flex items-center gap-1.5">
                    <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mr-1">Proporção:</span>
                    <button type="button"
                            @click="setCropAspectRatio(2/3)"
                            :class="cropAspectRatio === 2/3 ? 'bg-pink-600 text-white shadow-sm font-black' : 'bg-slate-800 text-slate-300 hover:bg-slate-700 font-bold'"
                            class="px-2.5 py-1 rounded-lg text-xs transition cursor-pointer flex items-center gap-1">
                        <span>🎴</span> Photocard (2:3)
                    </button>
                    <button type="button"
                            @click="setCropAspectRatio(1)"
                            :class="cropAspectRatio === 1 ? 'bg-pink-600 text-white shadow-sm font-black' : 'bg-slate-800 text-slate-300 hover:bg-slate-700 font-bold'"
                            class="px-2.5 py-1 rounded-lg text-xs transition cursor-pointer flex items-center gap-1">
                        <span>⏹️</span> 1:1
                    </button>
                    <button type="button"
                            @click="setCropAspectRatio(NaN)"
                            :class="isNaN(cropAspectRatio) ? 'bg-pink-600 text-white shadow-sm font-black' : 'bg-slate-800 text-slate-300 hover:bg-slate-700 font-bold'"
                            class="px-2.5 py-1 rounded-lg text-xs transition cursor-pointer flex items-center gap-1">
                        <span>🔓</span> Livre
                    </button>
                </div>

                <!-- Ações de Ajuste (Zoom, Girar, Reset) -->
                <div class="flex items-center gap-1.5">
                    <button type="button"
                            @click="cropperZoom(0.1)"
                            class="p-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg text-xs font-bold transition border border-slate-700 cursor-pointer"
                            title="Aumentar Zoom">
                        🔍+
                    </button>
                    <button type="button"
                            @click="cropperZoom(-0.1)"
                            class="p-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg text-xs font-bold transition border border-slate-700 cursor-pointer"
                            title="Diminuir Zoom">
                        🔍-
                    </button>
                    <button type="button"
                            @click="cropperRotate(90)"
                            class="p-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg text-xs font-bold transition border border-slate-700 cursor-pointer"
                            title="Girar 90°">
                        ↷ Girar
                    </button>
                    <button type="button"
                            @click="cropperReset()"
                            class="p-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg text-xs font-bold transition border border-slate-700 cursor-pointer"
                            title="Resetar Posição">
                        ↺ Reset
                    </button>
                </div>
            </div>

            <!-- Imagem e Container do Cropper -->
            <div class="flex-1 min-h-[350px] lg:min-h-0 bg-slate-900/60 rounded-2xl border border-slate-800/80 overflow-hidden relative flex flex-col items-center justify-center p-2">
                <!-- Spinner enquanto a imagem não estiver pronta -->
                <div x-show="!cropStudioImageReady" class="absolute inset-0 z-10 bg-slate-950/85 flex flex-col items-center justify-center space-y-3">
                    <div class="w-10 h-10 border-4 border-pink-500 border-t-transparent rounded-full animate-spin"></div>
                    <p class="text-xs text-slate-300 font-bold">Carregando imagem no estúdio...</p>
                </div>

                <!-- Imagem Alvo do Cropper.js -->
                <div class="w-full h-full min-h-[320px] max-h-[68vh] flex items-center justify-center relative">
                    <img id="crop-studio-target-image"
                         :src="cropStudioSourceUrl"
                         alt="Imagem para recorte"
                         class="block max-w-full max-h-[66vh] object-contain"
                         @load="onCropStudioImageLoad()" />
                </div>
            </div>
        </div>

        <!-- LADO DIREITO: BARRA LATERAL DA ESTEIRA DE INTEGRANTES -->
        <div class="w-full lg:w-96 flex-shrink-0 flex flex-col bg-slate-900/90 p-4 border-t lg:border-t-0 border-slate-800">
            <!-- Cabeçalho da Lista -->
            <div class="flex-shrink-0 mb-3 pb-3 border-b border-slate-800 space-y-2">
                <div class="flex items-center justify-between">
                    <span class="text-xs font-black uppercase tracking-wider text-pink-400 flex items-center gap-1.5">
                        <span>👥</span> Esteira de Integrantes
                    </span>
                    <span class="text-xs font-bold text-slate-400"
                          x-text="`${cropStudioItems.filter(i => !!(i.image_url || i.image_base64)).length} de ${cropStudioItems.length} recortados`">
                    </span>
                </div>

                <!-- Barra de Progresso Visual -->
                <div class="w-full bg-slate-800 rounded-full h-2 overflow-hidden">
                    <div class="bg-gradient-to-r from-pink-500 to-purple-500 h-2 rounded-full transition-all duration-300"
                         :style="`width: ${cropStudioItems.length ? (cropStudioItems.filter(i => !!(i.image_url || i.image_base64)).length / cropStudioItems.length) * 100 : 0}%`">
                    </div>
                </div>
            </div>

            <!-- Lista Rolável dos Integrantes -->
            <div class="flex-1 min-h-0 overflow-y-auto space-y-2 pr-1 custom-scrollbar">
                <template x-for="(item, idx) in cropStudioItems" :key="item.id || idx">
                    <div @click="selectCropStudioIndex(idx)"
                         :class="cropStudioCurrentIndex === idx
                                ? 'bg-gradient-to-r from-pink-900/60 to-purple-900/50 border-pink-500 text-white shadow-md ring-1 ring-pink-500'
                                : 'bg-slate-800/70 hover:bg-slate-800 border-slate-700/80 text-slate-300'"
                         class="p-2.5 rounded-xl border transition cursor-pointer flex items-center justify-between gap-3 group">
                        
                        <!-- Miniatura ou Ícone -->
                        <div class="flex items-center gap-3 min-w-0">
                            <div class="w-11 h-14 rounded-lg bg-slate-950 border border-slate-700/80 overflow-hidden shrink-0 flex items-center justify-center relative">
                                <template x-if="item.image_base64 || item.image_url">
                                    <img :src="item.image_base64 || item.image_url"
                                         class="w-full h-full object-cover">
                                </template>
                                <template x-if="!item.image_base64 && !item.image_url">
                                    <span class="text-lg opacity-40">🎴</span>
                                </template>

                                <!-- Indicador de membro ativo -->
                                <template x-if="cropStudioCurrentIndex === idx">
                                    <span class="absolute top-0 right-0 w-2 h-2 rounded-full bg-pink-500 ring-2 ring-slate-950 animate-pulse"></span>
                                </template>
                            </div>

                            <div class="min-w-0">
                                <div class="flex items-center gap-1.5 flex-wrap">
                                    <span class="text-xs font-black truncate"
                                          :class="cropStudioCurrentIndex === idx ? 'text-pink-200' : 'text-slate-100'"
                                          x-text="item.member_name || item.name || `Item #${idx + 1}`">
                                    </span>
                                </div>
                                <p class="text-[10px] text-slate-400 truncate" x-text="item.name"></p>
                            </div>
                        </div>

                        <!-- Badge de Status -->
                        <div class="shrink-0 text-right">
                            <template x-if="item.image_base64 || item.image_url">
                                <span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">
                                    ✓ Pronto
                                </span>
                            </template>
                            <template x-if="!item.image_base64 && !item.image_url">
                                <span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-slate-800 text-slate-400 border border-slate-700">
                                    Pendente
                                </span>
                            </template>
                        </div>
                    </div>
                </template>
            </div>

            <!-- Bloco de Ações do Item Atual -->
            <div class="flex-shrink-0 pt-3 mt-3 border-t border-slate-800 space-y-2">
                <div class="p-2.5 rounded-xl bg-slate-950/60 border border-slate-800 flex items-center justify-between text-xs">
                    <span class="text-slate-400">Item Selecionado:</span>
                    <strong class="text-pink-300 font-black truncate max-w-[180px]"
                            x-text="cropStudioItems[cropStudioCurrentIndex]?.member_name || cropStudioItems[cropStudioCurrentIndex]?.name || 'Nenhum'">
                    </strong>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <button type="button"
                            @click="skipCropStudioItem()"
                            class="px-3 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-xs rounded-xl transition border border-slate-700 cursor-pointer flex items-center justify-center gap-1">
                        <span>↷</span> Pular Item
                    </button>

                    <button type="button"
                            @click="cropCurrentItemAndNext()"
                            :disabled="cropStudioSaving"
                            class="px-3 py-2.5 bg-gradient-to-r from-pink-600 to-purple-600 hover:from-pink-500 hover:to-purple-500 text-white font-black text-xs rounded-xl shadow-lg shadow-pink-500/25 transition cursor-pointer flex items-center justify-center gap-1.5 disabled:opacity-50">
                        <span x-show="!cropStudioSaving">💾 Salvar & Próx</span>
                        <span x-show="cropStudioSaving">⏳ Salvando...</span>
                    </button>
                </div>

                <button type="button"
                        @click="closeCropStudio()"
                        class="w-full py-2 bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-300 border border-emerald-500/30 font-bold text-xs rounded-xl transition cursor-pointer flex items-center justify-center gap-1.5 mt-1">
                    <span>✨</span> Concluir & Retornar
                </button>
            </div>
        </div>
    </div>
</div>
