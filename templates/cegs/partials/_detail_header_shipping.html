<!-- ==========================================
     HEADER DA CEG: LOGÍSTICA & CAIXA VINCULADA
     Card de Remessa Internacional e Rastreio
     ========================================== -->
{% if ceg.caixa %}
<div class="bg-gradient-to-r from-sky-950/95 via-indigo-950/90 to-slate-950/95 text-white rounded-2xl p-4 sm:p-5 border border-sky-500/30 shadow-sm flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
    <div class="flex items-center gap-3.5">
        <div class="w-11 h-11 rounded-2xl bg-sky-500/20 border border-sky-400/30 flex items-center justify-center text-sky-300 shrink-0 shadow-inner">
            <i data-lucide="plane-takeoff" class="w-6 h-6" stroke-width="1.75"></i>
        </div>
        <div>
            <div class="flex items-center gap-2">
                <span class="text-[10px] font-black uppercase tracking-wider text-sky-300">
                    Remessa Internacional Vinculada
                </span>
                <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-sky-500/20 text-sky-200 border border-sky-400/30">
                    {{ ceg.caixa.get_origem_display }}
                </span>
            </div>
            <h4 class="text-sm sm:text-base font-black text-white mt-0.5 flex items-center gap-1.5 flex-wrap">
                <span>{{ ceg.caixa.nome }}</span>
                <span class="text-slate-500">&bull;</span>
                <span class="text-sky-300 text-xs sm:text-sm font-semibold">{{ ceg.get_shipping_status_display }}</span>
            </h4>
        </div>
    </div>

    <div class="flex items-center gap-2.5 self-end sm:self-center flex-wrap">
        {% if ceg.caixa.codigo_rastreio %}
        <a href="{{ ceg.caixa.tracking_url }}" target="_blank" rel="noopener noreferrer"
           class="px-3 py-1.5 bg-sky-600 hover:bg-sky-500 text-white text-xs font-bold rounded-xl transition shadow flex items-center gap-1.5 active:scale-95">
            <i data-lucide="external-link" class="w-3.5 h-3.5" stroke-width="1.75"></i>
            <span>Rastrear: {{ ceg.caixa.codigo_rastreio }}</span>
        </a>
        {% endif %}
        <a href="{% url 'caixa_detail' slug=ceg.caixa.slug %}"
           class="px-3 py-1.5 bg-white/10 hover:bg-white/20 text-white text-xs font-bold rounded-xl border border-white/20 transition flex items-center gap-1.5 active:scale-95">
            <span>Ver Caixa</span>
            <i data-lucide="arrow-up-right" class="w-3.5 h-3.5" stroke-width="1.75"></i>
        </a>
    </div>
</div>
{% endif %}
