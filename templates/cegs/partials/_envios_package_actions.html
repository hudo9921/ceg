<!-- BOTÕES DE AÇÃO DO PACOTE -->
<div class="pt-3 border-t border-slate-100 dark:border-slate-800 flex flex-wrap items-center gap-2">
    {% if pacote.status == 'EM_PREPARACAO' %}
        <button type="button"
                @click="openDispatchModal('{{ pacote.id }}', '{{ pacote.identificador }}', '{{ pacote.transportadora }}', '{{ pacote.codigo_rastreio }}')"
                class="w-full px-3.5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 shadow-sm cursor-pointer">
            <i data-lucide="rocket" class="w-3.5 h-3.5"></i>
            <span>Despachar / Marcar como Enviado</span>
        </button>
    {% elif pacote.status == 'ENVIADO' %}
        <form method="post" action="{% url 'marcar_pacote_entregue' pacote.id %}" class="w-full"
              onsubmit="return confirm('Marcar o pacote {{ pacote.identificador }} como ENTREGUE ao destinatário?')">
            {% csrf_token %}
            <input type="hidden" name="next" value="/envios/">
            <button type="submit"
                    class="w-full px-3.5 py-2 bg-purple-600 hover:bg-purple-700 text-white rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 shadow-sm cursor-pointer">
                <i data-lucide="check-circle-2" class="w-3.5 h-3.5"></i>
                <span>Marcar como Entregue</span>
            </button>
        </form>
    {% endif %}

    <button type="button"
            @click="openEditPacoteModal('{{ pacote.id }}', '{{ pacote.identificador }}', '{{ pacote.transportadora }}', '{{ pacote.codigo_rastreio }}', '{{ pacote.valor_frete_nacional|default:'' }}', {{ pacote.is_frete_pago|yesno:'true,false' }}, '{{ pacote.status }}', '{{ pacote.observacoes|escapejs }}')"
            class="flex-1 px-3 py-1.5 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1 cursor-pointer">
        <i data-lucide="pencil" class="w-3 h-3"></i>
        <span>Editar</span>
    </button>

    <a href="{% url 'consulta_joiner' %}?participant_id={{ pacote.participant_id }}"
       class="px-3 py-1.5 bg-pink-50 dark:bg-pink-950/40 hover:bg-pink-100 text-pink-700 dark:text-pink-300 rounded-xl text-xs font-bold transition text-center flex items-center gap-1"
       title="Ver todos os itens e pagamentos deste joiner">
        <i data-lucide="user" class="w-3 h-3"></i>
        <span>Joiner</span>
    </a>

    {% if pacote.status == 'EM_PREPARACAO' %}
        <form method="post" action="{% url 'excluir_pacote' pacote.id %}" onsubmit="return confirm('Excluir este pacote? Os itens voltarão para a fila de não empacotados.')">
            {% csrf_token %}
            <input type="hidden" name="next" value="/envios/">
            <button type="submit" class="px-2.5 py-1.5 text-slate-400 hover:text-red-600 rounded-xl text-xs font-bold transition cursor-pointer" title="Excluir pacote">
                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
            </button>
        </form>
    {% endif %}
</div>
