<!-- Modal: Gerador de Texto de Divulgação de Vagas (Twitter / WhatsApp / Telegram) -->
<div x-show="shareModalOpen" x-cloak
     x-transition:enter="transition ease-out duration-200"
     x-transition:enter-start="opacity-0 scale-95"
     x-transition:enter-end="opacity-100 scale-100"
     x-transition:leave="transition ease-in duration-150"
     x-transition:leave-start="opacity-100 scale-100"
     x-transition:leave-end="opacity-0 scale-95"
     class="fixed inset-0 z-50 overflow-y-auto bg-slate-950/75 backdrop-blur-xs flex items-center justify-center p-4 sm:p-6"
     @keydown.escape.window="closeShareModal()"
     x-init="$watch('shareModalOpen', value => { if (value) { $nextTick(() => window.dispatchEvent(new Event('icons-refresh'))); } })">
    <div class="bg-white dark:bg-cyber-surface rounded-3xl max-w-xl w-full p-6 sm:p-7 shadow-2xl space-y-5 border border-purple-100/70 dark:border-white/10 transform transition-all my-auto"
         @click.away="closeShareModal()">

        <!-- Cabeçalho do Modal -->
        <div class="flex justify-between items-start border-b border-purple-100/60 dark:border-white/5 pb-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-pink-500 to-purple-600 text-white flex items-center justify-center shadow-xs">
                    <i data-lucide="share-2" class="w-5 h-5"></i>
                </div>
                <div>
                    <h3 class="text-base sm:text-lg font-black text-slate-900 dark:text-white flex items-center gap-2">
                        <span>Divulgação de Vagas Abertas</span>
                    </h3>
                    <p class="text-xs text-slate-500 dark:text-slate-400">
                        Texto formatado em tempo real pronto para Twitter, WhatsApp e Telegram.
                    </p>
                </div>
            </div>
            <button type="button" @click="closeShareModal()"
                    class="p-2 rounded-full bg-slate-100 dark:bg-cyber-elevated text-slate-400 hover:text-slate-700 dark:hover:text-white transition cursor-pointer">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
        </div>

        <!-- Barra de Personalização Rápida -->
        <div class="space-y-3 bg-purple-50/40 dark:bg-cyber-elevated/60 p-3.5 rounded-2xl border border-purple-100/60 dark:border-white/5">
            <div class="flex flex-wrap items-center justify-between gap-3 text-xs">
                <!-- Seletor de Marcador de Vaga -->
                <div class="flex items-center gap-2">
                    <span class="font-bold text-slate-700 dark:text-cyber-silver">Marcador:</span>
                    <div class="inline-flex items-center rounded-xl bg-white dark:bg-cyber-surface p-1 border border-purple-100 dark:border-white/10 gap-1 shadow-2xs">
                        <button type="button" @click="shareEmoji = '🟢'"
                                :class="shareEmoji === '🟢' ? 'bg-purple-100 dark:bg-cyber-elevated text-pink-700 dark:text-cyber-neon font-black' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-cyber-elevated'"
                                class="px-2 py-0.5 rounded-lg text-xs transition cursor-pointer" title="Círculo Verde">
                            🟢
                        </button>
                        <button type="button" @click="shareEmoji = '⭕'"
                                :class="shareEmoji === '⭕' ? 'bg-purple-100 dark:bg-cyber-elevated text-pink-700 dark:text-cyber-neon font-black' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-cyber-elevated'"
                                class="px-2 py-0.5 rounded-lg text-xs transition cursor-pointer" title="Círculo Vermelho / K-pop">
                            ⭕
                        </button>
                        <button type="button" @click="shareEmoji = '✅'"
                                :class="shareEmoji === '✅' ? 'bg-purple-100 dark:bg-cyber-elevated text-pink-700 dark:text-cyber-neon font-black' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-cyber-elevated'"
                                class="px-2 py-0.5 rounded-lg text-xs transition cursor-pointer" title="Check">
                            ✅
                        </button>
                        <button type="button" @click="shareEmoji = '🪪'"
                                :class="shareEmoji === '🪪' ? 'bg-purple-100 dark:bg-cyber-elevated text-pink-700 dark:text-cyber-neon font-black' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-cyber-elevated'"
                                class="px-2 py-0.5 rounded-lg text-xs transition cursor-pointer" title="Photocard">
                            🪪
                        </button>
                    </div>
                </div>

                <!-- Opções: Mostrar Esgotados e Preço -->
                <div class="flex items-center gap-4 flex-wrap">
                    <label class="inline-flex items-center gap-1.5 cursor-pointer select-none font-medium text-slate-700 dark:text-cyber-silver">
                        <input type="checkbox" x-model="shareShowSoldOut"
                               class="rounded text-pink-600 focus:ring-pink-500 w-3.5 h-3.5 border-slate-300 dark:border-white/20">
                        <span>Mostrar esgotados (❌)</span>
                    </label>

                    <template x-if="cegPriceDisplay">
                        <label class="inline-flex items-center gap-1.5 cursor-pointer select-none font-medium text-slate-700 dark:text-cyber-silver">
                            <input type="checkbox" x-model="shareIncludePrice"
                                   class="rounded text-pink-600 focus:ring-pink-500 w-3.5 h-3.5 border-slate-300 dark:border-white/20">
                            <span>Incluir valor</span>
                        </label>
                    </template>
                </div>
            </div>
        </div>

        <!-- Caixa de Pré-Visualização do Texto -->
        <div class="space-y-1.5">
            <div class="flex justify-between items-center text-xs text-slate-500 dark:text-slate-400">
                <span class="font-bold flex items-center gap-1.5">
                    <i data-lucide="file-text" class="w-3.5 h-3.5 text-purple-400"></i>
                    <span>Pré-visualização da mensagem:</span>
                </span>
                <div class="flex items-center gap-2">
                    <span class="font-mono text-[11px]"
                          :class="shareText.length <= 280 ? 'text-emerald-600 dark:text-emerald-400 font-bold' : 'text-amber-600 dark:text-amber-400 font-bold'"
                          x-text="shareText.length + ' caracteres'"></span>
                    <span x-show="shareText.length <= 280" class="text-[10px] px-1.5 py-0.5 rounded bg-emerald-100 dark:bg-emerald-950/60 text-emerald-800 dark:text-emerald-300 font-bold flex items-center gap-1">
                        <i data-lucide="check" class="w-3 h-3"></i>
                        <span>Cabe no Twitter/X</span>
                    </span>
                </div>
            </div>

            <div class="relative">
                <textarea readonly
                          class="w-full h-48 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-white/10 rounded-2xl p-4 font-mono text-xs text-slate-800 dark:text-slate-200 leading-relaxed resize-none focus:outline-none focus:ring-2 focus:ring-pink-500 select-all shadow-inner"
                          :value="shareText"
                          @click="$event.target.select()"></textarea>
            </div>
        </div>

        <!-- Ações Rápidas de Compartilhamento & Copiar -->
        <div class="pt-3 border-t border-purple-100/60 dark:border-white/5 flex flex-col sm:flex-row items-center justify-between gap-3">
            <!-- Botões Diretos de Rede Social -->
            <div class="flex items-center gap-2 w-full sm:w-auto">
                <a :href="'https://api.whatsapp.com/send?text=' + encodeURIComponent(shareText)"
                   target="_blank" rel="noopener noreferrer"
                   class="flex-1 sm:flex-none px-3 py-2.5 rounded-xl bg-emerald-50 dark:bg-emerald-950/40 text-emerald-700 dark:text-emerald-300 hover:bg-emerald-100 dark:hover:bg-emerald-900/60 border border-emerald-200/80 dark:border-emerald-800/50 font-bold text-xs transition flex items-center justify-center gap-1.5 cursor-pointer"
                   title="Abrir no WhatsApp Web/App com o texto">
                    <i data-lucide="message-circle" class="w-3.5 h-3.5"></i>
                    <span>WhatsApp</span>
                </a>

                <a :href="'https://twitter.com/intent/tweet?text=' + encodeURIComponent(shareText)"
                   target="_blank" rel="noopener noreferrer"
                   class="flex-1 sm:flex-none px-3 py-2.5 rounded-xl bg-slate-100 dark:bg-cyber-elevated text-slate-700 dark:text-slate-200 hover:bg-slate-200 dark:hover:bg-white/10 border border-slate-200 dark:border-white/10 font-bold text-xs transition flex items-center justify-center gap-1.5 cursor-pointer"
                   title="Postar no Twitter/X">
                    <i data-lucide="send" class="w-3.5 h-3.5"></i>
                    <span>Twitter/X</span>
                </a>

                <a :href="'https://t.me/share/url?url=' + encodeURIComponent(window.location.href) + '&text=' + encodeURIComponent(shareText)"
                   target="_blank" rel="noopener noreferrer"
                   class="flex-1 sm:flex-none px-3 py-2.5 rounded-xl bg-sky-50 dark:bg-sky-950/40 text-sky-700 dark:text-sky-300 hover:bg-sky-100 dark:hover:bg-sky-900/60 border border-sky-200/80 dark:border-sky-800/50 font-bold text-xs transition flex items-center justify-center gap-1.5 cursor-pointer"
                   title="Compartilhar no Telegram">
                    <i data-lucide="paperclip" class="w-3.5 h-3.5"></i>
                    <span>Telegram</span>
                </a>
            </div>

            <!-- Botão Copiar Principal -->
            <button type="button" @click="copyShareText()"
                    class="w-full sm:w-auto px-6 py-2.5 rounded-xl font-black text-xs transition flex items-center justify-center gap-2 shadow-md cursor-pointer select-none active:scale-95"
                    :class="shareCopied
                        ? 'bg-emerald-600 hover:bg-emerald-700 text-white shadow-emerald-500/20'
                        : 'bg-gradient-to-r from-violet-600 via-pink-600 to-indigo-600 hover:from-violet-500 hover:to-indigo-500 text-white shadow-indigo-500/20'">
                <i data-lucide="check" x-show="shareCopied" class="w-4 h-4"></i>
                <i data-lucide="copy" x-show="!shareCopied" class="w-4 h-4"></i>
                <span x-text="shareCopied ? 'Copiado para o Clipboard!' : 'Copiar Texto Completo'"></span>
            </button>
        </div>

    </div>
</div>
