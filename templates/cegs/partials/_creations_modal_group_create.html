<!-- MODAL 1: CADASTRAR GRUPO NOVO (POP-UP) -->
<div x-show="activeModal === 'group'" x-cloak
     class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-sm"
     @click.self="closeModal()">
    <div class="bg-white dark:bg-[#14121B] w-full max-w-lg rounded-3xl shadow-2xl border border-purple-100 dark:border-white/10 overflow-hidden flex flex-col max-h-[90vh]">
        
        <!-- Header do Modal -->
        <div class="p-5 border-b border-slate-200/80 dark:border-white/10 flex items-center justify-between bg-gradient-to-r from-purple-50 via-pink-50 to-white dark:from-purple-950/30 dark:via-pink-950/30 dark:to-[#14121B]">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl bg-purple-100 dark:bg-purple-950/50 text-purple-600 dark:text-purple-400 flex items-center justify-center border border-purple-200/50 dark:border-purple-500/20">
                    <i data-lucide="mic" class="w-5 h-5"></i>
                </div>
                <div>
                    <h3 class="text-base font-black text-slate-900 dark:text-white">Cadastrar Grupo Novo</h3>
                    <p class="text-[11px] text-slate-500 dark:text-cyber-silver">Adicione grupos ou solistas de K-pop ao catálogo.</p>
                </div>
            </div>
            <button type="button" @click="closeModal()" class="w-8 h-8 rounded-xl flex items-center justify-center text-slate-400 hover:text-slate-700 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-white/10 transition cursor-pointer">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
        </div>

        <form id="create_group_form" action="{% url 'create_group' %}" method="POST" enctype="multipart/form-data" class="p-6 space-y-4 overflow-y-auto"
              @submit="if (newGroupMemberInput && newGroupMemberInput.trim()) addGroupMember(false); if ($refs.newGroupMembersJson) $refs.newGroupMembersJson.value = JSON.stringify(newGroupMembers);">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">Nome do Grupo / Solista *</label>
                <input type="text" name="name" required
                       placeholder="Ex: LE SSERAFIM, Stray Kids, IU, aespa"
                       class="w-full bg-slate-50 dark:bg-cyber-elevated border border-slate-200 dark:border-white/10 rounded-xl px-3.5 py-2.5 text-sm font-bold text-slate-900 dark:text-white focus:ring-2 focus:ring-purple-500 focus:bg-white dark:focus:bg-cyber-surface transition">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">Foto / Logo do Grupo</label>

                <!-- Preview -->
                <div x-show="groupImagePreview" class="relative rounded-2xl overflow-hidden border border-purple-200 dark:border-white/10 h-36 bg-slate-950 flex items-center justify-center group mb-2">
                    <img :src="groupImagePreview" alt="" class="absolute inset-0 w-full h-full object-cover blur-xl opacity-40 scale-110 pointer-events-none">
                    <img :src="groupImagePreview" alt="Logo Preview" class="relative z-10 max-h-36 w-auto max-w-full object-contain mx-auto">
                    <button type="button" @click="clearGroupImage()"
                            class="absolute top-2 right-2 z-20 px-2.5 py-1 bg-rose-600/90 hover:bg-rose-700 text-white rounded-lg font-bold text-[10px] shadow transition flex items-center gap-1 cursor-pointer">
                        <i data-lucide="trash-2" class="w-3 h-3"></i>
                        <span>Remover</span>
                    </button>
                </div>

                <!-- Dropzone Interativa: PC, Arrastar ou Ctrl+V -->
                <div @dragover.prevent="groupDragOver = true"
                     @dragleave.prevent="groupDragOver = false"
                     @drop.prevent="groupDragOver = false; if ($event.dataTransfer.files[0]) handleGroupImageFile($event.dataTransfer.files[0])"
                     @click="$refs.groupFileInput.click()"
                     :class="groupDragOver ? 'border-purple-500 bg-purple-50 dark:bg-purple-950/30 ring-2 ring-purple-300' : 'border-purple-100/80 dark:border-white/10 bg-slate-50/70 dark:bg-white/5 hover:bg-purple-50/50 dark:hover:bg-white/10 hover:border-purple-300'"
                     class="border-2 border-dashed rounded-2xl p-4 text-center cursor-pointer transition flex flex-col items-center justify-center gap-1.5 mb-2 select-none">
                    <i data-lucide="image" class="w-6 h-6 text-purple-400"></i>
                    <p class="text-xs font-bold text-slate-800 dark:text-slate-200">
                        Clique para escolher do PC ou dê <kbd class="px-1.5 py-0.5 bg-purple-100 dark:bg-purple-950/60 text-purple-700 dark:text-purple-300 border border-purple-200 dark:border-white/10 rounded font-black text-[10px]">Ctrl + V</kbd>
                    </p>
                    <p class="text-[10px] text-slate-400">Arraste um arquivo de imagem para cá</p>
                </div>

                <input type="file" x-ref="groupFileInput" name="image_file" accept="image/*" class="hidden"
                       @change="if ($event.target.files[0]) handleGroupImageFile($event.target.files[0])">
                <input type="hidden" name="image_base64" :value="groupImageBase64">

                <input type="text" name="image_url" x-model="groupImageUrl"
                       @input="groupImagePreview = $event.target.value; groupImageBase64 = ''"
                       placeholder="Ou cole a URL direta da imagem (https://...)"
                       class="w-full bg-slate-50 dark:bg-cyber-elevated border border-slate-200 dark:border-white/10 rounded-xl px-3.5 py-2 text-xs text-slate-900 dark:text-white focus:ring-2 focus:ring-purple-500 focus:bg-white dark:focus:bg-cyber-surface transition">
            </div>

            <!-- Cor Tema do Grupo -->
            <div>
                <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5 flex items-center justify-between">
                    <span class="flex items-center gap-1.5">
                        <i data-lucide="palette" class="w-3.5 h-3.5 text-purple-400"></i>
                        <span>Cor Tema do Grupo (Opcional)</span>
                    </span>
                    <span class="text-[10px] text-slate-400 font-normal">Detectada da imagem se deixar vazio</span>
                </label>
                <div class="flex items-center gap-2">
                    <input type="color" :value="groupColorHex || '#8B5CF6'" @input="groupColorHex = $event.target.value"
                           class="w-9 h-9 rounded-xl border border-slate-200 dark:border-white/10 cursor-pointer p-0.5 bg-white dark:bg-cyber-elevated shrink-0">
                    <input type="text" name="color_hex" x-model="groupColorHex" placeholder="Ex: #EC4899 (ou deixe vazio para automático)"
                           class="flex-1 bg-slate-50 dark:bg-cyber-elevated border border-slate-200 dark:border-white/10 rounded-xl px-3.5 py-2 text-xs font-mono font-bold uppercase text-slate-900 dark:text-white focus:ring-2 focus:ring-purple-500 focus:bg-white dark:focus:bg-cyber-surface transition">
                    <button type="button" x-show="groupColorHex" @click="groupColorHex = ''"
                            class="px-2.5 py-2 bg-slate-100 dark:bg-white/10 hover:bg-slate-200 dark:hover:bg-white/20 text-slate-600 dark:text-slate-300 rounded-xl text-xs font-bold transition"
                            title="Redefinir para detecção automática">
                        Auto
                    </button>
                </div>
            </div>

            <!-- Integrantes / Membros do Grupo -->
            <div class="bg-purple-50/50 dark:bg-cyber-elevated/40 p-4 rounded-2xl border border-purple-100/80 dark:border-white/10 space-y-3">
                <div class="flex items-center justify-between">
                    <div>
                        <label class="block text-xs font-bold text-slate-800 dark:text-slate-200 flex items-center gap-1.5">
                            <i data-lucide="users" class="w-3.5 h-3.5 text-purple-400"></i>
                            <span>Integrantes do Grupo / Membros</span>
                        </label>
                        <p class="text-[11px] text-slate-500 dark:text-cyber-silver">
                            Digite os nomes e aperte <kbd class="px-1 py-0.5 bg-white dark:bg-white/10 border border-slate-200 dark:border-white/10 rounded text-[10px] font-mono">Enter</kbd> ou cole lista por vírgula.
                        </p>
                    </div>
                    <span class="text-xs font-black px-2.5 py-1 rounded-full bg-purple-100 dark:bg-purple-950/60 text-purple-700 dark:text-purple-300 border border-purple-200/50 dark:border-white/10"
                          x-text="newGroupMembers.length + ' membro(s)'">
                    </span>
                </div>

                <div class="flex gap-2">
                    <input type="text" name="newGroupMemberInput" x-model="newGroupMemberInput"
                           @keydown="handleMemberInputKeydown($event, false)"
                           placeholder="Ex: Sakura, Chaewon, Yunjin... (aperte Enter)"
                           class="flex-1 bg-white dark:bg-cyber-surface border border-purple-200 dark:border-white/10 rounded-xl px-3.5 py-2 text-xs font-bold text-slate-800 dark:text-white focus:ring-2 focus:ring-purple-500 transition">
                    <button type="button" @click="addGroupMember(false)"
                            class="px-3.5 py-2 bg-purple-600 hover:bg-purple-700 text-white font-bold text-xs rounded-xl shadow-xs transition shrink-0 cursor-pointer flex items-center gap-1">
                        <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                        <span>Adicionar</span>
                    </button>
                </div>

                <!-- Pills / Tags dos Integrantes -->
                <div class="flex flex-wrap gap-1.5 min-h-[32px] p-2 bg-white/80 dark:bg-cyber-surface/60 rounded-xl border border-purple-100/70 dark:border-white/10"
                     x-show="newGroupMembers.length > 0">
                    <template x-for="(member, idx) in newGroupMembers" :key="idx">
                        <span class="inline-flex items-center gap-1 px-2.5 py-1 bg-purple-100/80 dark:bg-purple-950/60 text-purple-900 dark:text-purple-200 border border-purple-200/60 dark:border-white/10 rounded-lg text-xs font-bold">
                            <span class="text-[10px] text-purple-500 font-mono" x-text="(idx + 1) + '.'"></span>
                            <span x-text="member"></span>
                            <button type="button" @click="removeGroupMember(idx, false)"
                                    class="text-purple-400 hover:text-rose-600 ml-0.5 text-xs font-bold cursor-pointer">
                                <i data-lucide="x" class="w-3 h-3"></i>
                            </button>
                        </span>
                    </template>
                </div>

                <!-- Campo oculto para envio no POST -->
                <input type="hidden" name="members_json" x-ref="newGroupMembersJson" :value="JSON.stringify(newGroupMembers)">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">Descrição / Informações (opcional)</label>
                <textarea name="description" rows="3"
                          placeholder="Ex: Girl group da Source Music / HYBE composto por 5 integrantes."
                          class="w-full bg-slate-50 dark:bg-cyber-elevated border border-slate-200 dark:border-white/10 rounded-xl p-3 text-xs sm:text-sm text-slate-900 dark:text-white focus:ring-2 focus:ring-purple-500 focus:bg-white dark:focus:bg-cyber-surface transition"></textarea>
            </div>

            <div class="pt-3 border-t border-slate-100 dark:border-white/10 flex justify-end gap-2">
                <button type="button" @click="closeModal()"
                        class="px-4 py-2 bg-slate-100 dark:bg-white/10 hover:bg-slate-200 dark:hover:bg-white/20 text-slate-700 dark:text-cyber-silver font-bold text-xs rounded-xl transition cursor-pointer">
                    Cancelar
                </button>
                <button type="submit"
                        class="px-6 py-2 bg-purple-600 hover:bg-purple-700 text-white font-black text-xs rounded-xl shadow transition cursor-pointer flex items-center gap-1.5 hover:scale-[1.02]">
                    <i data-lucide="check" class="w-3.5 h-3.5"></i>
                    <span>Salvar Grupo</span>
                </button>
            </div>
        </form>
    </div>
</div>
