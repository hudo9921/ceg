<!-- Trilho / Carrossel Horizontal por Grupo (Estilo Deezer / Peek-a-boo com Navegação Desktop) -->
<div class="space-y-3"
     id="grupo-{{ group.id }}"
     x-show="isGroupVisible('{{ group.id }}')"
     x-transition
     x-data="{ isDown: false, startX: 0, scrollLeftPos: 0 }">
    
    <!-- Cabeçalho do Trilho do Artista com Acabamento Godly -->
    <div class="flex items-center justify-between px-1">
        <div class="flex items-center gap-2.5">
            <div class="w-1.5 h-5 rounded-full bg-gradient-to-b from-pink-500 via-purple-500 to-indigo-600 shadow-[0_0_8px_rgba(244,114,182,0.35)]"></div>
            <h3 class="text-base sm:text-lg font-black text-slate-800 dark:text-cyber-silver tracking-tight">
                {{ group.name }}
            </h3>
            <span class="px-2.5 py-0.5 rounded-full text-[11px] font-mono tabular-nums font-bold bg-purple-100/80 dark:bg-cyber-elevated text-pink-700 dark:text-cyber-neon border border-purple-200/80 dark:border-white/10"
                  x-text="getGroupVisibleCount('{{ group.id }}') + ' CEG' + (getGroupVisibleCount('{{ group.id }}') === 1 ? '' : 's')">
                {{ group.cegs_count }} CEG{{ group.cegs_count|pluralize }}
            </span>
        </div>

        <!-- Ações do Cabeçalho: Setas de Navegação (Desktop) + Foco no Grupo -->
        <div class="flex items-center gap-2">
            <!-- Botões de Navegação Horizontal por Setas (Desktop) -->
            <div class="hidden sm:flex items-center gap-1.5"
                 x-show="getGroupVisibleCount('{{ group.id }}') > 1">
                <button type="button"
                        @click="$refs.carouselTrack.scrollBy({ left: -360, behavior: 'smooth' })"
                        class="p-2 rounded-full bg-white/90 dark:bg-cyber-surface/90 border border-purple-100/80 dark:border-white/10 hover:border-pink-300 dark:hover:border-cyber-neon/40 text-slate-600 dark:text-cyber-silver hover:text-pink-600 dark:hover:text-cyber-neon transition shadow-2xs hover:shadow-xs cursor-pointer active:scale-90"
                        title="Ver CEGs anteriores">
                    <i data-lucide="chevron-left" class="w-4 h-4" stroke-width="1.75"></i>
                </button>
                <button type="button"
                        @click="$refs.carouselTrack.scrollBy({ left: 360, behavior: 'smooth' })"
                        class="p-2 rounded-full bg-white/90 dark:bg-cyber-surface/90 border border-purple-100/80 dark:border-white/10 hover:border-pink-300 dark:hover:border-cyber-neon/40 text-slate-600 dark:text-cyber-silver hover:text-pink-600 dark:hover:text-cyber-neon transition shadow-2xs hover:shadow-xs cursor-pointer active:scale-90"
                        title="Ver próximas CEGs">
                    <i data-lucide="chevron-right" class="w-4 h-4" stroke-width="1.75"></i>
                </button>
            </div>

            <!-- Botão em Pílula para alternar foco apenas neste grupo -->
            <button type="button"
                    @click="selectedGroup = (selectedGroup == '{{ group.id }}' ? '' : '{{ group.id }}'); resetTracksScroll()"
                    class="px-2.5 py-1 rounded-full text-xs font-bold text-pink-600 dark:text-cyber-neon bg-pink-50/70 dark:bg-cyber-elevated hover:bg-pink-100 dark:hover:bg-purple-900/30 border border-pink-200/60 dark:border-white/10 transition-all flex items-center gap-1 cursor-pointer">
                <span x-text="selectedGroup == '{{ group.id }}' ? 'Ver todos' : 'Focar grupo'">Focar grupo</span>
                <i data-lucide="arrow-right" class="w-3.5 h-3.5" x-show="selectedGroup != '{{ group.id }}'" stroke-width="1.75"></i>
            </button>
        </div>
    </div>

    <!-- Trilho com Efeito Peek-a-boo (Suporta Touch, Wheel do Mouse e Arrastar) -->
    <div x-ref="carouselTrack"
         data-carousel-track
         @wheel.prevent="$refs.carouselTrack.scrollLeft += ($event.deltaY || $event.deltaX)"
         @mousedown="isDown = true; startX = $event.pageX - $refs.carouselTrack.offsetLeft; scrollLeftPos = $refs.carouselTrack.scrollLeft"
         @mouseleave="isDown = false"
         @mouseup="isDown = false"
         @mousemove="if(!isDown) return; $event.preventDefault(); const x = $event.pageX - $refs.carouselTrack.offsetLeft; const walk = (x - startX) * 1.5; $refs.carouselTrack.scrollLeft = scrollLeftPos - walk;"
         class="flex gap-4 overflow-x-auto snap-x snap-mandatory scroll-smooth no-scrollbar py-2 px-1 cursor-grab active:cursor-grabbing select-none">
        {% for ceg in active_cegs %}
            {% if ceg.era.group.id == group.id %}
                <div class="ceg-card-item w-[72vw] sm:w-64 flex-shrink-0 snap-start"
                     data-price="{{ ceg.min_price_str }}"
                     data-vagas="{{ ceg.available_slots_count|default:0 }}"
                     data-index="{{ forloop.counter0 }}"
                     x-show="isCegVisible({{ ceg.id }})"
                     x-transition>
                    {% include 'cegs/partials/_home_ceg_card.html' %}
                </div>
            {% endif %}
        {% endfor %}
    </div>
</div>
