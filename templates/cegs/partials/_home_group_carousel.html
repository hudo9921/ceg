<!-- Trilho / Carrossel Horizontal por Grupo (Estilo Deezer / Peek-a-boo com Navegação Desktop) -->
<div class="space-y-3"
     id="grupo-{{ group.id }}"
     x-data="{ isDown: false, startX: 0, scrollLeftPos: 0 }">
    
    <!-- Cabeçalho do Trilho do Artista -->
    <div class="flex items-center justify-between px-1">
        <div class="flex items-center gap-2.5">
            <div class="w-1.5 h-4.5 rounded-full bg-gradient-to-b from-pink-500 to-purple-600"></div>
            <h3 class="text-base sm:text-lg font-black text-slate-800 dark:text-cyber-silver tracking-tight">
                {{ group.name }}
            </h3>
            <span class="px-2 py-0.5 rounded-full text-[11px] font-mono font-bold bg-purple-100/80 dark:bg-cyber-elevated text-pink-700 dark:text-cyber-neon border border-purple-200/80 dark:border-white/10">
                {{ group.cegs_count }} CEG{{ group.cegs_count|pluralize }}
            </span>
        </div>

        <!-- Ações do Cabeçalho: Setas de Navegação (Desktop) + Ver Todas -->
        <div class="flex items-center gap-2">
            <!-- Botões de Navegação Horizontal por Setas (Desktop) -->
            <div class="hidden sm:flex items-center gap-1">
                <button type="button"
                        @click="$refs.carouselTrack.scrollBy({ left: -360, behavior: 'smooth' })"
                        class="p-1.5 rounded-full bg-white dark:bg-cyber-surface border border-purple-100 dark:border-white/10 hover:bg-purple-50 dark:hover:bg-cyber-elevated text-slate-600 dark:text-cyber-silver transition shadow-2xs cursor-pointer active:scale-95"
                        title="Ver CEGs anteriores">
                    <i data-lucide="chevron-left" class="w-4 h-4"></i>
                </button>
                <button type="button"
                        @click="$refs.carouselTrack.scrollBy({ left: 360, behavior: 'smooth' })"
                        class="p-1.5 rounded-full bg-white dark:bg-cyber-surface border border-purple-100 dark:border-white/10 hover:bg-purple-50 dark:hover:bg-cyber-elevated text-slate-600 dark:text-cyber-silver transition shadow-2xs cursor-pointer active:scale-95"
                        title="Ver próximas CEGs">
                    <i data-lucide="chevron-right" class="w-4 h-4"></i>
                </button>
            </div>

            <!-- Botão para filtrar apenas este grupo e ver grade completa -->
            <button type="button"
                    @click="selectedGroup = '{{ group.id }}'"
                    class="ml-1 text-xs font-bold text-pink-600 dark:text-cyber-neon hover:underline flex items-center gap-1 cursor-pointer">
                <span>Ver todas</span>
                <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
            </button>
        </div>
    </div>

    <!-- Trilho com Efeito Peek-a-boo (Suporta Touch, Wheel do Mouse e Arrastar) -->
    <div x-ref="carouselTrack"
         @wheel.prevent="$refs.carouselTrack.scrollLeft += ($event.deltaY || $event.deltaX)"
         @mousedown="isDown = true; startX = $event.pageX - $refs.carouselTrack.offsetLeft; scrollLeftPos = $refs.carouselTrack.scrollLeft"
         @mouseleave="isDown = false"
         @mouseup="isDown = false"
         @mousemove="if(!isDown) return; $event.preventDefault(); const x = $event.pageX - $refs.carouselTrack.offsetLeft; const walk = (x - startX) * 1.5; $refs.carouselTrack.scrollLeft = scrollLeftPos - walk;"
         class="flex gap-4 overflow-x-auto snap-x snap-mandatory scroll-smooth no-scrollbar py-2 px-1 cursor-grab active:cursor-grabbing select-none">
        {% for ceg in active_cegs %}
            {% if ceg.era.group.id == group.id %}
                <div class="w-[72vw] sm:w-64 flex-shrink-0 snap-start">
                    {% include 'cegs/partials/_home_ceg_card.html' %}
                </div>
            {% endif %}
        {% endfor %}
    </div>
</div>
