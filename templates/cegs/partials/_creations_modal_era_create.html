<!-- MODAL 2: CADASTRAR ERA NOVA (POP-UP) -->
<div x-show="activeModal === 'era'" x-cloak
     class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-sm"
     @click.self="closeModal()">
    <div class="bg-white dark:bg-[#14121B] w-full max-w-lg rounded-3xl shadow-2xl border border-purple-100 dark:border-white/10 overflow-hidden flex flex-col max-h-[90vh]">
        
        <!-- Header do Modal -->
        <div class="p-5 border-b border-slate-200/80 dark:border-white/10 flex items-center justify-between bg-gradient-to-r from-indigo-50 via-purple-50 to-white dark:from-indigo-950/30 dark:via-purple-950/30 dark:to-[#14121B]">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl bg-indigo-100 dark:bg-indigo-950/50 text-indigo-600 dark:text-indigo-400 flex items-center justify-center border border-indigo-200/50 dark:border-indigo-500/20">
                    <i data-lucide="disc" class="w-5 h-5"></i>
                </div>
                <div>
                    <h3 class="text-base font-black text-slate-900 dark:text-white">Cadastrar Era Nova</h3>
                    <p class="text-[11px] text-slate-500 dark:text-cyber-silver">Vincule o comeback (álbum/single) ao grupo.</p>
                </div>
            </div>
            <button type="button" @click="closeModal()" class="w-8 h-8 rounded-xl flex items-center justify-center text-slate-400 hover:text-slate-700 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-white/10 transition cursor-pointer">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
        </div>

        <form id="create_era_form" action="{% url 'create_era' %}" method="POST" enctype="multipart/form-data" class="p-6 space-y-4 overflow-y-auto">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">Grupo / Solista *</label>
                <select name="group_id" required
                        class="w-full bg-slate-50 dark:bg-cyber-elevated border border-slate-200 dark:border-white/10 rounded-xl px-3.5 py-2.5 text-sm font-bold text-slate-900 dark:text-white focus:ring-2 focus:ring-indigo-500 focus:bg-white dark:focus:bg-cyber-surface transition">
                    <option value="">-- Selecione o Grupo --</option>
                    {% for g in groups %}
                        <option value="{{ g.id }}">{{ g.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">Nome da Era / Comeback *</label>
                <input type="text" name="name" required
                       placeholder="Ex: CRAZY, With YOU-th, Armageddon, ATE"
                       class="w-full bg-slate-50 dark:bg-cyber-elevated border border-slate-200 dark:border-white/10 rounded-xl px-3.5 py-2.5 text-sm font-bold text-slate-900 dark:text-white focus:ring-2 focus:ring-indigo-500 focus:bg-white dark:focus:bg-cyber-surface transition">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">Data de Lançamento (opcional)</label>
                <input type="date" name="release_date"
                       class="w-full bg-slate-50 dark:bg-cyber-elevated border border-slate-200 dark:border-white/10 rounded-xl px-3.5 py-2.5 text-sm text-slate-900 dark:text-white focus:ring-2 focus:ring-indigo-500 focus:bg-white dark:focus:bg-cyber-surface transition">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">Banner Promocional da Era</label>

                <!-- Preview -->
                <div x-show="eraBannerPreview" class="relative rounded-2xl overflow-hidden border border-indigo-200 dark:border-white/10 h-36 bg-slate-950 flex items-center justify-center group mb-2">
                    <img :src="eraBannerPreview" alt="" class="absolute inset-0 w-full h-full object-cover blur-xl opacity-40 scale-110 pointer-events-none">
                    <img :src="eraBannerPreview" alt="Banner Preview" class="relative z-10 max-h-36 w-auto max-w-full object-contain mx-auto">
                    <button type="button" @click="clearEraBanner()"
                            class="absolute top-2 right-2 z-20 px-2.5 py-1 bg-rose-600/90 hover:bg-rose-700 text-white rounded-lg font-bold text-[10px] shadow transition flex items-center gap-1 cursor-pointer">
                        <i data-lucide="trash-2" class="w-3 h-3"></i>
                        <span>Remover</span>
                    </button>
                </div>

                <!-- Dropzone Interativa: PC, Arrastar ou Ctrl+V -->
                <div @dragover.prevent="eraDragOver = true"
                     @dragleave.prevent="eraDragOver = false"
                     @drop.prevent="eraDragOver = false; if ($event.dataTransfer.files[0]) handleEraBannerFile($event.dataTransfer.files[0])"
                     @click="$refs.eraFileInput.click()"
                     :class="eraDragOver ? 'border-indigo-500 bg-indigo-50 dark:bg-indigo-950/30 ring-2 ring-indigo-300' : 'border-purple-100/80 dark:border-white/10 bg-slate-50/70 dark:bg-white/5 hover:bg-indigo-50/50 dark:hover:bg-white/10 hover:border-indigo-300'"
                     class="border-2 border-dashed rounded-2xl p-4 text-center cursor-pointer transition flex flex-col items-center justify-center gap-1.5 mb-2 select-none">
                    <i data-lucide="image" class="w-6 h-6 text-indigo-400"></i>
                    <p class="text-xs font-bold text-slate-800 dark:text-slate-200">
                        Clique para escolher do PC ou dê <kbd class="px-1.5 py-0.5 bg-indigo-100 dark:bg-indigo-950/60 text-indigo-700 dark:text-indigo-300 border border-indigo-200 dark:border-white/10 rounded font-black text-[10px]">Ctrl + V</kbd>
                    </p>
                    <p class="text-[10px] text-slate-400">Arraste o banner para cá</p>
                </div>

                <input type="file" x-ref="eraFileInput" name="banner_file" accept="image/*" class="hidden"
                       @change="if ($event.target.files[0]) handleEraBannerFile($event.target.files[0])">
                <input type="hidden" name="banner_base64" :value="eraBannerBase64">

                <input type="text" name="banner_url" x-model="eraBannerUrl"
                       @input="eraBannerPreview = $event.target.value; eraBannerBase64 = ''"
                       placeholder="Ou cole a URL direta do banner (https://...)"
                       class="w-full bg-slate-50 dark:bg-cyber-elevated border border-slate-200 dark:border-white/10 rounded-xl px-3.5 py-2 text-xs text-slate-900 dark:text-white focus:ring-2 focus:ring-indigo-500 focus:bg-white dark:focus:bg-cyber-surface transition">
            </div>

            <!-- Cor Tema da Era -->
            <div>
                <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5 flex items-center justify-between">
                    <span class="flex items-center gap-1.5">
                        <i data-lucide="palette" class="w-3.5 h-3.5 text-indigo-400"></i>
                        <span>Cor Tema da Era (Opcional)</span>
                    </span>
                    <span class="text-[10px] text-slate-400 font-normal">Detectada da foto ou herdada do grupo se deixar vazio</span>
                </label>
                <div class="flex items-center gap-2">
                    <input type="color" :value="eraColorHex || '#6366F1'" @input="eraColorHex = $event.target.value"
                           class="w-9 h-9 rounded-xl border border-slate-200 dark:border-white/10 cursor-pointer p-0.5 bg-white dark:bg-cyber-elevated shrink-0">
                    <input type="text" name="color_hex" x-model="eraColorHex" placeholder="Ex: #EC4899 (ou deixe vazio para automático)"
                           class="flex-1 bg-slate-50 dark:bg-cyber-elevated border border-slate-200 dark:border-white/10 rounded-xl px-3.5 py-2 text-xs font-mono font-bold uppercase text-slate-900 dark:text-white focus:ring-2 focus:ring-indigo-500 focus:bg-white dark:focus:bg-cyber-surface transition">
                    <button type="button" x-show="eraColorHex" @click="eraColorHex = ''"
                            class="px-2.5 py-2 bg-slate-100 dark:bg-white/10 hover:bg-slate-200 dark:hover:bg-white/20 text-slate-600 dark:text-slate-300 rounded-xl text-xs font-bold transition"
                            title="Redefinir para detecção automática">
                        Auto
                    </button>
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">Descrição / Notas do Comeback (opcional)</label>
                <textarea name="description" rows="2"
                          placeholder="Ex: 4º Mini Álbum com versões Compact e Weverse."
                          class="w-full bg-slate-50 dark:bg-cyber-elevated border border-slate-200 dark:border-white/10 rounded-xl p-3 text-xs sm:text-sm text-slate-900 dark:text-white focus:ring-2 focus:ring-indigo-500 focus:bg-white dark:focus:bg-cyber-surface transition"></textarea>
            </div>

            <div class="pt-3 border-t border-slate-100 dark:border-white/10 flex justify-end gap-2">
                <button type="button" @click="closeModal()"
                        class="px-4 py-2 bg-slate-100 dark:bg-white/10 hover:bg-slate-200 dark:hover:bg-white/20 text-slate-700 dark:text-cyber-silver font-bold text-xs rounded-xl transition cursor-pointer">
                    Cancelar
                </button>
                <button type="submit"
                        class="px-6 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-black text-xs rounded-xl shadow transition cursor-pointer flex items-center gap-1.5 hover:scale-[1.02]">
                    <i data-lucide="check" class="w-3.5 h-3.5"></i>
                    <span>Salvar Era</span>
                </button>
            </div>
        </form>
    </div>
</div>
