<!-- MODAL RÁPIDO DE NOVO TIPO DE ITEM -->
<div x-show="newTipoModalOpen" x-cloak
     class="fixed inset-0 z-[9999] flex items-center justify-center p-4 bg-slate-900/80 backdrop-blur-sm"
     style="z-index: 99999;"
     @keydown.escape.window="newTipoModalOpen = false">
    <div class="bg-white dark:bg-[#14121B] rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-100 dark:border-white/10 space-y-4"
         @click.away="newTipoModalOpen = false">
        <div class="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-white/5">
            <div class="flex items-center gap-2">
                <i data-lucide="tag" class="w-5 h-5 text-purple-600"></i>
                <h3 class="font-black text-slate-900 dark:text-white text-base">Novo Tipo de Item</h3>
            </div>
            <button type="button" @click="newTipoModalOpen = false" class="text-slate-400 hover:text-slate-700 dark:hover:text-white text-lg font-bold">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
        </div>

        <div class="space-y-3">
            <div>
                <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">Nome do Tipo *</label>
                <input type="text" x-model="newTipoNome" placeholder="Ex: Labubu, Camisa, Pôster, Inclusão..."
                       class="w-full bg-slate-50 dark:bg-white/5 border border-slate-200 dark:border-white/10 rounded-xl px-3 py-2 text-xs font-bold text-slate-900 dark:text-white focus:ring-2 focus:ring-purple-500">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">Descrição (Opcional)</label>
                <input type="text" x-model="newTipoDescricao" placeholder="Ex: Roupas, colecionáveis e miniaturas"
                       class="w-full bg-slate-50 dark:bg-white/5 border border-slate-200 dark:border-white/10 rounded-xl px-3 py-2 text-xs text-slate-700 dark:text-slate-300 focus:ring-2 focus:ring-purple-500">
            </div>
        </div>

        <div class="flex items-center justify-end gap-2 pt-3 border-t border-slate-100 dark:border-white/5">
            <button type="button" @click="newTipoModalOpen = false"
                    class="px-4 py-2 text-xs font-bold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-white/10 rounded-xl transition">
                Cancelar
            </button>
            <button type="button" @click="submitNewTipo()"
                    class="px-5 py-2 text-xs font-bold text-white bg-purple-600 hover:bg-purple-700 rounded-xl shadow-md shadow-purple-500/20 transition cursor-pointer">
                Salvar Tipo
            </button>
        </div>
    </div>
</div>
