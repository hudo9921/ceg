<!-- HEADER HERO & BARRA DE FILTROS (GRUPO E ERA) -->
<div class="bg-gradient-to-br from-slate-900 via-purple-950 to-slate-900 rounded-3xl p-6 sm:p-8 text-white shadow-xl space-y-6">
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
        <div>
            <span class="px-3 py-1 bg-pink-500/20 border border-pink-400/30 text-pink-300 font-bold rounded-full text-xs uppercase tracking-wider inline-flex items-center gap-1.5 mb-2">
                <i data-lucide="settings" class="w-3.5 h-3.5"></i>
                <span>Gestão Operacional de CEGs</span>
            </span>
            <h1 class="text-2xl sm:text-3xl font-black tracking-tight text-white">
                Status, Completude e Valores das CEGs
            </h1>
            <p class="text-slate-300 text-xs sm:text-sm mt-1 max-w-2xl">
                Monitore o preenchimento de cada Set, veja os photocards exatos que faltam para fechar e acompanhe pendências de frete internacional e taxas alfandegárias.
            </p>
        </div>

        <!-- Botão Limpar Filtros -->
        <button type="button"
                x-show="hasActiveFilters"
                x-cloak
                @click="clearFilters()"
                class="px-3 py-1.5 bg-white/10 hover:bg-white/20 text-white rounded-xl text-xs font-bold transition flex items-center gap-1.5 cursor-pointer">
            <i data-lucide="x" class="w-3.5 h-3.5"></i>
            <span>Limpar Filtros</span>
        </button>
    </div>

    <!-- Formulário de Filtros -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 pt-4 border-t border-white/10">
        <!-- Busca Textual Rápida por Digitação -->
        <div class="space-y-1.5 lg:col-span-2">
            <label class="block text-[11px] font-bold text-slate-300 uppercase tracking-wider flex items-center gap-1.5">
                <i data-lucide="search" class="w-3.5 h-3.5 text-pink-400"></i>
                <span>Buscar CEG, Photocard ou Era</span>
            </label>
            <div class="relative">
                <input type="text"
                       x-model="searchQuery"
                       @input.debounce.150ms="onFilterChange()"
                       @keydown.enter.prevent
                       placeholder="Digite para buscar: ex. Weverse, Pureflow, Sakura, PF-32..."
                       class="w-full pl-9 pr-8 py-2 bg-white/10 backdrop-blur-md border border-white/20 rounded-xl text-xs font-bold text-white placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-pink-400 transition">
                <i data-lucide="search" class="w-3.5 h-3.5 absolute left-3 top-2.5 text-slate-400 pointer-events-none"></i>
                <button type="button"
                        x-show="searchQuery"
                        x-cloak
                        @click="searchQuery = ''; onFilterChange();"
                        class="absolute right-2.5 top-2 text-xs text-slate-400 hover:text-white transition cursor-pointer">
                    ✕
                </button>
            </div>
        </div>

        <!-- Filtro por Grupo -->
        <div class="space-y-1.5">
            <label class="block text-[11px] font-bold text-slate-300 uppercase tracking-wider flex items-center gap-1.5">
                <i data-lucide="mic" class="w-3.5 h-3.5 text-purple-400"></i>
                <span>Grupo K-pop</span>
            </label>
            <select x-model="selectedGroup"
                    @change="onGroupChange()"
                    class="w-full px-3 py-2 bg-white/10 backdrop-blur-md border border-white/20 rounded-xl text-xs font-bold text-white focus:outline-none focus:ring-2 focus:ring-pink-400 cursor-pointer">
                <option value="" class="bg-slate-900 text-white">Todos os Grupos</option>
                <template x-for="g in filterOptions.groups" :key="g.id">
                    <option :value="g.id" x-text="g.name" class="bg-slate-900 text-white" :selected="String(g.id) === selectedGroup"></option>
                </template>
            </select>
        </div>

        <!-- Filtro por Era -->
        <div class="space-y-1.5">
            <label class="block text-[11px] font-bold text-slate-300 uppercase tracking-wider flex items-center gap-1.5">
                <i data-lucide="disc" class="w-3.5 h-3.5 text-indigo-400"></i>
                <span>Era / Álbum</span>
            </label>
            <select x-model="selectedEra"
                    @change="onFilterChange()"
                    class="w-full px-3 py-2 bg-white/10 backdrop-blur-md border border-white/20 rounded-xl text-xs font-bold text-white focus:outline-none focus:ring-2 focus:ring-pink-400 cursor-pointer">
                <option value="" class="bg-slate-900 text-white">Todas as Eras</option>
                <template x-for="e in availableEras" :key="e.id">
                    <option :value="e.id" x-text="e.name + (selectedGroup ? '' : ' (' + e.group_name + ')')" class="bg-slate-900 text-white" :selected="String(e.id) === selectedEra"></option>
                </template>
            </select>
        </div>
    </div>

    <!-- Barra de Status dos Filtros Ativos -->
    <div class="flex flex-wrap items-center justify-between gap-2 pt-2 text-xs border-t border-white/10 text-slate-300">
        <div class="flex items-center gap-2 flex-wrap">
            <span>Exibindo dados de:</span>
            <span class="font-black text-pink-300">
                <span x-text="currentGroupName"></span>
                <template x-if="currentEraName">
                    <span x-text="' • ' + currentEraName"></span>
                </template>
            </span>
            <template x-if="searchQuery">
                <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md bg-pink-500/20 text-pink-300 border border-pink-500/30 text-[11px] font-bold">
                    <span>Texto:</span>
                    <b x-text="'&ldquo;' + searchQuery + '&rdquo;'"></b>
                    <button type="button" @click="searchQuery = ''; onFilterChange();" class="text-white hover:text-pink-200 ml-1 cursor-pointer">✕</button>
                </span>
            </template>
        </div>

        <button type="button"
                x-show="hasActiveFilters"
                x-cloak
                @click="clearFilters()"
                class="px-3 py-1 bg-white/10 hover:bg-white/20 text-white rounded-xl text-xs font-bold transition flex items-center gap-1.5 cursor-pointer">
            <i data-lucide="x" class="w-3.5 h-3.5"></i>
            <span>Limpar Todos os Filtros</span>
        </button>
    </div>
</div>
