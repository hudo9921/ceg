<!-- 1. FOTO / BANNER COM DROPZONE E CTRL+V (MODAL CEG) -->
<div class="p-3.5 bg-slate-50 dark:bg-white/5 border border-slate-200 dark:border-white/10 rounded-2xl space-y-2.5">
    <div class="flex items-center justify-between">
        <label class="text-xs font-bold text-slate-800 dark:text-slate-200 flex items-center gap-1.5">
            <i data-lucide="camera" class="w-3.5 h-3.5"></i>
            <span>Foto de Capa / Banner da CEG</span>
        </label>
        <span class="text-[10px] text-slate-500 dark:text-slate-400 font-medium">Ctrl+V, Arquivo ou URL (Máx 5MB)</span>
    </div>

    <!-- Preview -->
    <div x-show="cegBannerPreview" class="relative rounded-xl overflow-hidden border border-slate-300 dark:border-white/10 h-36 bg-slate-950 flex items-center justify-center shadow-inner">
        <img :src="cegBannerPreview" alt="" class="absolute inset-0 w-full h-full object-cover blur-lg opacity-40 scale-110 pointer-events-none select-none">
        <img :src="cegBannerPreview" alt="Banner da CEG" class="relative z-10 max-h-36 w-auto max-w-full object-contain mx-auto select-none">
        <button type="button" @click="clearCegBanner()"
                class="absolute top-2 right-2 z-20 px-2 py-1 bg-rose-600/90 hover:bg-rose-700 text-white rounded-lg font-bold text-[10px] shadow transition flex items-center gap-1 cursor-pointer">
            <i data-lucide="trash-2" class="w-3 h-3"></i>
            <span>Remover</span>
        </button>
    </div>

    <!-- Dropzone -->
    <div x-show="!cegBannerPreview"
         class="relative border-2 border-dashed rounded-xl p-3 text-center transition-all bg-white dark:bg-slate-800 cursor-pointer select-none"
         :class="cegDragOver ? 'border-purple-500 bg-purple-50/40 dark:bg-purple-950/20 ring-2 ring-purple-300' : 'border-slate-300 dark:border-white/10 hover:border-purple-300'"
         @dragover.prevent="cegDragOver = true"
         @dragleave.prevent="cegDragOver = false"
         @drop.prevent="cegDragOver = false; handleCegBannerFile($event)"
         @click="document.getElementById('status_ceg_banner_file').click()">
        <div class="space-y-1 py-1">
            <i data-lucide="clipboard" class="w-6 h-6 mx-auto text-purple-600"></i>
            <p class="text-xs font-bold text-slate-800 dark:text-slate-200">
                Dê <kbd class="px-1.5 py-0.5 bg-slate-100 dark:bg-white/10 border border-slate-300 dark:border-white/20 rounded text-purple-700 dark:text-purple-300 font-black">Ctrl + V</kbd> nesta tela ou clique para selecionar
            </p>
            <p class="text-[10px] text-slate-500 dark:text-slate-400">Arraste uma foto ou clique para escolher</p>
        </div>
    </div>

    <!-- Input de arquivo invisível -->
    <input type="file" id="status_ceg_banner_file" name="banner_file" accept="image/*" class="hidden"
           @change="handleCegBannerFile($event)">
    <input type="hidden" name="banner_base64" :value="cegBannerBase64">

    <!-- Alerta de erro de foto -->
    <div x-show="cegBannerError" x-cloak class="p-2 bg-rose-50 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-800/40 text-rose-800 dark:text-rose-200 rounded-lg text-xs font-bold flex items-center gap-1.5">
        <i data-lucide="alert-triangle" class="w-3.5 h-3.5 text-rose-600"></i>
        <span x-text="cegBannerError"></span>
    </div>

    <!-- Link Direto / URL -->
    <div>
        <label class="block text-[10px] font-bold text-slate-600 dark:text-slate-400 mb-0.5">Ou cole o link direto da imagem:</label>
        <input type="text" name="banner_url" x-model="cegBannerUrl" @input="handleCegBannerUrl()"
               placeholder="https://exemplo.com/banner-ceg.jpg"
               class="w-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-white/10 rounded-xl px-3 py-1.5 text-xs text-slate-800 dark:text-slate-200 focus:ring-2 focus:ring-purple-500">
    </div>
</div>
