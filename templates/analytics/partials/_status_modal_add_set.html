<!-- MODAL ADICIONAR NOVO SET -->
<div x-show="addSetModalOpen" x-cloak
     class="fixed inset-0 z-[9999] flex items-center justify-center p-4 bg-slate-900/80 backdrop-blur-sm"
     style="z-index: 99999;"
     @keydown.escape.window="closeAddSetModal()">
    <div class="bg-white dark:bg-[#14121B] rounded-2xl max-w-md w-full shadow-2xl border border-slate-100 dark:border-white/10 overflow-hidden"
         @click.away="closeAddSetModal()">
        <form action="{% url 'create_set' %}" method="POST" class="flex flex-col">
            {% csrf_token %}
            <input type="hidden" name="next" value="/analytics/cegs-status/">

            <!-- Header -->
            <div class="p-5 border-b border-slate-100 dark:border-white/5 bg-slate-50/50 dark:bg-white/5 flex items-center justify-between">
                <div class="flex items-center gap-2.5">
                    <div class="w-9 h-9 rounded-xl bg-amber-100 dark:bg-amber-950/60 text-amber-700 dark:text-amber-300 flex items-center justify-center text-lg font-black shadow-xs">
                        <i data-lucide="plus" class="w-5 h-5"></i>
                    </div>
                    <div>
                        <h3 class="font-black text-slate-900 dark:text-white text-base">Adicionar Novo Set</h3>
                        <p class="text-xs text-slate-500 dark:text-slate-400">Cria um novo set com slots físicos para reservas</p>
                    </div>
                </div>
                <button type="button" @click="closeAddSetModal()" class="text-slate-400 hover:text-slate-700 dark:hover:text-white text-lg font-bold cursor-pointer">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>

            <!-- Body -->
            <div class="p-5 space-y-4 text-xs">
                <!-- CEG Alvo -->
                <div>
                    <label class="block font-bold text-slate-700 dark:text-slate-300 mb-1">CEG de Destino *</label>
                    <select name="ceg_id" x-model="addSetCegId" @change="onAddSetCegChange()" required
                            class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-white/10 rounded-xl px-3 py-2 text-xs font-bold text-slate-900 dark:text-white focus:ring-2 focus:ring-amber-500">
                        <option value="">Selecione uma CEG...</option>
                        <template x-for="c in cegsOverview" :key="c.ceg_id">
                            <option :value="c.ceg_id" x-text="(c.group_name ? c.group_name + ' — ' : '') + c.clean_title + ' (' + c.total_sets + ' set' + (c.total_sets > 1 ? 's' : '') + ')'"></option>
                        </template>
                    </select>
                </div>

                <!-- Número do Set -->
                <div>
                    <label class="block font-bold text-slate-700 dark:text-slate-300 mb-1">
                        Número do Set *
                        <span class="text-slate-400 font-normal ml-1">(Calculado automaticamente)</span>
                    </label>
                    <div class="relative">
                        <span class="absolute left-3 top-2 font-black text-slate-400">#</span>
                        <input type="number" name="set_number" x-model="addSetNumber" min="1" max="99" required
                               placeholder="Ex: 2"
                               class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-white/10 rounded-xl pl-7 pr-3 py-2 text-xs font-black text-slate-900 dark:text-white focus:ring-2 focus:ring-amber-500">
                    </div>
                </div>

                <!-- Observações -->
                <div>
                    <label class="block font-bold text-slate-700 dark:text-slate-300 mb-1">Observações / Notas Internas</label>
                    <input type="text" name="notes" x-model="addSetNotes" placeholder="Ex: Aberto para fila de espera, prioridade..."
                           class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-white/10 rounded-xl px-3 py-2 text-xs text-slate-800 dark:text-slate-200 focus:ring-2 focus:ring-amber-500">
                </div>

                <!-- Ativo -->
                <label class="flex items-center gap-2 cursor-pointer pt-1">
                    <input type="checkbox" name="is_active" x-model="addSetIsActive" class="rounded text-amber-600 focus:ring-amber-500">
                    <span class="font-bold text-slate-800 dark:text-slate-200">Set Ativo para reservas imediatas</span>
                </label>

                <div class="p-3 bg-amber-50/70 dark:bg-amber-950/20 border border-amber-200/80 dark:border-amber-800/40 rounded-xl text-amber-900 dark:text-amber-200 text-[11px] leading-relaxed flex items-start gap-2">
                    <i data-lucide="lightbulb" class="w-4 h-4 text-amber-600 flex-shrink-0 mt-0.5"></i>
                    <span>Se houver participantes na <strong>Lista de Espera</strong> dos photocards desta CEG, eles serão alocados <strong>automaticamente</strong> no novo set!</span>
                </div>
            </div>

            <!-- Footer -->
            <div class="p-4 border-t border-slate-100 dark:border-white/5 bg-slate-50/80 dark:bg-slate-900 flex items-center justify-end gap-2.5">
                <button type="button" @click="closeAddSetModal()"
                        class="px-4 py-2 text-xs font-bold text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-white/10 rounded-xl transition cursor-pointer">
                    Cancelar
                </button>
                <button type="submit"
                        class="px-5 py-2 text-xs font-black text-white bg-amber-600 hover:bg-amber-700 rounded-xl shadow-md shadow-amber-600/20 transition cursor-pointer flex items-center gap-1.5">
                    <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                    <span>Criar Set</span>
                </button>
            </div>
        </form>
    </div>
</div>
