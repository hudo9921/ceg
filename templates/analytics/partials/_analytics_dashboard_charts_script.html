<!-- Scripts do Chart.js para o Dashboard de Analytics -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const rawData = JSON.parse('{{ chart_data_json|escapejs }}');
        const isDark = document.documentElement.classList.contains('dark');
        const gridColor = isDark ? 'rgba(255, 255, 255, 0.06)' : '#f1f5f9';
        const tickColor = isDark ? '#94a3b8' : '#64748b';

        // 1. Gráfico de Fluxo de Vendas por Mês (Barras Empilhadas de Valor + Linha de Reservas)
        const ctxMonthly = document.getElementById('monthlySalesChart');
        if (ctxMonthly && rawData.monthly) {
            new Chart(ctxMonthly, {
                type: 'bar',
                data: {
                    labels: rawData.monthly.labels,
                    datasets: [
                        {
                            type: 'bar',
                            label: 'Faturado Pago (R$)',
                            data: rawData.monthly.paid,
                            backgroundColor: '#10b981', // emerald-500
                            borderRadius: 6,
                            stack: 'revenue',
                            yAxisID: 'yRevenue',
                        },
                        {
                            type: 'bar',
                            label: 'Falta Pagar (R$)',
                            data: rawData.monthly.pending,
                            backgroundColor: '#f59e0b', // amber-500
                            borderRadius: 6,
                            stack: 'revenue',
                            yAxisID: 'yRevenue',
                        },
                        {
                            type: 'line',
                            label: 'Qtd. de Reservas',
                            data: rawData.monthly.claims,
                            borderColor: '#db2777', // pink-600
                            backgroundColor: 'rgba(219, 39, 119, 0.1)',
                            borderWidth: 2,
                            pointRadius: 4,
                            pointBackgroundColor: '#db2777',
                            tension: 0.3,
                            yAxisID: 'yClaims',
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        mode: 'index',
                        intersect: false,
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: '#0f172a',
                            titleFont: { size: 12, weight: 'bold' },
                            bodyFont: { size: 11 },
                            padding: 10,
                            callbacks: {
                                label: function(context) {
                                    if (context.dataset.yAxisID === 'yRevenue') {
                                        return `${context.dataset.label}: R$ ${context.parsed.y.toFixed(2)}`;
                                    }
                                    return `${context.dataset.label}: ${context.parsed.y} claims`;
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            grid: { display: false },
                            ticks: { font: { size: 11 }, color: tickColor }
                        },
                        yRevenue: {
                            type: 'linear',
                            position: 'left',
                            beginAtZero: true,
                            grid: { color: gridColor },
                            ticks: {
                                font: { size: 11 },
                                color: tickColor,
                                callback: value => 'R$ ' + value
                            }
                        },
                        yClaims: {
                            type: 'linear',
                            position: 'right',
                            beginAtZero: true,
                            grid: { display: false },
                            ticks: {
                                font: { size: 11 },
                                color: tickColor,
                                stepSize: 1,
                                precision: 0
                            }
                        }
                    }
                }
            });
        }

        // 2. Gráfico de Composição Financeira (Donut)
        const ctxDonut = document.getElementById('financialDonutChart');
        if (ctxDonut && rawData.donut) {
            new Chart(ctxDonut, {
                type: 'doughnut',
                data: {
                    labels: rawData.donut.labels,
                    datasets: [{
                        data: rawData.donut.data,
                        backgroundColor: [
                            '#10b981', // Pago (Esmeralda)
                            '#f59e0b', // Pendente (Âmbar)
                            isDark ? '#475569' : '#cbd5e1', // Para Vender
                        ],
                        borderWidth: 2,
                        borderColor: isDark ? '#0f172a' : '#ffffff',
                        hoverOffset: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '68%',
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: '#0f172a',
                            callbacks: {
                                label: function(context) {
                                    const value = context.parsed || 0;
                                    const total = context.dataset.data.reduce((a, b) => a + b, 0);
                                    const pct = total > 0 ? ((value / total) * 100).toFixed(1) : 0;
                                    return ` ${context.label}: R$ ${value.toFixed(2)} (${pct}%)`;
                                }
                            }
                        }
                    }
                }
            });
        }
    });
</script>
