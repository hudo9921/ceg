{% comment %}
Cor da marca do GOM (C4): redefine os tokens de destaque de static/css/ui.css só nesta página.
`b` = Gom.brand (apps/goms/branding.py). O padrão da plataforma não inclui este arquivo.
{% endcomment %}
<style>
  :root:not(.dark) { --ui-accent: {{ b.light.accent }}; --ui-accent-text: {{ b.light.text }}; --ui-accent-soft: {{ b.light.soft }}; --ui-focus: {{ b.light.text }}; }
  :root:not(.dark) .ui-btn-primary { background: linear-gradient(180deg, color-mix(in srgb, {{ b.light.accent }} 82%, #fff) 0%, {{ b.light.accent }} 55%, color-mix(in srgb, {{ b.light.accent }} 86%, #000) 100%); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .45), 0 8px 18px -10px {{ b.light.accent }}; }
  html.dark { --ui-accent: {{ b.dark.accent }}; --ui-accent-text: {{ b.dark.text }}; --ui-accent-soft: {{ b.dark.soft }}; --ui-focus: {{ b.dark.text }}; --ui-seg-on: {{ b.dark.accent }}; --ui-accent-on-soft: {{ b.dark.text }}; --ui-holo: linear-gradient(90deg, {{ b.dark.accent }}, {{ b.dark.text }}); }
  html.dark .ui-btn-primary { box-shadow: 0 0 0 1px color-mix(in srgb, {{ b.dark.text }} 45%, transparent), 0 0 24px -8px {{ b.dark.accent }}; }
</style>
