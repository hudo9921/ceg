{% comment %}Logo do GOM (ou a inicial na cor de destaque). Parâmetros: g (Gom), size (classe Tailwind, ex.: "w-6 h-6").{% endcomment %}
{% if g.logo_url %}<img src="{{ g.logo_url|thumb }}" data-full="{{ g.logo_url }}" alt="" aria-hidden="true" loading="lazy" decoding="async" class="{{ size|default:'w-6 h-6' }} flex-none rounded-ui-pill object-cover bg-ui-surface-2">{% else %}<span class="{{ size|default:'w-6 h-6' }} flex-none rounded-ui-pill bg-ui-accent text-white font-bold flex items-center justify-center text-[0.75em]" aria-hidden="true">{{ g.name|slice:":1"|upper }}</span>{% endif %}
