<!-- Componente de Navegação Híbrida: Sidebar Deezer/Linear (Desktop) + Dock Flutuante Godly (Mobile) -->
<div x-data="{ sidebarCollapsed: true }" class="relative">
    
    <!-- 1. SIDEBAR VERTICAL RETRÁTIL (DESKTOP) -->
    <aside class="hidden lg:flex fixed left-0 top-0 bottom-0 z-50 flex-col justify-between transition-all duration-300 ease-in-out border-r border-purple-100/70 dark:border-white/10 bg-white/90 dark:bg-cyber-surface/90 backdrop-blur-xl shadow-sm"
           :class="sidebarCollapsed ? 'w-20' : 'w-64'"
           @mouseenter="sidebarCollapsed = false"
           @mouseleave="sidebarCollapsed = true">
        
        <!-- Topo da Sidebar: Brand & Logo -->
        <div class="p-4 flex items-center justify-between border-b border-purple-100/60 dark:border-white/5">
            <a href="{% url 'home' %}" class="flex items-center gap-3 overflow-hidden group">
                <span class="text-2xl filter drop-shadow-xs group-hover:scale-110 transition-transform flex-shrink-0">🐵</span>
                <div x-show="!sidebarCollapsed" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 -translate-x-2" x-transition:enter-end="opacity-100 translate-x-0" class="whitespace-nowrap">
                    <span class="font-black text-lg tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-pink-500 via-rose-400 to-sky-500 dark:from-cyber-neon dark:via-cyber-electric dark:to-cyber-ice">ValCegs</span>
                    <span class="text-[9px] font-mono uppercase tracking-widest text-slate-400 dark:text-slate-500 block">K-pop CEG Manager</span>
                </div>
            </a>
        </div>

        <!-- Links Principais de Navegação com Ícones Lucide -->
        <nav class="flex-1 py-6 px-3 space-y-1.5 overflow-y-auto">
            
            <!-- Link 1: Todas as CEGs (Compass) -->
            <a href="{% url 'home' %}"
               class="group flex items-center gap-3.5 px-3 py-2.5 rounded-2xl transition-all duration-200 relative {% if request.resolver_match.url_name == 'home' or request.path == '/' %}bg-purple-100/80 dark:bg-cyber-elevated text-pink-700 dark:text-cyber-neon font-black shadow-xs border border-purple-200/80 dark:border-white/10{% else %}text-slate-600 dark:text-cyber-silver hover:bg-slate-100/70 dark:hover:bg-cyber-elevated hover:text-pink-600 dark:hover:text-cyber-neon font-bold{% endif %}">
                <i data-lucide="compass" class="w-5 h-5 flex-shrink-0 transition-transform group-hover:scale-110"></i>
                <span x-show="!sidebarCollapsed" x-transition class="text-xs whitespace-nowrap">Catálogo de CEGs</span>
                <span x-show="sidebarCollapsed" class="sr-only">Todas as CEGs</span>
            </a>

            <!-- Link 2: Vitrine Pronta Entrega (Sparkles) -->
            <a href="{% url 'vitrine_list' %}"
               class="group flex items-center gap-3.5 px-3 py-2.5 rounded-2xl transition-all duration-200 relative {% if 'vitrine' in request.path %}bg-purple-100/80 dark:bg-cyber-elevated text-pink-700 dark:text-cyber-neon font-black shadow-xs border border-purple-200/80 dark:border-white/10{% else %}text-slate-600 dark:text-cyber-silver hover:bg-slate-100/70 dark:hover:bg-cyber-elevated hover:text-pink-600 dark:hover:text-cyber-neon font-bold{% endif %}">
                <i data-lucide="sparkles" class="w-5 h-5 flex-shrink-0 transition-transform group-hover:scale-110"></i>
                <span x-show="!sidebarCollapsed" x-transition class="text-xs whitespace-nowrap">Vitrine Pronta Entrega</span>
                <span x-show="sidebarCollapsed" class="sr-only">Vitrine</span>
            </a>

            <!-- Link 3: Minhas Compras / Painel (ShoppingBag) -->
            <a href="{% url 'my_claims' %}"
               class="group flex items-center gap-3.5 px-3 py-2.5 rounded-2xl transition-all duration-200 relative {% if 'me' in request.path and not 'caixinha' in request.GET.tab %}bg-purple-100/80 dark:bg-cyber-elevated text-pink-700 dark:text-cyber-neon font-black shadow-xs border border-purple-200/80 dark:border-white/10{% else %}text-slate-600 dark:text-cyber-silver hover:bg-slate-100/70 dark:hover:bg-cyber-elevated hover:text-pink-600 dark:hover:text-cyber-neon font-bold{% endif %}">
                <i data-lucide="shopping-bag" class="w-5 h-5 flex-shrink-0 transition-transform group-hover:scale-110"></i>
                <span x-show="!sidebarCollapsed" x-transition class="text-xs whitespace-nowrap">Minhas Reservas</span>
                <span x-show="sidebarCollapsed" class="sr-only">Minhas Compras</span>
            </a>

            <!-- Link 4: Minha Caixinha / Envio Nacional (Boxes) -->
            <a href="{% url 'my_claims' %}?tab=caixinha"
               class="group flex items-center gap-3.5 px-3 py-2.5 rounded-2xl transition-all duration-200 relative {% if request.GET.tab == 'caixinha' %}bg-purple-100/80 dark:bg-cyber-elevated text-pink-700 dark:text-cyber-neon font-black shadow-xs border border-purple-200/80 dark:border-white/10{% else %}text-slate-600 dark:text-cyber-silver hover:bg-slate-100/70 dark:hover:bg-cyber-elevated hover:text-pink-600 dark:hover:text-cyber-neon font-bold{% endif %}">
                <i data-lucide="boxes" class="w-5 h-5 flex-shrink-0 transition-transform group-hover:scale-110"></i>
                <span x-show="!sidebarCollapsed" x-transition class="text-xs whitespace-nowrap">Minha Caixinha</span>
                <span x-show="sidebarCollapsed" class="sr-only">Minha Caixinha</span>
            </a>

            <!-- Divisor -->
            <div class="my-3 border-t border-purple-100/50 dark:border-white/5"></div>

            {% if request.user.is_authenticated and request.user.is_staff %}
            <!-- Gestão / Staff Admin (ShieldCheck) -->
            <button type="button" @click="adminSidebarOpen = true"
                    class="w-full group flex items-center gap-3.5 px-3 py-2.5 rounded-2xl transition-all duration-200 text-slate-700 dark:text-cyber-silver hover:bg-purple-50 dark:hover:bg-cyber-elevated hover:text-pink-600 dark:hover:text-cyber-electric font-bold cursor-pointer">
                <i data-lucide="shield-check" class="w-5 h-5 flex-shrink-0 text-amber-500 transition-transform group-hover:scale-110"></i>
                <span x-show="!sidebarCollapsed" x-transition class="text-xs whitespace-nowrap">Menu Gestão GOM</span>
            </button>
            {% endif %}
        </nav>

        <!-- Base da Sidebar: Perfil & Modo Noturno -->
        <div class="p-3 border-t border-purple-100/60 dark:border-white/5 space-y-2">
            <div x-data="themeApp()" x-init="init()" class="w-full">
                <button type="button" @click="toggleTheme()"
                        class="w-full flex items-center gap-3 px-3 py-2 rounded-2xl text-slate-600 dark:text-cyber-silver hover:bg-slate-100 dark:hover:bg-cyber-elevated transition cursor-pointer">
                    <i data-lucide="moon" x-show="!isDark" class="w-5 h-5 text-indigo-500"></i>
                    <i data-lucide="sun" x-show="isDark" x-cloak class="w-5 h-5 text-amber-400"></i>
                    <span x-show="!sidebarCollapsed" x-transition class="text-xs font-bold" x-text="isDark ? 'Modo Claro' : 'Modo Noturno'"></span>
                </button>
            </div>
        </div>
    </aside>

    <!-- 2. DOCK BAR FLUTUANTE INSPIRADO EM GODLY.WEBSITE (MOBILE & TABLET) -->
    <div class="lg:hidden fixed bottom-3 inset-x-3 z-50 pointer-events-none">
        <nav class="max-w-md mx-auto pointer-events-auto bg-white/90 dark:bg-cyber-surface/90 backdrop-blur-2xl border border-purple-100/80 dark:border-white/10 rounded-3xl p-1.5 shadow-glass flex items-center justify-around">
            
            <!-- CEGs (Compass) -->
            <a href="{% url 'home' %}"
               class="flex flex-col items-center justify-center py-1.5 px-3 rounded-2xl transition {% if request.resolver_match.url_name == 'home' or request.path == '/' %}text-pink-600 dark:text-cyber-neon bg-purple-50 dark:bg-cyber-elevated{% else %}text-slate-500 dark:text-slate-400{% endif %}">
                <i data-lucide="compass" class="w-5 h-5"></i>
                <span class="text-[9px] font-black mt-0.5">CEGs</span>
            </a>

            <!-- Vitrine (Sparkles) -->
            <a href="{% url 'vitrine_list' %}"
               class="flex flex-col items-center justify-center py-1.5 px-3 rounded-2xl transition {% if 'vitrine' in request.path %}text-pink-600 dark:text-cyber-neon bg-purple-50 dark:bg-cyber-elevated{% else %}text-slate-500 dark:text-slate-400{% endif %}">
                <i data-lucide="sparkles" class="w-5 h-5"></i>
                <span class="text-[9px] font-black mt-0.5">Vitrine</span>
            </a>

            <!-- Minhas Reservas (ShoppingBag) -->
            <a href="{% url 'my_claims' %}"
               class="flex flex-col items-center justify-center py-1.5 px-3 rounded-2xl transition {% if 'me' in request.path and not 'caixinha' in request.GET.tab %}text-pink-600 dark:text-cyber-neon bg-purple-50 dark:bg-cyber-elevated{% else %}text-slate-500 dark:text-slate-400{% endif %}">
                <i data-lucide="shopping-bag" class="w-5 h-5"></i>
                <span class="text-[9px] font-black mt-0.5">Compras</span>
            </a>

            <!-- Caixinha (Boxes) -->
            <a href="{% url 'my_claims' %}?tab=caixinha"
               class="flex flex-col items-center justify-center py-1.5 px-3 rounded-2xl transition {% if request.GET.tab == 'caixinha' %}text-pink-600 dark:text-cyber-neon bg-purple-50 dark:bg-cyber-elevated{% else %}text-slate-500 dark:text-slate-400{% endif %}">
                <i data-lucide="boxes" class="w-5 h-5"></i>
                <span class="text-[9px] font-black mt-0.5">Caixinha</span>
            </a>

            <!-- Busca Rápida (Search) -->
            <button type="button" @click="$dispatch('open-global-search')"
                    class="flex flex-col items-center justify-center py-1.5 px-3 rounded-2xl text-slate-500 dark:text-slate-400 transition hover:text-pink-600 cursor-pointer">
                <i data-lucide="search" class="w-5 h-5"></i>
                <span class="text-[9px] font-black mt-0.5">Busca</span>
            </button>
        </nav>
    </div>
</div>
