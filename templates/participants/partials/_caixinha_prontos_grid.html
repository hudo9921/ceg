{% comment %}Photocards prontos na caixinha: tocar escolhe/desescolhe para o pedido de envio (ui-pick).{% endcomment %}
<div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3 sm:gap-4" role="group" aria-label="Itens prontos para envio">
    {% for item in itens_caixinha_prontos %}
        <button type="button" class="ui-pick is-free text-left" :class="selectedCaixinhaUids.includes('{{ item.uid }}') && 'is-on'"
                :aria-pressed="selectedCaixinhaUids.includes('{{ item.uid }}').toString()" @click="toggleCaixinhaItem('{{ item.uid }}')">
            <span class="ui-pc block">
                {% if item.imagem %}
                    <img src="{{ item.imagem|thumb }}" data-full="{{ item.imagem }}" alt="" loading="lazy" decoding="async">
                {% else %}
                    <span class="ui-pc-empty text-sm font-bold px-2 text-center">{{ item.integrante|default:item.titulo }}</span>
                {% endif %}
                <span class="ui-tick" x-show="selectedCaixinhaUids.includes('{{ item.uid }}')" x-cloak aria-hidden="true">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"></path></svg>
                </span>
            </span>
            <span class="block px-1 pb-1">
                <span class="block text-[15px] font-bold truncate" title="{{ item.titulo }}">{{ item.integrante|default:item.titulo }}</span>
                <span class="block ui-muted text-[13px] truncate" title="{{ item.origem }}">{% if item.set_number %}Set {{ item.set_number }} · {% endif %}{{ item.origem }}</span>
                {% if goms_list|length > 1 %}<span class="block ui-label truncate">{{ item.gom_name }}</span>{% endif %}
            </span>
        </button>
    {% endfor %}
</div>
