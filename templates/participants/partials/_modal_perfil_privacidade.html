<!-- Privacidade & Direitos do Titular (LGPD): exportar dados e pedir exclusão -->
<div x-data="{ confirmDelete: false }"
    class="mt-5 pt-4 border-t border-slate-100 dark:border-white/10 space-y-3">
    <div class="flex items-center justify-between">
        <span class="text-xs font-black text-slate-800 dark:text-white flex items-center gap-1.5">
            <i data-lucide="shield-check" class="w-3.5 h-3.5 text-emerald-500 dark:text-emerald-400" stroke-width="1.75"></i>
            Privacidade e seus dados
        </span>
        <a href="{% url 'privacy_policy' %}" target="_blank" rel="noopener"
            class="text-[11px] font-bold text-pink-600 dark:text-cyber-neon hover:underline">
            Política de privacidade
        </a>
    </div>

    <div class="grid grid-cols-2 gap-2">
        <a href="{% url 'export_my_data' %}"
            class="py-2 px-3 bg-slate-50 dark:bg-white/[0.04] border border-slate-200/80 dark:border-white/10 hover:border-pink-300 dark:hover:border-cyber-neon/60 rounded-xl text-[11px] font-bold text-slate-700 dark:text-slate-200 flex items-center justify-center gap-1.5 transition">
            <i data-lucide="download" class="w-3.5 h-3.5" stroke-width="1.75"></i>
            Baixar meus dados
        </a>
        <button type="button" @click="confirmDelete = !confirmDelete"
            class="py-2 px-3 bg-rose-50 dark:bg-rose-950/30 border border-rose-200 dark:border-rose-800/50 hover:border-rose-400 rounded-xl text-[11px] font-bold text-rose-700 dark:text-rose-300 flex items-center justify-center gap-1.5 transition cursor-pointer">
            <i data-lucide="user-x" class="w-3.5 h-3.5" stroke-width="1.75"></i>
            Excluir minha conta
        </button>
    </div>

    <form x-show="confirmDelete" x-cloak method="POST" action="{% url 'request_data_deletion' %}"
        class="p-3 bg-rose-50/70 dark:bg-rose-950/30 border border-rose-200 dark:border-rose-800/50 rounded-xl space-y-2">
        {% csrf_token %}
        <p class="text-[11px] leading-relaxed text-rose-800 dark:text-rose-200">
            A organização conclui antes as reservas, pagamentos e envios em andamento. Depois, seu nome,
            WhatsApp, @ e endereços são apagados. Os registros financeiros ficam guardados sem identificação.
        </p>
        <label class="block text-[11px] font-bold text-rose-900 dark:text-rose-200">
            Digite <span class="font-mono">EXCLUIR</span> para confirmar
        </label>
        <div class="flex gap-2">
            <input type="text" name="confirmacao" autocomplete="off" required
                class="flex-1 px-3 py-2 bg-white dark:bg-cyber-surface border border-rose-200 dark:border-rose-800/60 rounded-lg text-xs font-mono text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-rose-500">
            <button type="submit"
                class="px-3 py-2 bg-rose-600 hover:bg-rose-700 text-white text-[11px] font-black rounded-lg transition cursor-pointer">
                Enviar pedido
            </button>
        </div>
    </form>
</div>
