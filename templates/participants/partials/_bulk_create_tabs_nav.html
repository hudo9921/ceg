<!-- Navegação por Abas e Configurações Globais -->
<div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 bg-white dark:bg-slate-900/90 p-3 sm:p-4 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm">
    <div class="flex flex-wrap items-center gap-2">
        <button type="button" @click="activeTab = 'paste'"
                :class="activeTab === 'paste' ? 'bg-indigo-600 text-white shadow-sm font-black' : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-100 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 font-bold'"
                class="px-4 py-2 rounded-xl text-xs sm:text-sm transition flex items-center gap-2 cursor-pointer">
            <i data-lucide="clipboard" class="w-4 h-4"></i>
            <span>Colar em Lote (Excel / Sheets / Texto)</span>
        </button>
        <button type="button" @click="activeTab = 'table'"
                :class="activeTab === 'table' ? 'bg-indigo-600 text-white shadow-sm font-black' : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-100 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 font-bold'"
                class="px-4 py-2 rounded-xl text-xs sm:text-sm transition flex items-center gap-2 cursor-pointer">
            <i data-lucide="edit-3" class="w-4 h-4"></i>
            <span>Grade Interativa (Linha por Linha)</span>
            <span class="bg-indigo-100 dark:bg-indigo-500/20 text-indigo-800 dark:text-indigo-300 text-[10px] px-1.5 py-0.5 rounded-full font-black border border-indigo-200 dark:border-indigo-500/30" x-text="tableRows.length"></span>
        </button>
        <button type="button" @click="activeTab = 'recent'"
                :class="activeTab === 'recent' ? 'bg-indigo-600 text-white shadow-sm font-black' : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-100 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 font-bold'"
                class="px-4 py-2 rounded-xl text-xs sm:text-sm transition flex items-center gap-2 cursor-pointer">
            <i data-lucide="clock" class="w-4 h-4"></i>
            <span>Cadastrados Recentemente</span>
            <span class="bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-300 text-[10px] px-1.5 py-0.5 rounded-full font-black">{{ recent_participants|length }}</span>
        </button>
    </div>

    <!-- Opções Globais de Configuração -->
    <div class="flex items-center gap-3">
        <label class="inline-flex items-center gap-2 text-xs font-semibold text-slate-700 dark:text-slate-300 cursor-pointer bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700/80 px-3 py-1.5 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 transition">
            <input type="checkbox" x-model="updateExisting" class="rounded text-indigo-600 focus:ring-indigo-500 w-4 h-4 bg-slate-100 dark:bg-slate-700 border-slate-300 dark:border-slate-600">
            <span>Atualizar se já existir (Upsert)</span>
        </label>
    </div>
</div>
