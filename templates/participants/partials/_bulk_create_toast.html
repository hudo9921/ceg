<!-- Modal / Toast de Sucesso ou Erro -->
<div x-show="toast.show" x-cloak
     x-transition:enter="transition ease-out duration-300"
     x-transition:enter-start="opacity-0 translate-y-4"
     x-transition:enter-end="opacity-100 translate-y-0"
     x-transition:leave="transition ease-in duration-200"
     x-transition:leave-start="opacity-100 translate-y-0"
     x-transition:leave-end="opacity-0 translate-y-4"
     class="fixed bottom-6 right-6 z-50 max-w-md bg-white dark:bg-slate-900 border-2 rounded-2xl shadow-2xl p-4 flex items-start gap-3"
     :class="toast.type === 'success' ? 'border-emerald-500 bg-emerald-50/90 dark:bg-emerald-950/80 text-emerald-950 dark:text-emerald-100' : 'border-rose-500 bg-rose-50/90 dark:bg-rose-950/80 text-rose-950 dark:text-rose-100'">
    <div class="text-xl">
        <template x-if="toast.type === 'success'">
            <i data-lucide="check-circle-2" class="w-6 h-6 text-emerald-600 dark:text-emerald-400"></i>
        </template>
        <template x-if="toast.type !== 'success'">
            <i data-lucide="alert-triangle" class="w-6 h-6 text-rose-600 dark:text-rose-400"></i>
        </template>
    </div>
    <div class="flex-1">
        <h4 class="text-sm font-black" x-text="toast.title"></h4>
        <p class="text-xs mt-0.5 leading-relaxed opacity-90" x-text="toast.message"></p>
    </div>
    <button type="button" @click="toast.show = false" class="text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 font-black text-sm cursor-pointer">
        <i data-lucide="x" class="w-4 h-4"></i>
    </button>
</div>
