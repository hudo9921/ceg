        <div class="bg-white dark:bg-cyber-surface rounded-2xl border border-slate-200/80 dark:border-white/10 p-5 shadow-xs space-y-4">
            <!-- Linha 1: Título e Alternador de Modo de Visualização (Galeria / Tabela) -->
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                <div class="space-y-0.5">
                    <h2 class="text-xl font-black text-slate-900 dark:text-white flex items-center gap-2">
                        <div class="w-7 h-7 rounded-lg bg-pink-100 dark:bg-pink-950/60 text-pink-600 dark:text-pink-400 flex items-center justify-center text-sm shadow-xs">
                            <i data-lucide="package" class="w-4 h-4"></i>
                        </div>
                        <span>Minhas Reservas por CEG</span>
                    </h2>
                    <p class="text-xs text-slate-500 dark:text-cyber-silver">
                        Busque por integrante, card ou CEG e alterne entre a Galeria visual de fotos e a Tabela.
                    </p>
                </div>

                <!-- Toggle Galeria / Tabela -->
                <div class="flex items-center gap-1 bg-slate-100 dark:bg-white/[0.04] p-1 rounded-xl border border-slate-200/80 dark:border-white/10 self-start sm:self-auto">
                    <button type="button" @click="setViewMode('gallery')"
                        :class="viewMode === 'gallery' ? 'bg-white dark:bg-white/10 text-pink-600 dark:text-pink-400 shadow-xs font-bold' : 'text-slate-600 dark:text-cyber-silver hover:text-slate-900 dark:hover:text-white font-medium'"
                        class="px-3 py-1.5 rounded-lg text-xs transition flex items-center gap-1.5 cursor-pointer select-none">
                        <i data-lucide="layout-grid" class="w-3.5 h-3.5"></i>
                        <span>Galeria</span>
                    </button>
                    <button type="button" @click="setViewMode('table')"
                        :class="viewMode === 'table' ? 'bg-white dark:bg-white/10 text-pink-600 dark:text-pink-400 shadow-xs font-bold' : 'text-slate-600 dark:text-cyber-silver hover:text-slate-900 dark:hover:text-white font-medium'"
                        class="px-3 py-1.5 rounded-lg text-xs transition flex items-center gap-1.5 cursor-pointer select-none">
                        <i data-lucide="table" class="w-3.5 h-3.5"></i>
                        <span>Tabela</span>
                    </button>
                </div>
            </div>

            <!-- Linha 2: Barra de Busca Instantânea + Dropdowns de Grupo e CEG + Botão Limpar Filtros -->
            <div class="flex flex-col md:flex-row md:items-center gap-3">
                <!-- Barra de Busca Instantânea -->
                <div class="relative flex-1 min-w-[240px]">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400 dark:text-cyber-silver">
                        <i data-lucide="search" class="w-3.5 h-3.5"></i>
                    </span>
                    <input type="text" x-model.debounce.250ms="searchQuery"
                        placeholder="Buscar por integrante (ex: Mina, Sana), item, CEG..."
                        class="w-full pl-9 pr-8 py-2 bg-slate-50 dark:bg-white/[0.04] border border-slate-200/80 dark:border-white/10 rounded-xl text-xs font-medium text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-cyber-silver focus:outline-none focus:ring-2 focus:ring-pink-500 focus:bg-white dark:focus:bg-cyber-surface transition">
                    <button type="button" x-show="searchQuery" @click="searchQuery = ''"
                        class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600 dark:hover:text-white cursor-pointer"
                        title="Limpar busca">
                        <i data-lucide="x" class="w-3.5 h-3.5"></i>
                    </button>
                </div>

                <!-- Filtros: Grupo, CEG e Botão Permanente Limpar -->
                <div class="flex flex-wrap items-center gap-2.5">
                    <!-- 1. Filtro de Grupos -->
                    <div class="flex items-center gap-1.5">
                        <label class="text-xs font-bold text-slate-500 dark:text-cyber-silver whitespace-nowrap">Grupo:</label>
                        <select x-model="selectedGroup" @change="onGroupChange()"
                            class="px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200/80 dark:border-white/10 rounded-xl text-xs font-bold text-slate-800 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-pink-500 focus:bg-white dark:focus:bg-slate-900 transition cursor-pointer">
                            <option value="" x-text="'Todos os Grupos (' + filteredGroupsOptions.length + ')'">Todos os Grupos ({{ groups_filter_list|length }})</option>
                            <template x-for="g in filteredGroupsOptions" :key="g.id">
                                <option :value="g.id" x-text="g.name + ' (' + g.count + (g.count === 1 ? ' item)' : ' itens)')"></option>
                            </template>
                        </select>
                    </div>

                    <!-- 2. Filtro de CEGs -->
                    <div class="flex items-center gap-1.5">
                        <label class="text-xs font-bold text-slate-500 dark:text-cyber-silver whitespace-nowrap">CEG:</label>
                        <select x-model="selectedCeg"
                            class="px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200/80 dark:border-white/10 rounded-xl text-xs font-bold text-slate-800 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-pink-500 focus:bg-white dark:focus:bg-slate-900 transition cursor-pointer max-w-[220px] truncate">
                            <option value="" x-text="'Todas as CEGs (' + filteredCegsOptions.length + ')'">Todas as CEGs</option>
                            <template x-for="c in filteredCegsOptions" :key="c.id">
                                <option :value="c.id"
                                    x-text="c.title + ' (' + c.count + (c.count === 1 ? ' item)' : ' itens)')"></option>
                            </template>
                        </select>
                    </div>

                    <!-- Botão Limpar Filtros -->
                    <button type="button"
                        @click="clearFilters()"
                        :class="hasActiveFilters 
                            ? 'bg-pink-600 hover:bg-pink-700 text-white font-bold ring-2 ring-pink-300 dark:ring-pink-500/50 shadow-xs cursor-pointer' 
                            : 'bg-slate-100 dark:bg-white/[0.04] hover:bg-slate-200 dark:hover:bg-white/[0.08] text-slate-500 dark:text-cyber-silver border border-slate-200/80 dark:border-white/10 font-medium cursor-pointer'"
                        class="px-3.5 py-2 rounded-xl text-xs transition flex items-center gap-1.5 select-none"
                        title="Limpar todos os filtros e exibir todas as reservas">
                        <i data-lucide="x" class="w-3.5 h-3.5"></i>
                        <span>Limpar Filtros</span>
                        <span x-show="hasActiveFilters && activeFiltersCount > 0"
                              class="ml-0.5 px-1.5 py-0.2 rounded-full text-[10px] font-black bg-pink-800 text-pink-100"
                              x-text="activeFiltersCount">
                        </span>
                    </button>
                </div>
            </div>

            <!-- Linha 3 & 4: Status Pills & Chips -->
            {% include "participants/partials/_filtros_painel_status_chips.html" %}
        </div>
