        <div class="bg-white dark:bg-[#131B2E] rounded-2xl border border-slate-200 dark:border-slate-800 p-5 shadow-sm space-y-4">
            <!-- Linha 1: Título e Alternador de Modo de Visualização (Galeria / Tabela) -->
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                <div class="space-y-0.5">
                    <h2 class="text-xl font-black text-slate-900 dark:text-white flex items-center gap-2">
                        <span>📦</span>
                        <span>Minhas Reservas por CEG</span>
                    </h2>
                    <p class="text-xs text-slate-500 dark:text-slate-400">
                        Busque por integrante, card ou CEG e alterne entre a Galeria visual de fotos e a Tabela.
                    </p>
                </div>

                <!-- Toggle Galeria 🖼️ / Tabela 📋 -->
                <div class="flex items-center gap-1 bg-slate-100 dark:bg-slate-800 p-1 rounded-xl border border-slate-200 dark:border-slate-700 self-start sm:self-auto">
                    <button type="button" @click="setViewMode('gallery')"
                        :class="viewMode === 'gallery' ? 'bg-white dark:bg-slate-900 text-pink-600 dark:text-pink-400 shadow-xs font-bold' : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white font-medium'"
                        class="px-3 py-1.5 rounded-lg text-xs transition flex items-center gap-1.5 cursor-pointer select-none">
                        <span>🖼️</span>
                        <span>Galeria</span>
                    </button>
                    <button type="button" @click="setViewMode('table')"
                        :class="viewMode === 'table' ? 'bg-white dark:bg-slate-900 text-pink-600 dark:text-pink-400 shadow-xs font-bold' : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white font-medium'"
                        class="px-3 py-1.5 rounded-lg text-xs transition flex items-center gap-1.5 cursor-pointer select-none">
                        <span>📋</span>
                        <span>Tabela</span>
                    </button>
                </div>
            </div>

            <!-- Linha 2: Barra de Busca Instantânea + Dropdowns de Grupo e CEG + Botão Permanente Limpar Filtros -->
            <div class="flex flex-col md:flex-row md:items-center gap-3">
                <!-- Barra de Busca Instantânea com espaço confortável -->
                <div class="relative flex-1 min-w-[240px]">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        🔍
                    </span>
                    <input type="text" x-model="searchQuery"
                        placeholder="Buscar por integrante (ex: Mina, Sana), item, CEG..."
                        class="w-full pl-9 pr-8 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-xs font-medium text-slate-900 dark:text-white placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-pink-500 focus:bg-white dark:focus:bg-slate-900 transition">
                    <button type="button" x-show="searchQuery" @click="searchQuery = ''"
                        class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 cursor-pointer"
                        title="Limpar busca">
                        ✕
                    </button>
                </div>

                <!-- Filtros: Grupo, CEG e Botão Permanente Limpar -->
                <div class="flex flex-wrap items-center gap-2.5">
                    <!-- 1. Filtro de Grupos -->
                    <div class="flex items-center gap-1.5">
                        <label class="text-xs font-bold text-slate-500 dark:text-slate-400 whitespace-nowrap">Grupo:</label>
                        <select x-model="selectedGroup" @change="onGroupChange()"
                            class="px-3 py-2 bg-slate-50 dark:bg-slate-900/90 hover:bg-slate-100 dark:hover:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs font-bold text-slate-800 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-pink-500 focus:bg-white dark:focus:bg-slate-900 transition cursor-pointer">
                            <option value="" x-text="'Todos os Grupos (' + filteredGroupsOptions.length + ')'">Todos os Grupos ({{ groups_filter_list|length }})</option>
                            <template x-for="g in filteredGroupsOptions" :key="g.id">
                                <option :value="g.id" x-text="g.name + ' (' + g.count + (g.count === 1 ? ' item)' : ' itens)')"></option>
                            </template>
                        </select>
                    </div>

                    <!-- 2. Filtro de CEGs -->
                    <div class="flex items-center gap-1.5">
                        <label class="text-xs font-bold text-slate-500 dark:text-slate-400 whitespace-nowrap">CEG:</label>
                        <select x-model="selectedCeg"
                            class="px-3 py-2 bg-slate-50 dark:bg-slate-900/90 hover:bg-slate-100 dark:hover:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs font-bold text-slate-800 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-pink-500 focus:bg-white dark:focus:bg-slate-900 transition cursor-pointer max-w-[220px] truncate">
                            <option value="" x-text="'Todas as CEGs (' + filteredCegsOptions.length + ')'">Todas as CEGs</option>
                            <template x-for="c in filteredCegsOptions" :key="c.id">
                                <option :value="c.id"
                                    x-text="c.title + ' (' + c.count + (c.count === 1 ? ' item)' : ' itens)')"></option>
                            </template>
                        </select>
                    </div>

                    <!-- Botão Limpar Filtros (Sempre Visível) -->
                    <button type="button"
                        @click="clearFilters()"
                        :class="hasActiveFilters 
                            ? 'bg-pink-600 hover:bg-pink-700 text-white font-bold ring-2 ring-pink-300 dark:ring-pink-500/50 shadow-sm cursor-pointer' 
                            : 'bg-slate-100 dark:bg-slate-800/90 hover:bg-slate-200 dark:hover:bg-slate-700/80 text-slate-500 dark:text-slate-400 border border-slate-200 dark:border-slate-700 font-medium cursor-pointer'"
                        class="px-3.5 py-2 rounded-xl text-xs transition flex items-center gap-1.5 select-none"
                        title="Limpar todos os filtros e exibir todas as reservas">
                        <span :class="hasActiveFilters ? 'text-white' : 'text-slate-400 dark:text-slate-500'">✕</span>
                        <span>Limpar Filtros</span>
                        <span x-show="hasActiveFilters && activeFiltersCount > 0"
                              class="ml-0.5 px-1.5 py-0.2 rounded-full text-[10px] font-black bg-pink-800 text-pink-100"
                              x-text="activeFiltersCount">
                        </span>
                    </button>
                </div>
            </div>

            <!-- Linha 3: Status Pills -->
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pt-3 border-t border-slate-100 dark:border-slate-800">
                <div class="flex flex-wrap items-center gap-2">
                    <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mr-1">Filtrar por Status:</span>
                    <button type="button" @click="statusFilter = 'ALL'"
                        :class="statusFilter === 'ALL' ? 'bg-slate-900 dark:bg-pink-600 text-white font-bold shadow-sm' : 'bg-slate-100 dark:bg-slate-800/80 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700 font-medium'"
                        class="px-3 py-1.5 rounded-xl text-xs transition flex items-center gap-1.5 cursor-pointer">
                        <span>Todos os Itens</span>
                        <span class="text-[10px] px-1.5 py-0.2 rounded-full font-bold"
                            :class="statusFilter === 'ALL' ? 'bg-slate-700 dark:bg-pink-700 text-white' : 'bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-200'"
                            x-text="filteredCounts.total">
                            {{ total_claims_count }}
                        </span>
                    </button>
                    <button type="button" @click="statusFilter = 'PENDING'"
                        :class="statusFilter === 'PENDING' ? 'bg-amber-600 text-white font-bold shadow-sm' : 'bg-amber-50 dark:bg-[#131B2E] text-amber-800 dark:text-amber-300 hover:bg-amber-100 dark:hover:bg-[#1E293B] border border-amber-200 dark:border-amber-500/30 font-medium'"
                        class="px-3 py-1.5 rounded-xl text-xs transition flex items-center gap-1.5 cursor-pointer">
                        <span>⏳ Faltam Pagar</span>
                        <span class="text-[10px] px-1.5 py-0.2 rounded-full font-bold"
                            :class="statusFilter === 'PENDING' ? 'bg-amber-700 text-white' : 'bg-amber-200 dark:bg-amber-950/80 text-amber-900 dark:text-amber-300 dark:border dark:border-amber-800/60'"
                            x-text="filteredCounts.pending">
                            {{ pending_claims_count }}
                        </span>
                    </button>
                    <button type="button" @click="statusFilter = 'PAID'"
                        :class="statusFilter === 'PAID' ? 'bg-emerald-600 text-white font-bold shadow-sm' : 'bg-emerald-50 dark:bg-[#131B2E] text-emerald-800 dark:text-emerald-300 hover:bg-emerald-100 dark:hover:bg-[#1E293B] border border-emerald-200 dark:border-emerald-500/30 font-medium'"
                        class="px-3 py-1.5 rounded-xl text-xs transition flex items-center gap-1.5 cursor-pointer">
                        <span>✔ Já Pagos</span>
                        <span class="text-[10px] px-1.5 py-0.2 rounded-full font-bold"
                            :class="statusFilter === 'PAID' ? 'bg-emerald-700 text-white' : 'bg-emerald-200 dark:bg-emerald-950/80 text-emerald-900 dark:text-emerald-300 dark:border dark:border-emerald-800/60'"
                            x-text="filteredCounts.paid">
                            {{ paid_claims_count }}
                        </span>
                    </button>
                    <button type="button" @click="statusFilter = 'INTER_UNPAID'"
                        :class="statusFilter === 'INTER_UNPAID' ? 'bg-blue-600 text-white font-bold shadow-sm' : 'bg-blue-50 dark:bg-[#131B2E] text-blue-800 dark:text-blue-300 hover:bg-blue-100 dark:hover:bg-[#1E293B] border border-blue-200 dark:border-blue-500/30 font-medium'"
                        class="px-3 py-1.5 rounded-xl text-xs transition flex items-center gap-1.5 cursor-pointer">
                        <span>✈️ Inter Não Pago</span>
                        <span class="text-[10px] px-1.5 py-0.2 rounded-full font-bold"
                            :class="statusFilter === 'INTER_UNPAID' ? 'bg-blue-700 text-white' : 'bg-blue-200 dark:bg-blue-950/80 text-blue-900 dark:text-blue-300 dark:border dark:border-blue-800/60'"
                            x-text="filteredCounts.interUnpaid">
                            {{ inter_unpaid_count }}
                        </span>
                    </button>
                    <button type="button" @click="statusFilter = 'TAXA_UNPAID'"
                        :class="statusFilter === 'TAXA_UNPAID' ? 'bg-purple-600 text-white font-bold shadow-sm' : 'bg-purple-50 dark:bg-[#131B2E] text-purple-800 dark:text-purple-300 hover:bg-purple-100 dark:hover:bg-[#1E293B] border border-purple-200 dark:border-purple-500/30 font-medium'"
                        class="px-3 py-1.5 rounded-xl text-xs transition flex items-center gap-1.5 cursor-pointer">
                        <span>🏛️ Taxa Não Paga</span>
                        <span class="text-[10px] px-1.5 py-0.2 rounded-full font-bold"
                            :class="statusFilter === 'TAXA_UNPAID' ? 'bg-purple-700 text-white' : 'bg-purple-200 dark:bg-purple-950/80 text-purple-900 dark:text-purple-300 dark:border dark:border-purple-800/60'"
                            x-text="filteredCounts.taxaUnpaid">
                            {{ taxa_unpaid_count }}
                        </span>
                    </button>
                </div>
            </div>

            <!-- Linha 4: Feedback e chips de filtros ativos -->
            <div x-show="hasActiveFilters"
                class="pt-1 text-xs text-slate-500 dark:text-slate-400 font-medium flex flex-wrap items-center gap-2">
                <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Filtros ativos:</span>

                <template x-if="searchQuery">
                    <span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-lg bg-pink-50 dark:bg-pink-950/60 text-pink-700 dark:text-pink-300 font-bold border border-pink-200 dark:border-pink-800/50">
                        <span>🔍</span>
                        <span x-text="'\"' + searchQuery + '\"'"></span>
                        <button type="button" @click="searchQuery = ''" class="ml-1 text-pink-400 hover:text-pink-600 cursor-pointer" title="Remover filtro de busca">✕</button>
                    </span>
                </template>

                <template x-if="selectedCaixa !== 'ALL'">
                    <span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-lg bg-indigo-50 dark:bg-indigo-950/60 text-indigo-700 dark:text-indigo-300 font-bold border border-indigo-200 dark:border-indigo-800/50">
                        <span>📦</span>
                        <span x-text="selectedCaixa === 'NONE' ? 'Sem Remessa' : 'Caixa Filtrada'"></span>
                        <button type="button" @click="selectedCaixa = 'ALL'; onCaixaChange();" class="ml-1 text-indigo-400 hover:text-indigo-600 cursor-pointer" title="Remover filtro de caixa">✕</button>
                    </span>
                </template>

                <template x-if="selectedGroup">
                    <span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-lg bg-pink-50 dark:bg-pink-950/60 text-pink-700 dark:text-pink-300 font-bold border border-pink-200 dark:border-pink-800/50">
                        <span>👥</span>
                        <span>Grupo</span>
                        <button type="button" @click="selectedGroup = ''; onGroupChange();" class="ml-1 text-pink-400 hover:text-pink-600 cursor-pointer" title="Remover filtro de grupo">✕</button>
                    </span>
                </template>

                <template x-if="selectedCeg">
                    <span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-lg bg-pink-50 dark:bg-pink-950/60 text-pink-700 dark:text-pink-300 font-bold border border-pink-200 dark:border-pink-800/50">
                        <span>📋</span>
                        <span>CEG</span>
                        <button type="button" @click="selectedCeg = ''" class="ml-1 text-pink-400 hover:text-pink-600 cursor-pointer" title="Remover filtro de CEG">✕</button>
                    </span>
                </template>

                <template x-if="statusFilter !== 'ALL'">
                    <span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-lg bg-amber-50 dark:bg-amber-950/60 text-amber-800 dark:text-amber-300 font-bold border border-amber-200 dark:border-amber-800/50">
                        <span x-text="statusFilter === 'PENDING' ? '⏳ Faltam Pagar' : (statusFilter === 'PAID' ? '✔ Já Pagos' : (statusFilter === 'INTER_UNPAID' ? '✈️ Inter Não Pago' : (statusFilter === 'TAXA_UNPAID' ? '🏛️ Taxa Não Paga' : '')))"></span>
                        <button type="button" @click="statusFilter = 'ALL'" class="ml-1 text-amber-600 dark:text-amber-400 hover:text-amber-800 cursor-pointer" title="Remover filtro de status">✕</button>
                    </span>
                </template>

                <button type="button" @click="clearFilters()" class="text-xs font-bold text-pink-600 dark:text-pink-400 hover:underline cursor-pointer ml-1">
                    Limpar todos os filtros
                </button>
            </div>
        </div>

        <!-- Barra de Controle de Visualização das CEGs -->
        {% if cegs_groups %}
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pt-2">
            <div class="flex items-center gap-2">
                <h2 class="text-base sm:text-lg font-black text-slate-900 dark:text-white flex items-center gap-2">
                    <span>Suas CEGs e Pedidos</span>
                    <span class="text-xs px-2.5 py-0.5 rounded-full font-bold bg-pink-100 dark:bg-pink-950/70 text-pink-700 dark:text-pink-300"
                        x-text="visibleCegsCount">
                        {{ cegs_groups|length }}
                    </span>
                </h2>
                <span class="text-xs text-slate-400 dark:text-slate-500 hidden sm:inline">• Clique para expandir os itens de cada CEG</span>
            </div>

            <div class="flex items-center gap-2 self-start sm:self-auto flex-wrap">
                <button type="button" @click="expandAllCegs()"
                    class="px-3 py-1.5 text-xs font-bold text-slate-600 dark:text-slate-300 bg-white dark:bg-slate-800 hover:bg-slate-100 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700 rounded-xl transition flex items-center gap-1.5 shadow-xs cursor-pointer">
                    <span>▾</span>
                    <span>Expandir Todas</span>
                </button>
                <button type="button" @click="collapseAllCegs()"
                    class="px-3 py-1.5 text-xs font-bold text-slate-600 dark:text-slate-300 bg-white dark:bg-slate-800 hover:bg-slate-100 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700 rounded-xl transition flex items-center gap-1.5 shadow-xs cursor-pointer">
                    <span>▴</span>
                    <span>Recolher Todas</span>
                </button>
            </div>
        </div>
        {% endif %}
