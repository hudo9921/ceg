{% comment %}
myClaimsApp(): painel do joiner (/me/). Abas (Pagar · Meus itens · Envios), seleção da caixinha, modais
de pacote, prévia de item, copiar Pix e avisos. Meus itens tem o próprio componente (_itens_script.html).
{% endcomment %}
<script>
function myClaimsApp(chargesCount = 0) {
    const readJson = (id, fallback) => {
        try { return JSON.parse(document.getElementById(id).textContent); } catch (e) { return fallback; }
    };
    const caixinhaProntos = readJson('caixinha-prontos-data', []);
    // Abas: pagar · reservas (Meus itens) · caixinha (Envios). Sem ?tab=, abre Pagar se houver cobrança.
    const params = new URLSearchParams(window.location.search);
    const TAB_ALIASES = { pagar: 'pagar', itens: 'reservas', reservas: 'reservas', envios: 'caixinha', caixinha: 'caixinha' };
    const initialTab = TAB_ALIASES[params.get('tab')] || (window.location.hash === '#pagar' || chargesCount > 0 ? 'pagar' : 'reservas');
    const post = (url) => fetch(url, {
        method: 'POST', headers: { 'X-CSRFToken': '{{ csrf_token }}', 'X-Requested-With': 'XMLHttpRequest' },
    }).then((r) => r.json());

    return {
        activeMainTab: initialTab,
        init() {
            this.syncTabNav(this.activeMainTab);
            this.$watch('activeMainTab', (tab) => {
                this.syncTabNav(tab);
                this.$nextTick(() => window.dispatchEvent(new Event('icons-refresh')));
            });
        },
        // Mantém ?tab= na URL e o destaque da barra lateral/abas iguais à aba aberta.
        syncTabNav(tab) {
            const alias = { pagar: 'pagar', reservas: 'itens', caixinha: 'envios' }[tab] || 'itens';
            const url = new URL(window.location.href);
            url.searchParams.set('tab', alias);
            url.hash = '';
            window.history.replaceState(null, '', url);
            document.querySelectorAll('.ui-nav-item, .ui-tab').forEach((a) => {
                const href = a.getAttribute('href') || '';
                if (!href.includes('/me/')) return;
                const on = href.includes('tab=' + alias);
                a.classList.toggle('is-on', on);
                if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
            });
        },

        // Caixinha: itens escolhidos para o pedido de envio (todos começam escolhidos).
        caixinhaProntos,
        selectedCaixinhaUids: caixinhaProntos.map((i) => i.uid),
        toggleSelectAllCaixinha() {
            this.selectedCaixinhaUids = this.selectedCaixinhaUids.length === this.caixinhaProntos.length
                ? [] : this.caixinhaProntos.map((i) => i.uid);
        },
        toggleCaixinhaItem(uid) {
            const idx = this.selectedCaixinhaUids.indexOf(uid);
            if (idx > -1) this.selectedCaixinhaUids.splice(idx, 1); else this.selectedCaixinhaUids.push(uid);
        },

        // Pacotes: cancelar pedido e confirmar entrega com avaliação.
        cancelModalOpen: false, cancelPacoteId: null, cancelPacoteIdentificador: '',
        openCancelModal(id, identificador) {
            this.cancelPacoteId = id;
            this.cancelPacoteIdentificador = identificador;
            this.cancelModalOpen = true;
        },
        deliveryModalOpen: false, deliveryPacoteId: '', deliveryPacoteIdentificador: '', deliveryRating: 5,
        openConfirmDeliveryModal(id, identificador) {
            this.deliveryPacoteId = id;
            this.deliveryPacoteIdentificador = identificador;
            this.deliveryRating = 5;
            this.deliveryModalOpen = true;
        },

        profileModalOpen: {% if is_placeholder_name %}true{% else %}false{% endif %},

        // Prévia de um item (id de claim ou objeto pronto).
        claimsData: readJson('claims-preview-data', {}),
        previewModalOpen: false, previewItem: null,
        openPreview(itemOrId) {
            this.previewItem = (typeof itemOrId === 'object' && itemOrId !== null) ? itemOrId : (this.claimsData[String(itemOrId)] || null);
            this.previewModalOpen = true;
            this.$nextTick(() => window.dispatchEvent(new Event('icons-refresh')));
        },
        closePreview() { this.previewModalOpen = false; this.previewItem = null; },

        copiedPixCegId: null,
        copyPix(key, id = null) {
            const done = () => {
                if (!id) return;
                this.copiedPixCegId = String(id);
                setTimeout(() => { if (this.copiedPixCegId === String(id)) this.copiedPixCegId = null; }, 2500);
            };
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(key).then(done).catch(() => window.prompt('Copie a chave Pix:', key));
            } else {
                window.prompt('Copie a chave Pix:', key);
            }
        },

        // Avisos do joiner.
        notificationsOpen: {% if unread_notifications_count > 0 %}true{% else %}false{% endif %},
        toggleNotifications() { this.notificationsOpen = !this.notificationsOpen; },
        unreadNotificationsCount: {{ unread_notifications_count|default:0 }},
        readNotifIds: [], allMarkedRead: false,
        isRead(id, initialRead) { return initialRead || this.readNotifIds.includes(id); },
        async markNotificationRead(id) {
            try {
                const data = await post(`/me/notifications/${id}/read/`);
                if (data.success) {
                    this.unreadNotificationsCount = data.unread_count;
                    if (!this.readNotifIds.includes(id)) this.readNotifIds.push(id);
                }
            } catch (err) { console.error('Erro ao marcar aviso como lido:', err); }
        },
        async markAllNotificationsRead() {
            try {
                const data = await post('/me/notifications/read-all/');
                if (data.success) { this.unreadNotificationsCount = 0; this.allMarkedRead = true; }
            } catch (err) { console.error('Erro ao marcar avisos como lidos:', err); }
        },
    };
}
</script>
