<!-- BARRA SUPERIOR DE NAVEGAÇÃO DA GALERIA DE ÁLBUNS -->
<div x-show="viewMode === 'gallery'" class="mb-4">
    <!-- Barra quando em MODO PASTAS / ESTANTES -->
    <div x-show="galleryDisplayMode === 'folders'"
        class="flex flex-wrap items-center justify-between gap-2.5 px-1 py-1">
        <div class="flex items-center gap-2">
            <span class="text-xs font-black uppercase tracking-wider text-slate-500 dark:text-cyber-silver">
                Pastas de CEG & Estantes
            </span>
            <span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-pink-50 dark:bg-cyber-elevated text-pink-700 dark:text-cyber-neon border border-pink-200 dark:border-white/10">
                {{ cegs_groups|length }} {% if cegs_groups|length == 1 %}pasta{% else %}pastas{% endif %}
            </span>
        </div>
        
        <div class="flex items-center gap-2 sm:gap-3">
            <button type="button" @click="expandAllCegs()"
                class="text-[11px] font-bold text-slate-600 dark:text-cyber-silver hover:text-pink-600 dark:hover:text-cyber-neon flex items-center gap-1.5 cursor-pointer transition">
                <i data-lucide="folder-open" class="w-3.5 h-3.5 text-pink-500"></i>
                <span>Expandir Todas</span>
            </button>
            <span class="text-slate-300 dark:text-white/10 text-xs">•</span>
            <button type="button" @click="collapseAllCegs()"
                class="text-[11px] font-bold text-slate-600 dark:text-cyber-silver hover:text-pink-600 dark:hover:text-cyber-neon flex items-center gap-1.5 cursor-pointer transition">
                <i data-lucide="folder" class="w-3.5 h-3.5 text-pink-500"></i>
                <span>Recolher Todas</span>
            </button>
            <span class="text-slate-300 dark:text-white/10 text-xs">•</span>
            <button type="button" @click="setGalleryDisplayMode('all')"
                class="text-[11px] font-bold text-pink-600 dark:text-cyber-neon hover:underline flex items-center gap-1 cursor-pointer transition">
                <i data-lucide="sparkles" class="w-3.5 h-3.5 text-amber-400"></i>
                <span>Ver Todos os Photocards Juntos</span>
            </button>
        </div>
    </div>

    <!-- Barra quando em MODO TODOS OS CARDS JUNTOS -->
    <div x-show="galleryDisplayMode === 'all'"
        class="flex items-center justify-between gap-2 px-1">
        <span class="text-xs font-black uppercase tracking-wider text-slate-500 dark:text-cyber-silver">
            Todos os Photocards (Visão Completa)
        </span>
        <button type="button" @click="setGalleryDisplayMode('folders')"
            class="text-[11px] font-bold text-pink-600 dark:text-cyber-neon hover:underline flex items-center gap-1.5 cursor-pointer transition">
            <i data-lucide="folder" class="w-3.5 h-3.5 text-pink-500"></i>
            <span>Agrupar por Pastas</span>
        </button>
    </div>
</div>

<!-- 1. GRID UNIFICADO DE PASTAS E PHOTOCARDS (Flow Grid Contínuo: 2 Colunas Aberto, 1 Coluna Fechado) -->
<template x-if="viewMode === 'gallery' && galleryDisplayMode === 'folders'">
    <div class="grid grid-cols-2 xs:grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-3 sm:gap-4 mb-6">
        {% for group in cegs_groups %}
            <!-- Card da Pasta da CEG (Fechada 2:3 ou Gatefold Aberta 4:3) -->
            {% include 'participants/partials/_cegs_list_folder_card.html' %}

            <!-- Photocards da CEG (Injetados no grid em fluxo contínuo ao lado da pasta) -->
            {% for claim in group.claims %}
                {% include 'participants/partials/_cegs_list_card_item.html' %}
            {% endfor %}
        {% endfor %}
    </div>
</template>

<!-- 2. VISÃO EM TABELA & ACORDEÃO (Modo Tabela ou Visão Completa de Todos os Cards) -->
<template x-if="viewMode === 'table' || galleryDisplayMode === 'all'">
    <div>
        {% include 'participants/partials/_cegs_list_table_view.html' %}
    </div>
</template>
