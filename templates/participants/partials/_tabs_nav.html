{% comment %}Navegação do painel do joiner (P3): Pagar · Meus itens · Envios. IDs internos: pagar/reservas/caixinha.{% endcomment %}
<nav class="ui-toggle max-w-xl" aria-label="Seções da sua conta">
    <button type="button" @click="activeMainTab = 'pagar'" :class="activeMainTab === 'pagar' && 'is-on'"
            :aria-current="activeMainTab === 'pagar' ? 'page' : 'false'" class="flex items-center justify-center gap-1.5">
        Pagar{% if charges.count %} <span class="ui-mono text-[12px]">{{ charges.count }}</span>{% endif %}
    </button>
    <button type="button" @click="activeMainTab = 'reservas'" :class="activeMainTab === 'reservas' && 'is-on'"
            :aria-current="activeMainTab === 'reservas' ? 'page' : 'false'" class="flex items-center justify-center gap-1.5">
        Meus itens <span class="ui-mono text-[12px]">{{ total_claims_count|add:itens_individuais_count }}</span>
    </button>
    <button type="button" @click="activeMainTab = 'caixinha'" :class="activeMainTab === 'caixinha' && 'is-on'"
            :aria-current="activeMainTab === 'caixinha' ? 'page' : 'false'" class="flex items-center justify-center gap-1.5">
        Envios{% if total_caixinha_disponivel > 0 %} <span class="ui-mono text-[12px]">{{ total_caixinha_disponivel }}</span>{% endif %}
    </button>
</nav>
