{% comment %}Prévia de um item do joiner: foto, etapa (mesmas 5 de Meus itens), frete/taxa, pacote e Pix pendente.{% endcomment %}
<div x-show="previewModalOpen" x-cloak class="ui-scrim flex items-end sm:items-center justify-center p-0 sm:p-4"
     @click.self="closePreview()" @keydown.escape.window="closePreview()">
    <div class="ui-sheet sm:!rounded-ui-card w-full sm:max-w-md max-h-[92vh] overflow-y-auto space-y-4" role="dialog" aria-modal="true" aria-labelledby="preview-title">
        <div class="flex items-start justify-between gap-3">
            <div class="min-w-0">
                <p class="ui-label truncate" x-text="(previewItem?.ceg || '') + (previewItem?.set ? ' · Set ' + previewItem.set : '')"></p>
                <h2 id="preview-title" class="ui-disp text-2xl" x-text="previewItem?.title"></h2>
            </div>
            <button type="button" class="ui-icon-btn flex-none" aria-label="Fechar" @click="closePreview()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
            </button>
        </div>

        <div class="ui-pc w-full max-w-[240px] mx-auto">
            <template x-if="previewItem?.image"><img :src="previewItem.image" :alt="previewItem.title"></template>
            <template x-if="!previewItem?.image"><span class="ui-pc-empty font-bold" x-text="previewItem?.title"></span></template>
        </div>
        <p class="text-center ui-mono text-lg font-bold" x-show="previewItem?.price">R$ <span x-text="brl(previewItem?.price)"></span></p>

        <template x-if="previewItem?.lifecycle">
            <div class="ui-well p-3.5 space-y-2.5">
                <div class="grid grid-cols-5 gap-1.5" aria-hidden="true">
                    <template x-for="(name, i) in stageNames" :key="name">
                        <div class="space-y-1">
                            <span class="block h-1.5 rounded-full" :style="'background:' + (i < previewStage ? 'var(--ui-seg-on)' : 'var(--ui-seg-off)')"></span>
                            <span class="block text-[11px] font-semibold text-center" :class="i < previewStage ? '' : 'ui-muted'" x-text="name"></span>
                        </div>
                    </template>
                </div>
                <p class="text-sm"><strong x-text="previewItem.lifecycle.label"></strong><span class="ui-muted" x-show="previewItem.lifecycle.detail" x-text="' · ' + previewItem.lifecycle.detail"></span></p>
            </div>
        </template>

        <template x-if="previewItem?.lifecycle">
            <dl class="grid grid-cols-2 gap-2 text-sm">
                <div class="ui-well p-3"><dt class="ui-label">Frete internacional</dt>
                    <dd class="ui-mono font-bold mt-0.5" x-text="previewItem.freteInter && previewItem.freteInter !== '0.00' ? ('R$ ' + brl(previewItem.freteInter) + (previewItem.isFretePaid ? ' · pago' : ' · a pagar')) : 'Não cobrado'"></dd></div>
                <div class="ui-well p-3"><dt class="ui-label">Taxa aduaneira</dt>
                    <dd class="ui-mono font-bold mt-0.5" x-text="previewItem.taxaAduaneira && previewItem.taxaAduaneira !== '0.00' ? ('R$ ' + brl(previewItem.taxaAduaneira) + (previewItem.isTaxaPaid ? ' · paga' : ' · a pagar')) : 'Não cobrada'"></dd></div>
            </dl>
        </template>

        <template x-if="previewItem?.pacoteId">
            <div class="ui-well flex items-center gap-3 p-3">
                <span class="flex-1 min-w-0">
                    <span class="block ui-label" x-text="'Pacote ' + previewItem.pacoteId"></span>
                    <span class="block ui-mono font-bold truncate" x-show="previewItem.pacoteTracking" x-text="previewItem.pacoteTracking"></span>
                </span>
                <template x-if="previewItem.pacoteUrl"><a :href="previewItem.pacoteUrl" target="_blank" rel="noopener noreferrer" class="ui-btn ui-btn-sm" style="background: var(--ui-surface); color: var(--ui-text)">Rastrear</a></template>
            </div>
        </template>

        <template x-if="previewItem?.lifecycle && !previewItem?.isItemPaid && previewItem?.pixKey">
            <button type="button" class="ui-btn ui-btn-primary w-full" @click="closePreview(); activeMainTab = 'pagar'">Pagar este item</button>
        </template>
        <template x-if="previewItem?.lifecycle?.code === 'READY_CAIXINHA'">
            <button type="button" class="ui-btn ui-btn-primary w-full" @click="closePreview(); activeMainTab = 'caixinha'">Pedir envio na caixinha</button>
        </template>
    </div>
</div>
