name: Test & Deploy to Oracle Cloud

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DEBUG: "True"
      SECRET_KEY: "ci-only-not-secret"
      WHATSAPP_PROVIDER: "console"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run test suite
        run: python manage.py test apps --noinput

      - name: Django deploy security checklist
        env:
          DEBUG: "False"
          SECRET_KEY: "ci-deploy-check-${{ github.run_id }}-not-a-real-secret-value-0123456789"
          ALLOWED_HOSTS: "valcegs.duckdns.org"
        run: python manage.py check --deploy --fail-level WARNING

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 150.136.166.17
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/ceg
            BACKUP_DIR=/home/ubuntu/ceg-backups bash scripts/backup_database.sh
            git reset --hard
            git pull origin main
            chmod +x entrypoint.sh scripts/*.sh || true
            docker compose up -d --build
            docker image prune -f
