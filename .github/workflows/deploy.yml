name: Deploy to Oracle Cloud

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 150.136.166.17
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            cd /home/ubuntu/ceg
            git reset --hard
            git pull origin main
            chmod +x scripts/*.sh docker/*.sh || true

            # Se ainda não migrou do Neon, executa a migração automática
            if [ ! -f .neon_migrated ]; then
              echo "⚡ [Deploy] Primeira execução: migrando bancos do Neon para o PostgreSQL local..."
              ./scripts/migrate_from_neon.sh
            else
              echo "🚀 [Deploy] Atualizando containers com banco de dados local..."
              docker compose up -d --build
            fi

            docker image prune -f

