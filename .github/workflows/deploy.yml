name: Test & Deploy to Oracle Cloud

on:
  push:
    branches:
      - main
      - develop   # só testa; o job de deploy roda apenas na main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DEBUG: "True"
      SECRET_KEY: "ci-only-not-secret"
      WHATSAPP_PROVIDER: "console"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Collect static files (manifest usado pelos templates, como em produção)
        run: python manage.py collectstatic --noinput

      - name: Run test suite
        run: python manage.py test apps --noinput

      - name: Django deploy security checklist
        env:
          DEBUG: "False"
          SECRET_KEY: "ci-deploy-check-${{ github.run_id }}-not-a-real-secret-value-0123456789"
          ALLOWED_HOSTS: "valcegs.duckdns.org"
          FIELD_ENCRYPTION_KEY: "PvBl4dRZHZK0Xs-UbheEbyh495jHI5KleOOxXwgYGMs="  # chave descartável, só para o CI
        run: python manage.py check --deploy --fail-level WARNING

      - name: Docker image builds (collectstatic, non-root user)
        run: |
          docker build -t ceg-ci .
          docker run --rm --entrypoint sh ceg-ci -c '
            test "$(whoami)" = app &&
            test -f /app/staticfiles/staticfiles.json &&
            test ! -e /app/.env && test ! -e /app/backups'

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          FIELD_ENCRYPTION_KEY: ${{ secrets.FIELD_ENCRYPTION_KEY }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        with:
          host: 150.136.166.17
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          envs: FIELD_ENCRYPTION_KEY,BACKUP_PASSPHRASE
          script: |
            set -e
            cd /home/ubuntu/ceg
            touch .env && chmod 600 .env

            # Completa o .env do servidor. NUNCA sobrescreve um valor existente
            # (trocar FIELD_ENCRYPTION_KEY tornaria os endereços ilegíveis).
            ensure_var() {
              if ! grep -q "^$1=." .env; then
                sed -i "/^$1=\s*$/d" .env
                printf '%s=%s\n' "$1" "$2" >> .env
                echo "[env] $1 adicionada ao .env"
              fi
            }
            # Senha com que o volume do Postgres foi inicializado (antigo default do compose).
            ensure_var POSTGRES_PASSWORD "valcegs_secure_password_2026"
            ensure_var SECRET_KEY "$(openssl rand -hex 48)"
            [ -n "$FIELD_ENCRYPTION_KEY" ] && ensure_var FIELD_ENCRYPTION_KEY "$FIELD_ENCRYPTION_KEY"
            [ -n "$BACKUP_PASSPHRASE" ] && ensure_var BACKUP_PASSPHRASE "$BACKUP_PASSPHRASE"
            # Produção nunca roda com DEBUG ligado.
            sed -i 's/^DEBUG=.*/DEBUG=False/' .env
            # A porta 8080 da Evolution agora só escuta em localhost: o Django usa a rede interna.
            sed -i -E 's#^EVOLUTION_API_URL=https?://(localhost|127\.0\.0\.1|150\.136\.166\.17)(:8080)?/?$#EVOLUTION_API_URL=http://valcegs-evolution:8080#' .env

            # Variáveis obrigatórias: sem elas o container não sobe. Aborta antes do build
            # para que a versão atual continue no ar.
            for var in SECRET_KEY POSTGRES_PASSWORD FIELD_ENCRYPTION_KEY; do
              grep -q "^${var}=." .env || { echo "ERRO: defina ${var} no .env do servidor"; exit 1; }
            done
            BACKUP_DIR=/home/ubuntu/ceg-backups bash scripts/backup_database.sh
            git reset --hard
            git pull origin main
            chmod +x entrypoint.sh scripts/*.sh || true
            docker compose up -d --build
            docker image prune -f
