services:
  postgres:
    image: postgres:16-alpine
    container_name: valcegs-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-valcegs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-valcegs_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-valcegs_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-dbs.sh:/docker-entrypoint-initdb.d/init-dbs.sh:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-valcegs} -d ${POSTGRES_DB:-valcegs_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: valcegs-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  ceg-web:
    build: .
    container_name: valcegs-web
    restart: unless-stopped
    env_file: .env
    expose:
      - "8000"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  evolution-api:
    image: evoapicloud/evolution-api:v2.3.0
    container_name: valcegs-evolution
    restart: unless-stopped
    env_file: .env
    ports:
      - "8080:8080"
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  caddy:
    image: caddy:alpine
    container_name: valcegs-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - ceg-web
      - evolution-api

volumes:
  postgres_data:
  redis_data:
  evolution_instances:
  evolution_store:
  caddy_data:
  caddy_config:


